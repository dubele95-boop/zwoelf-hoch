<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zwölf hoch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a dark card table. Opponents along the top, shared piles in the middle, your own area at the bottom. Single deliberate dark look. */
:root{
  --table:#1c1a29; --table-2:#252236; --table-3:#2f2b44;
  --line:rgba(236,228,255,.10); --line-2:rgba(236,228,255,.22);
  --ink:#f1ece2; --muted:#a6a0bb; --accent:#f2b84b; --accent-ink:#2a1f05;
  --card:#f6f0e4; --card-ink:#26233a;
  --g1:#1d7d8f; --g2:#7650c2; --g3:#d4562c;
  --jk:#2b2542; --danger:#ef6b5b; --ok:#57c29a;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cw:clamp(46px,6.2vw,86px); --cws:clamp(30px,2.9vw,44px);
  --r:9px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--table);background-image:radial-gradient(ellipse 90% 60% at 50% 45%,var(--table-2),var(--table) 70%);color:var(--ink);font:15px/1.5 var(--f-body)}
#app{max-width:1440px;margin:0 auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font:900 30px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{color:var(--muted);font-size:13px}
.bar .actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line-2);background:var(--table-3);padding:8px 14px;border-radius:8px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:rgba(239,107,91,.5);color:#ffb3a8}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.panel{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:16px}
.muted{color:var(--muted)}
input[type=text],select{background:var(--table);border:1px solid var(--line-2);color:var(--ink);border-radius:8px;padding:9px 12px;font:inherit;min-width:0}
body.busy{cursor:progress}

/* Home */
.home{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:16px;align-items:start}
.home .hero h1{font:900 clamp(40px,6vw,72px)/.92 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.home .hero h1 em{font-style:normal;color:var(--accent)}
.home .hero p{max-width:58ch;color:var(--muted);margin:10px 0 0}
.fan{display:flex;margin:18px 0 6px;padding-left:10px}
.fan .card{margin-left:-14px;transform:rotate(calc((var(--k) - 2.5) * 5deg)) translateY(calc(var(--d) * 1px))}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:flex;flex-direction:column;gap:6px}
.glist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.gitem{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.15)}
.gitem .code{font:800 22px/1 var(--f-display);letter-spacing:.08em}
.gitem .who{color:var(--muted);font-size:13px;min-width:0;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:2px 8px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted)}
.pill.live{color:var(--ok);border-color:rgba(87,194,154,.45)}
.pill.wait{color:var(--accent);border-color:rgba(242,184,75,.45)}
.rules ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:65ch}
.empty{color:var(--muted);padding:14px;border:1px dashed var(--line-2);border-radius:10px;text-align:center}

/* Lobby */
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.bigcode{font:900 clamp(56px,9vw,96px)/1 var(--f-display);letter-spacing:.12em;color:var(--accent)}
.plist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:rgba(0,0,0,.18)}

/* Cards */
.card,.back,.slot{width:var(--cw);aspect-ratio:5/7;border-radius:var(--r);position:relative;flex:none;box-sizing:border-box}
.card{background:var(--card);color:var(--c);border:1px solid rgba(0,0,0,.25);box-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.25);display:grid;place-items:center}
.card::before{content:"";position:absolute;inset:4px;border:1.5px solid var(--c);border-radius:calc(var(--r) - 4px);opacity:.55}
.card .n{font:900 calc(var(--cw) * .62)/1 var(--f-display);letter-spacing:-.02em}
.card .c{position:absolute;font:800 calc(var(--cw) * .17)/1 var(--f-display)}
.card .tl{top:8%;left:12%}.card .br{bottom:8%;right:12%;transform:rotate(180deg)}
.card.g1{--c:var(--g1)}.card.g2{--c:var(--g2)}.card.g3{--c:var(--g3)}
.card.sp{--c:var(--accent);background:var(--card)}
.card.sp .diag{position:absolute;inset:12% 14%;background:linear-gradient(to top right,transparent calc(50% - .75px),rgba(38,35,58,.35) 50%,transparent calc(50% + .75px))}
.card.sp .sa,.card.sp .sb{position:absolute;font:900 calc(var(--cw) * .44)/1 var(--f-display);letter-spacing:-.02em}
.card.sp .sa{top:11%;left:14%}.card.sp .sb{bottom:11%;right:14%}
.card.sp .or{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-54deg);font:700 calc(var(--cw) * .11)/1 var(--f-body);color:var(--card-ink);background:var(--card);padding:0 3px;text-transform:uppercase;letter-spacing:.06em}
.sm .card.sp .or{display:none}
.special{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.15)}
.special.on{border-color:rgba(242,184,75,.5)}
.toggle{flex:none;width:48px;height:28px;border-radius:99px;border:1px solid var(--line-2);background:var(--table);position:relative;padding:0}
.toggle i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:transform .15s ease}
.toggle[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.toggle[aria-checked="true"] i{transform:translateX(20px);background:var(--accent-ink)}
.card.sk::before{border-color:var(--accent);opacity:.95}
.card .skb{position:absolute;top:7%;right:9%;width:calc(var(--cw) * .24);height:calc(var(--cw) * .24);color:var(--danger)}
.card .skb svg,.pill.skip svg,.skipbig svg{width:100%;height:100%;display:block}
.sm .card .skb{top:4%;right:5%;width:calc(var(--cws) * .32);height:calc(var(--cws) * .32)}
.pill.bot{color:#9ec3ff;border-color:rgba(143,180,255,.45);font-size:10px;padding:1px 6px;vertical-align:middle}
.pill.skip{display:inline-flex;align-items:center;gap:5px;color:#ffb3a8;border-color:rgba(239,107,91,.5)}
.pill.skip svg{width:12px;height:12px}
.modalbox.managebox{max-width:620px;max-height:min(90vh,900px);overflow:auto;align-items:stretch;text-align:left;gap:12px}
.modalbox.managebox h2{text-align:center}
.modalbox.statsbox{max-width:900px;max-height:min(90vh,900px);overflow:auto;align-items:stretch;text-align:left;gap:14px}
.awards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:8px}
.award{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:rgba(242,184,75,.08);border:1px solid rgba(242,184,75,.3);font-size:14px}
.award .aicon{width:24px;height:24px;flex:none;color:var(--accent)}
.award .aicon svg{width:24px;height:24px;display:block}
.tablewrap{overflow-x:auto}
.stattable{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.stattable th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--line-2);vertical-align:bottom;line-height:1.25;hyphens:manual;max-width:92px}
.stattable th:nth-child(2){text-align:left}
.stattable td{padding:7px 8px;border-bottom:1px solid var(--line)}
.stattable td.num{text-align:right}
.stattable td.nm{white-space:nowrap}
.stattable tr.me td{background:rgba(242,184,75,.07)}
.winlist{display:flex;flex-wrap:wrap;gap:6px}
.modalbox.rulesbox{max-width:640px;max-height:min(86vh,820px);overflow:auto;align-items:stretch;text-align:left;gap:14px}
.ruleshead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.rulelist{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.rulecards{display:flex;flex-direction:column;gap:10px}
.rulecard{display:flex;gap:14px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.15)}
.rulecardimg{--cw:58px;flex:none}
.rematch{border-color:rgba(242,184,75,.55);background:rgba(242,184,75,.08);margin-bottom:16px}
.confgrid{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;text-align:left;width:100%;font-size:15px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(10,8,20,.6);display:grid;place-items:center;padding:16px}
.modalbox{background:var(--table-2);max-width:440px;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.modal.side{background:none;pointer-events:none;place-items:center end;padding:12px}
.modal.side .modalbox{pointer-events:auto;max-width:min(360px,94vw)!important;max-height:calc(100vh - 24px);overflow:auto;padding:16px;gap:10px;background:rgba(30,26,48,.95);border:2px solid var(--accent);box-shadow:0 14px 40px rgba(0,0,0,.55)}
.modal.side .modalbox h2{font-size:22px}
.modal.side .skipbig{width:30px;height:30px}
.modal.side .choose{justify-content:center}
@media (max-width:760px){.modal.side{place-items:end center}.modal.side .modalbox{max-height:55vh}}
.modalbox h2{font:900 32px/1 var(--f-display);text-transform:uppercase}
.skipbig{width:44px;height:44px;color:var(--danger)}
.choose{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:6px}
.choose .btn{padding:10px 18px;font-size:16px}
.card.spy{--c:var(--accent);background:linear-gradient(160deg,#6a2f7e,#2c1238);color:#f6f0e4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6%}
.card.spy .ricon{width:60%;color:#ffd27a}
.card.spy .ricon svg{width:100%;height:auto;display:block}
.sm .card.spy .glabel{display:none}
.sm .card.spy .ricon{width:78%}
.card.st{--c:var(--accent);background:linear-gradient(160deg,#2b3f78,#141d3d);color:#f6f0e4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6%}
.card.st .ricon{width:60%;color:#ffd27a}
.card.st .ricon svg{width:100%;height:auto;display:block}
.sm .card.st .glabel{display:none}
.sm .card.st .ricon{width:78%}
.opp.tgt .mini{cursor:pointer}
.card.rv{--c:var(--accent);background:linear-gradient(160deg,#8a2f3c,#4e1622);color:#f6f0e4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6%}
.card.rv .ricon{width:54%;color:#ffd27a}
.card.rv .ricon svg{width:100%;height:auto;display:block}
.sm .card.rv .glabel{display:none}
.sm .card.rv .ricon{width:72%}
.bpile.down .face .card,.bpile.down .face .slot{box-shadow:0 0 0 2px rgba(239,107,91,.7),0 6px 14px rgba(0,0,0,.25)}
.downtag{color:#ffb3a8;font-weight:700}
.card.gf{--c:var(--accent);background:linear-gradient(160deg,#2f7a60,#1b4a3b);color:#f6f0e4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%}
.card.gf .gicon{width:52%;color:#ffd27a}
.card.gf .gicon svg{width:100%;height:auto;display:block}
.card .glabel{font:800 calc(var(--cw) * .15)/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.sm .card.gf .glabel{display:none}
.sm .card.gf .gicon{width:70%}
.opp.tgt{cursor:pointer}
.giftcards .cbtn{--cw:72px}
.card.sp.spa .c{font-size:calc(var(--cw) * .13)}
.card.rv.rva{color:#ffd27a;display:grid}
.card.rv.rva .n{font-size:calc(var(--cw) * .62)}
.card.rv.rva .c.br{transform:none}
.card.j.ja .n{font-size:calc(var(--cw) * .62)}
.card.j{--c:var(--accent);background:var(--jk);color:var(--accent)}
.card.j .n{font-size:calc(var(--cw) * .5)}
.card .as{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font:800 12px/1 var(--f-body);padding:3px 6px;border-radius:99px;white-space:nowrap}
.back{background-color:var(--bk-base);background-image:var(--bk-img);border:1px solid rgba(0,0,0,.4);box-shadow:0 2px 0 rgba(0,0,0,.3),0 6px 14px rgba(0,0,0,.25);display:grid;place-items:center;overflow:hidden}
.back::before{content:"";position:absolute;inset:calc(var(--cw) * .07);border:1.5px solid var(--bk-line);border-radius:calc(var(--r) - 3px);opacity:.8}
.back .emb{position:relative;width:calc(var(--cw) * .5);aspect-ratio:1;border-radius:50%;background:var(--bk-base);border:2px solid var(--bk-line);box-shadow:0 0 0 calc(var(--cw) * .04) var(--bk-base);display:grid;place-items:center;font:900 calc(var(--cw) * .22)/1 var(--f-display);color:var(--bk-line);letter-spacing:-.02em}
.back .emb small{font-size:.55em;margin-left:1px;transform:translateY(-.35em)}
.back.mb{--cw:11px;--r:2px;width:11px;margin-left:-5px;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.back.mb::before{display:none}
body,[data-back="gitter"]{--bk-base:#3a2f63;--bk-line:#f2b84b;--bk-img:repeating-linear-gradient(45deg,rgba(242,184,75,.24) 0 2px,transparent 2px 8px),repeating-linear-gradient(-45deg,rgba(170,130,255,.32) 0 2px,transparent 2px 8px)}
[data-back="sonne"]{--bk-base:#123f4f;--bk-line:#ffd27a;--bk-img:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,210,122,.30) 0 5deg,transparent 5deg 15deg),radial-gradient(circle at 50% 50%,#1f7085,#0d2c38 78%)}
[data-back="welle"]{--bk-base:#4a1f1a;--bk-line:#ff9a6a;--bk-img:repeating-radial-gradient(circle at 50% 50%,rgba(255,154,106,.30) 0 2px,transparent 2px 7px),linear-gradient(160deg,#6d2b20,#2a1310)}
.backpick{display:flex;gap:14px;flex-wrap:wrap}
.backpick button{background:none;border:0;padding:6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.backpick button .back{--cw:58px}
.backpick button[aria-pressed="true"]{outline:2px solid var(--accent);color:var(--ink)}
.drawn{display:flex;flex-direction:column;align-items:center;gap:6px}
.drawn small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.slot{border:1.5px dashed var(--line-2);display:grid;place-items:center;color:var(--muted);font:800 calc(var(--cw) * .32)/1 var(--f-display)}
.sm{--cw:var(--cws);--r:6px}
.sm .card .c{display:none}.sm .card::before{inset:2px}


.cbtn{background:none;border:0;padding:0;border-radius:var(--r);transition:transform .15s ease}
.mine.turn .cbtn,.mine.turn .dpile{cursor:grab;touch-action:none}
body.dragging,body.dragging *{cursor:grabbing!important;user-select:none}
.dragghost{position:fixed;z-index:35;pointer-events:none;transform:rotate(-4deg) scale(1.08);filter:drop-shadow(0 16px 24px rgba(0,0,0,.5))}
.over{outline:3px solid #fff!important;outline-offset:5px;transform:scale(1.06);transition:transform .12s ease}
.cbtn.sel{transform:translateY(-10px)}
.cbtn.sel>.card{outline:3px solid var(--accent);outline-offset:2px}
.tgt{outline:3px solid var(--accent);outline-offset:4px;border-radius:12px}
.tgt.soft{outline-color:rgba(242,184,75,.45);animation:none}
@keyframes glow{50%{outline-color:rgba(242,184,75,.35)}}
.land{animation:land .28s ease-out}
@keyframes land{from{transform:scale(1.15) translateY(-6px)}to{transform:none}}
.ghost{position:fixed;z-index:30;pointer-events:none;transform-origin:0 0;will-change:transform}
.ghost .card{box-shadow:0 14px 30px rgba(0,0,0,.45)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.banner.pulse{animation:pulse 1.1s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,184,75,.6)}100%{box-shadow:0 0 0 18px rgba(242,184,75,0)}}
.bpile .face.cleared{animation:cleared .6s ease-out}
@keyframes cleared{0%{transform:scale(1.25);filter:brightness(1.8)}100%{transform:none;filter:none}}
.winner{animation:winIn .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes winIn{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.sndbtn{display:inline-flex;align-items:center;gap:6px}
.sndbtn svg{width:16px;height:16px}

/* Game */
.banner{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.banner.me{background:rgba(242,184,75,.12);border-color:rgba(242,184,75,.5)}
.banner .msg{font-weight:700;font-size:16px}
.banner .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.opps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:10px}
.opp{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.16);display:flex;flex-direction:column;gap:8px;min-width:0}
.opp.turn{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.opp .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.opp .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.opp .rowc{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.mini{display:flex;flex-direction:column;align-items:center;gap:3px}
.mini small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.discs{display:flex;gap:4px}
.hcount{display:flex;align-items:center;justify-content:flex-end;gap:6px;font-size:13px;color:var(--muted);flex-basis:100%;min-height:16px}
.hcount .dots{max-width:120px;overflow:hidden}
.hcount .dots{display:flex}
.hcount .dots{padding-left:5px}
.mid{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:start;padding:18px;border-radius:16px;background:rgba(0,0,0,.18);border:1px solid var(--line)}
.pilegrp{display:flex;flex-direction:column;gap:8px;align-items:center}
.builds{display:flex;gap:clamp(10px,2vw,26px);flex-wrap:wrap;justify-content:center}
.bpile{background:none;border:0;padding:4px;display:flex;flex-direction:column;align-items:center;gap:14px}
.bpile .need{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.midspacer{width:var(--cw)}
.slogwrap{align-items:stretch;width:270px;min-width:0}
.slog{height:170px;overflow:auto;display:flex;flex-direction:column;gap:6px;padding-right:4px;font-size:13px}

    fly(cardHTML(mv.v), fromRect, dstEl(mv));
  }
  if(fresh && mv.skipNone){
    const nm = mv.pid === S.me ? 'Du spielst' : ((g.players.find(p => p.id === mv.pid) || {}).name || 'Jemand') + ' spielt';
    toast(nm + ' Aussetzen – aber alle anderen setzen schon aus. Die Karte wirkt diesmal nicht.');
  }
  if(fresh && (mv.kind === 'skipped' || mv.skipTarget)){
    const target = mv.target || mv.skipTarget;
    const name = id => (g.players.find(p => p.id === id) || {}).name || 'Jemand';
    const gt = mv.gag && GAG_TXT[mv.gag];
    if(target === S.me){ toast(gt ? gt(name(mv.pid), 'dir') + ' – du setzt aus!' : name(mv.pid) + ' lässt dich aussetzen!'); if(!mv.gag) Snd.play('skip'); }
    else if(mv.pid !== S.me) toast(gt ? gt(name(mv.pid), name(target)) + ' – ' + name(target) + ' setzt aus.' : name(mv.pid) + ' lässt ' + name(target) + ' aussetzen.');
    else toast(gt ? gt('Du', name(target)).replace(' wirft ', ' wirfst ').replace(' klatscht ', ' klatschst ') + ' – ' + name(target) + ' setzt aus.' : name(target) + ' setzt beim nächsten Mal aus.');
    if(mv.gag && GAGS[mv.gag]) setTimeout(() => showGag(mv.gag, mv.pid, target), 150);
  }
  if(fresh && mv.kind === 'deal'){
    Snd.play('deal');
  }
  if(fresh && mv.kind === 'play' && mv.reversed){
    const who = mv.pid === S.me ? 'Du drehst' : ((g.players.find(p => p.id === mv.pid) || {}).name || 'Jemand') + ' dreht';
    toast(who + ' Stapel ' + (mv.pile + 1) + ' um: jetzt ' + (isDown(g, mv.pile) ? 'abwärts bis 1.' : 'wieder aufwärts.'));
  }
  if(fresh && mv.kind === 'spyLook'){
    const name = id => (g.players.find(p => p.id === id) || {}).name || 'Jemand';
    Snd.play('spy', 0, mv.pid === S.me || mv.target === S.me ? 1 : .6);
    if(mv.target === S.me) toast(name(mv.pid) + ' spioniert: Er schaut sich deine Handkarten an!');
    else if(mv.pid !== S.me) toast(name(mv.pid) + ' spioniert bei ' + name(mv.target) + '.');
    if(mv.win){ Snd.play('win'); FX.confetti(); }
  }
  if(fresh && mv.kind === 'spy'){
    const name = id => (g.players.find(p => p.id === id) || {}).name || 'Jemand';
    if(mv.pid === S.me){
      fly(cardHTML(mv.sv), rectOf(q('.opp[data-pid="' + mv.target + '"] [data-k="hand"]')), q('.hand [data-act="hand"][data-i="' + (g.hand.length - 1) + '"] .card'), { dur: 560 });
    } else {
      const from = mv.target === S.me ? rectOf(q('.hand')) : rectOf(q('.opp[data-pid="' + mv.target + '"] [data-k="hand"]'));
      fly(backHTML(), from, q('.opp[data-pid="' + mv.pid + '"] [data-k="hand"]'), { dur: 560 });
      if(mv.target === S.me) toast(name(mv.pid) + ' hat dir ' + (mv.sv === 0 ? 'einen Joker' : 'eine ' + cardName(mv.sv)) + ' weggenommen!');
      else toast(name(mv.pid) + ' nimmt ' + name(mv.target) + ' eine Karte weg.');
    }
  }
  if(fresh && mv.kind === 'steal'){
    Snd.play('steal', 0, mv.pid === S.me || mv.target === S.me ? 1 : .6);
    const name = id => (g.players.find(p => p.id === id) || {}).name || 'Jemand';
    if(mv.pid === S.me){
      const el = q('.hand [data-act="hand"][data-i="' + (g.hand.length - 1) + '"] .card');
      fly(cardHTML(mv.sv), stealFrom, el, { dur: 520 });
    } else {
      fly(cardHTML(mv.sv), stealFrom, q('.opp[data-pid="' + mv.pid + '"] [data-k="hand"]'), { dur: 520 });
      if(mv.target === S.me) toast(name(mv.pid) + ' hat dir ' + (mv.sv === 0 ? 'einen Joker' : 'eine ' + cardName(mv.sv)) + ' geklaut!');
      else toast(name(mv.pid) + ' klaut ' + name(mv.target) + ' ' + (mv.sv === 0 ? 'einen Joker' : 'eine ' + cardName(mv.sv)) + '.');
    }
    if(mv.win){ Snd.play('win'); FX.confetti(); }
  }
  if(fresh && mv.kind === 'gift'){
    Snd.play('gift', 0, mv.pid === S.me || mv.target === S.me ? 1 : .6);
    const name = id => (g.players.find(p => p.id === id) || {}).name || 'Jemand';
    if(mv.target === S.me){
      toast(name(mv.pid) + ' hat dir eine Karte geschenkt!');
      const el = q('.hand [data-act="hand"][data-i="' + (g.hand.length - 1) + '"] .card');
      fly(cardHTML(g.hand[g.hand.length - 1]), giftFrom, el, { dur: 520 });
    } else {
      const el = q('.opp[data-pid="' + mv.target + '"] [data-k="hand"]');
      fly(backHTML(), giftFrom, el, { dur: 520 });
      if(mv.pid !== S.me) toast(name(mv.pid) + ' schenkt ' + name(mv.target) + ' eine Karte.');
    }
    if(mv.win){ Snd.play('win'); FX.confetti(); }
  }
  // neue Handkarten fliegen vom Nachziehstapel herein
  if(g.status === 'playing'){
    let base = oldHand;
    if(fresh && mv.kind === 'deal') base = 0;
    else if(fresh && mv.kind === 'gift' && mv.target === S.me) base = g.hand.length;
    else if(fresh && mv.kind === 'steal') base = g.hand.length;
    else if(fresh && mv.kind === 'spy' && (mv.pid === S.me || mv.target === S.me)) base = g.hand.length;
    else if(fresh && mv.kind === 'gift' && mv.pid === S.me) base = Math.max(0, oldHand - (mv.src === 'hand' ? 1 : 0) - (mv.giveSrc === 'disc' ? 0 : 1));
    else if(fresh && mv.pid === S.me && mv.src === 'hand') base = Math.max(0, oldHand - 1);
    for(let i = base, k = 0; i < g.hand.length; i++, k++){
      const el = q('.hand [data-act="hand"][data-i="' + i + '"] .card');
      fly(cardHTML(g.hand[i]), drawRect, el, { delay: 120 + k*80, dur: 380, fadeIn: true });
    }
  }
  if(mine && !wasMine){
    setTimeout(() => Snd.play('turn'), fresh && mv.kind === 'deal' ? 500 : 250);
  }
}

    else startSteal(sl.src, sl.i, sl.v, o.dataset.pid, i);
    render();
  },
  stealPick(i){

  spyTake(i){ const sp = S.game && S.game.spy; if(!sp || !sp.hand) return; send({t:'spyTake', k:i, v:sp.hand[i]}); },

    S.gift = null;
    send({t:'gift', src:gft.src, i:gft.i, v:gft.v, target:gft.target, giveSrc:'disc', give:i, gv:top(d)}); render();
  },
  giftCancel(){ S.gift = null; render(); },
  chooseSkip(_, b){ send({t:'chooseSkip', target:b.dataset.pid}); },

  hand(i){ selectCard({src:'hand', i}); },
  stock(){ selectCard({src:'stock'}); },
  disc(i){
    if(S.sel && S.sel.src === 'hand'){ const s = S.sel; S.sel = null; send({t:'discard', i:s.i, v:s.v, to:i}); render(); return; }

  build(i){

    if(!playable(S.game, S.sel.v, i)){ Snd.play('error'); return toast(failMsg(S.game, S.sel.v, i)); }

    send({t:'play', src:s.src, i:s.i, v:s.v, pile:i}); render();

};
function selectCard(sel){
  if(!myTurn()) return toast('Du bist gerade nicht dran.');
  if(S.game.spy) return toast('Nimm dir zuerst eine Karte beim Spionieren.');
  const v = cardAt(sel); if(v == null) return;
  if(S.sel && S.sel.src === sel.src && S.sel.i === sel.i) S.sel = null; else S.sel = {...sel, v};
  render();
}
function bind(root){
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-act]'); if(!b || b.disabled) return;
    const f = H[b.dataset.act]; if(f) f(+b.dataset.i, b);
  });
}

/* ---------- Ziehen & Ablegen (Maus und Touch) ---------- */
const D = { start:null, active:false, ghost:null, sel:null, over:null, ox:0, oy:0, justDragged:false };
function dragSource(t){
  const b = t.closest && t.closest('.mine [data-act="hand"], .mine [data-act="stock"], .mine [data-act="disc"]');
  if(!b) return null;
  const act = b.dataset.act;
  return { src: act, i: act === 'stock' ? undefined : +b.dataset.i };
}
function dropTarget(x, y){
  const el = document.elementFromPoint(x, y);
  return el && el.closest('[data-act="build"], .mine [data-act="disc"], .opp [data-k="disc"], .opp[data-pid]');
}
// Ziel bei einem Mitspieler: ganzer Kasten oder einer seiner Ablagestapel
function oppDrop(t){
  const o = t && t.closest('.opp[data-pid]'); if(!o) return null;
  return { pid: o.dataset.pid, pile: t.dataset.k === 'disc' ? +t.dataset.i : null, box: o };
}
const oppPiles = id => { const p = S.game.players.find(x => x.id === id); return p ? p.discards : [[],[],[],[]]; };
const canStealFrom = id => oppPiles(id).some(d => d.length);
// Geschenk ist deine letzte Handkarte: dann darfst du die oberste Karte eines Ablagestapels verschenken
function giftDiscHTML(g, gft){
  const me = g.players.find(p => p.id === S.me);
  const piles = me.discards.map((d, i) => (gft.src === 'disc' && gft.i === i) ? d.slice(0, -1) : d);   // die Geschenk-Karte selbst zählt nicht
  const opts = piles.map((d, i) => d.length ? '<button type="button" class="cbtn" data-act="giftGiveDisc" data-i="' + i + '" aria-label="' + esc(cardName(top(d))) + ' von Ablagestapel ' + (i+1) + ' verschenken">' + cardHTML(top(d)) + '</button>' : '').join('');
  return opts ? '<p class="muted" style="margin:0">Du hast keine andere Handkarte. Verschenke stattdessen die oberste Karte eines deiner Ablagestapel.</p><div class="choose giftcards">' + opts + '</div>'
              : '<p class="muted" style="margin:0">Du hast keine Handkarte und keine Ablagekarte zum Verschenken.</p>';
}
function startSpy(src, i, pid){
  const p = S.game.players.find(x => x.id === pid);
  if(!p || !p.handCount){ Snd.play('error'); toast((p ? p.name : 'Jemand') + ' hat gerade keine Handkarten.'); return false; }
  return send({t:'spyLook', src, i, v:600, target:pid});
}
function startSteal(src, i, v, pid, pile){
  const piles = oppPiles(pid), name = (S.game.players.find(x => x.id === pid) || {}).name || 'Jemand';
  if(!canStealFrom(pid)){ Snd.play('error'); toast(name + ' hat nichts auf den Ablagestapeln.'); return false; }
  S.steal = { src, i, v, target: pid }; return false;
}
view.addEventListener('pointerdown', e => {
  if(e.button !== 0 || !myTurn()) return;
  const src = dragSource(e.target); if(!src) return;
  const v = cardAt(src); if(v == null) return;
  D.start = { x:e.clientX, y:e.clientY, src, v, id:e.pointerId };
});
document.addEventListener('pointermove', e => {
  if(!D.start || e.pointerId !== D.start.id) return;
  if(!D.active){
    if(Math.hypot(e.clientX - D.start.x, e.clientY - D.start.y) < 6) return;
    const srcCard = srcEl({pid:S.me, src:D.start.src.src, i:D.start.src.i});
    const r = rectOf(srcCard); if(!r) { D.start = null; return; }
    D.active = true; document.body.classList.add('dragging');
    D.ox = D.start.x - r.left; D.oy = D.start.y - r.top;
    S.sel = { ...D.start.src, v: D.start.v }; S.dragHide = D.start.src;
    render();
    D.ghost = document.createElement('div'); D.ghost.className = 'dragghost';
    D.ghost.style.cssText = 'left:0;top:0;width:' + r.width + 'px;--cw:' + r.width + 'px';
    D.ghost.innerHTML = cardHTML(D.start.v); document.body.appendChild(D.ghost);
  }
  e.preventDefault();
  D.ghost.style.left = (e.clientX - D.ox) + 'px'; D.ghost.style.top = (e.clientY - D.oy) + 'px';
  const t = dropTarget(e.clientX, e.clientY);
  const od = oppDrop(t);
  let ok, ov;
  if(od){
    if(isGift(D.start.v)){ ok = true; ov = od.box; }
    else if(isSpy(D.start.v)){ const op = S.game.players.find(x => x.id === od.pid); ok = !!(op && op.handCount); ov = od.box; }
    else if(isSteal(D.start.v)){ ok = canStealFrom(od.pid); ov = od.box; }
    else ok = false;
  } else {
    ok = t && (t.dataset.act === 'build' ? playable(S.game, D.start.v, +t.dataset.i) : D.start.src.src === 'hand');
    ov = t ? (t.querySelector('.face') || t) : null;
  }
  if(!ok) ov = null;
  if(ov !== D.over){ if(D.over) D.over.classList.remove('over'); D.over = ov; if(ov) ov.classList.add('over'); }
}, {passive:false});
function endDrag(e, cancel){
  if(!D.start || (e && e.pointerId !== D.start.id)) return;
  const st = D.start; D.start = null;
  if(!D.active) return;
  D.active = false; D.justDragged = true; setTimeout(() => D.justDragged = false, 50);
  document.body.classList.remove('dragging');
  if(D.over) D.over.classList.remove('over');
  let t = !cancel && e ? dropTarget(e.clientX, e.clientY) : null;
  const gRect = D.ghost.getBoundingClientRect();
  let sent = false;
  let sentSteal = false;
  const od = oppDrop(t);
  if(t && myTurn() && od){
    if(isGift(st.v)) S.gift = { src: st.src.src, i: st.src.i, v: st.v, target: od.pid };
    if(isSteal(st.v)) sentSteal = startSteal(st.src.src, st.src.i, st.v, od.pid, od.pile);
    if(isSpy(st.v)) sentSteal = startSpy(st.src.src, st.src.i, od.pid);
    t = null;
  }
  if(t && myTurn()){
    const i = +t.dataset.i;
    if(t.dataset.act === 'build' && playable(S.game, st.v, i)){ sent = send({t:'play', src:st.src.src, i:st.src.i, v:st.v, pile:i}); }
    else if(t.dataset.act === 'disc' && st.src.src === 'hand'){ sent = send({t:'discard', i:st.src.i, v:st.v, to:i}); }
    else if(t.dataset.act === 'build'){ Snd.play('error'); toast(failMsg(S.game, st.v, i)); }
  }
  S.sel = null;
  if(sentSteal) sent = true;
  if(sent){ S.dropRect = gRect; D.ghost.remove(); D.ghost = null; render(); return; }
  // zurückfliegen
  S.dragHide = null; render();
  const back = srcEl({pid:S.me, src:st.src.src, i:st.src.i});
  const g = D.ghost; D.ghost = null; g.remove();
  if(back) fly(cardHTML(st.v), gRect, back, {dur:260});
}
document.addEventListener('pointerup', e => endDrag(e, false));
document.addEventListener('pointercancel', e => endDrag(e, true));
view.addEventListener('click', e => { if(D.justDragged){ e.stopPropagation(); e.preventDefault(); } }, true);

const manageEl = document.getElementById('manage');
bind(view); bind(barActions); bind(manageEl);
manageEl.addEventListener('click', e => { if(e.target === manageEl) closeManage(); });
manageEl.addEventListener('change', e => onCfgChange(e));
view.addEventListener('change', e => onCfgChange(e));
function onCfgChange(e){

  if(e.target.id === 'pilesSel' || e.target.id === 'downSel'){

  }
}
view.addEventListener('input', e => { if(e.target.id === 'nameInput'){ S.name = e.target.value; LS.set('zh.name', e.target.value.trim()); } });
view.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  if(e.target.id === 'codeInput') H.joinCode();
  if(e.target.id === 'nameInput'){ const c = document.getElementById('codeInput'); if(c && c.value.trim().length === 4) H.joinCode(); }

document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  if(!document.getElementById('manage').hidden){ closeManage(); return; }
  if(!document.getElementById('stats').hidden){ closeStats(); return; }
  if(!document.getElementById('rules').hidden){ closeRules(); return; }

});

/* ---------- Statistik nach der Runde ---------- */
function fmtDur(ms){ const m = Math.floor(ms / 60000), s = Math.round((ms % 60000) / 1000); return m ? m + ' Min. ' + s + ' Sek.' : s + ' Sek.'; }
function statsAwards(g){
  const st = g.stats.players, ps = g.players.filter(p => st[p.id]);
  const best = (key, min) => { const top = Math.max(...ps.map(p => st[p.id][key] || 0)); if(top < min) return null; return { n: top, who: ps.filter(p => (st[p.id][key] || 0) === top).map(p => p.name) }; };
  const names = a => a.length > 1 ? a.slice(0, -1).join(', ') + ' & ' + a[a.length - 1] : a[0];
  const out = [];
  const add = (icon, title, r, text) => { if(r) out.push({ icon, title, text: text(names(r.who), r.n, r.who.length > 1) }); };
  const I = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';

  const usable = Math.min(innerWidth, 1440) - 32;

    const discs = ds.map((d,i) => {
      const cwPx = S.cw || 70, n = d.length, off = n > 1 ? Math.min(cwPx * .24, cwPx * 1.1 / (n-1)) : 0;
      const h = 'calc(var(--cw) * 1.4 + ' + (off*(Math.max(n,1)-1)) + 'px)';
      const isSel = sel && sel.src === 'disc' && sel.i === i, tgt = sel && sel.src === 'hand';
      const cards = n ? d.map((v,k) => '<div style="top:' + (k*off) + 'px' + (isSel && k === n-1 ? ';transform:translateY(-10px)' : '') + '">' + cardHTML(v, '', isSel && k === n-1 ? 'outline:3px solid var(--accent);outline-offset:2px' : '') + '</div>').join('') : '<div style="top:0"><div class="slot"></div></div>';
      return '<button class="dpile' + (tgt ? ' tgt' : '') + '" data-act="disc" data-i="' + i + '" aria-label="Ablagestapel ' + (i+1) + '"' + (mine ? '' : ' tabindex="-1"') + '><div class="stack" style="height:' + h + '">' + cards + '</div></button>';
    }).join('');
    const handH = hand.map((v,i) => '<button class="cbtn' + (sel && sel.src === 'hand' && sel.i === i ? ' sel' : '') + '" data-act="hand" data-i="' + i + '"' + (mine ? '' : ' tabindex="-1"') + ' aria-label="Handkarte ' + cardName(v) + '">' + cardHTML(v) + '</button>').join('');
    me = '<section class="mine' + (mine ? ' turn' : '') + '">' +
      '<div class="grp"><div class="label">Dein Spielerstapel</div><div class="stockwrap">' +
        (stTop == null ? '<div class="slot">—</div>' : '<div class="stockpile">' + (p.stockCount > 1 ? backHTML() : '') + '<button class="cbtn' + (stockSel ? ' sel' : '') + '" data-act="stock" aria-label="Spielerstapel ' + cardName(stTop) + '"' + (mine ? '' : ' tabindex="-1"') + '>' + cardHTML(stTop) + '</button></div>') +
        '<div><div class="count">' + p.stockCount + '</div><div class="muted" style="font-size:12px">übrig</div></div></div>' +
        '<div class="hint"' + (stockFits && !stockSel ? '' : ' style="visibility:hidden"') + '>Deine Stapelkarte passt!</div>' +
      '</div>' +
      '<div class="grp"><div class="label">Deine Ablagestapel</div><div class="mydiscs">' + discs + '</div></div>' +
      '<div class="grp handgrp"><div class="label">Deine Hand</div><div class="hand">' + (handH || '<span class="muted">Keine Karten auf der Hand.</span>') + '</div>' +
        '<div class="endrow">' + (mine && !hand.length ? '<button class="btn" data-act="endTurn">Zug beenden</button>' : '') + '</div>' +
      '</div>' +
    '</section>';
  } else {
    me = '<div class="panel muted">Du schaust zu. Neue Mitspieler können in der nächsten Runde über einen neuen Tisch dazukommen.</div>';
  }
  const chooser = g.choose && g.status === 'playing' ? g.choose.pid : null;
  let who = g.status === 'playing' ? (mine ? '<b>Du bist dran</b>' : esc(cur ? cur.name : '?') + ' ist dran' + (cur && !cur.online ? ' (offline)' : '')) : '';
  if(chooser && chooser !== S.me) who = esc(pn(chooser)) + ' wählt, wer aussetzen muss …';
  if(g.spy && g.status === 'playing' && g.spy.pid !== S.me) who = g.spy.target === S.me ? '<b>' + esc(pn(g.spy.pid)) + ' schaut sich gerade deine Handkarten an!</b>' : esc(pn(g.spy.pid)) + ' spioniert bei ' + esc(pn(g.spy.target)) + ' …';
  if(g.status === 'playing' && g.skips && g.skips[S.me]) who += '<span class="pill skip" style="margin-left:12px">' + SKIP_ICON + 'Du setzt beim nächsten Mal aus</span>';
  let dialog = '';
  if(!mine || chooser){ S.gift = null; S.steal = null; }
  if(g.spy && g.spy.pid === S.me && g.spy.hand){
    const sp = g.spy;
    dialog = '<div class="modal side" role="dialog" aria-modal="false" aria-labelledby="spyTitle"><div class="panel modalbox" style="max-width:640px"><span class="skipbig" style="color:#d9a6ff">' + SPY_ICON + '</span><h2 id="spyTitle">' + esc(pn(sp.target)) + 's Handkarten</h2>' +
      '<p class="muted" style="margin:0">Nur du siehst diese Karten. Nimm dir eine davon.</p><div class="choose giftcards">' +
      sp.hand.map((v,i) => '<button type="button" class="cbtn" data-act="spyTake" data-i="' + i + '" aria-label="' + esc(cardName(v)) + ' nehmen">' + cardHTML(v) + '</button>').join('') + '</div></div></div>';
  }
  if(S.steal && mine){
    const sl = S.steal, piles = (g.players.find(p => p.id === sl.target) || {discards:[]}).discards;
    const opts = piles.map((d,i) => d.length ? '<button type="button" class="cbtn" data-act="stealPick" data-i="' + i + '" aria-label="' + esc(cardName(top(d))) + ' klauen">' + cardHTML(top(d)) + '</button>' : '').join('');
    dialog = '<div class="modal side" role="dialog" aria-modal="false" aria-labelledby="stealTitle"><div class="panel modalbox" style="max-width:560px"><span class="skipbig" style="color:#8fb4ff">' + STEAL_ICON + '</span><h2 id="stealTitle">Was klaust du ' + esc(pn(sl.target)) + '?</h2>' +
      '<p class="muted" style="margin:0">Die oberste Karte eines Ablagestapels wandert auf deine Hand.</p><div class="choose giftcards">' + opts + '</div>' +
      '<button type="button" class="btn small" data-act="stealCancel">Abbrechen</button></div></div>';
  }
  if(S.gift && mine){
    const gft = S.gift;
    const opts = g.hand.map((v,i) => (gft.src === 'hand' && gft.i === i) ? '' : '<button type="button" class="cbtn" data-act="giftGive" data-i="' + i + '" aria-label="' + esc(cardName(v)) + ' verschenken">' + cardHTML(v) + '</button>').join('');
    dialog = '<div class="modal side" role="dialog" aria-modal="false" aria-labelledby="giftTitle"><div class="panel modalbox" style="max-width:560px"><span class="skipbig" style="color:var(--ok)">' + GIFT_ICON + '</span><h2 id="giftTitle">Was schenkst du ' + esc(pn(gft.target)) + '?</h2>' +
      (opts ? '<p class="muted" style="margin:0">Klick eine deiner Handkarten an.</p><div class="choose giftcards">' + opts + '</div>' : giftDiscHTML(g, gft)) +
      '<button type="button" class="btn small" data-act="giftCancel">Abbrechen</button></div></div>';
  }
  if(chooser === S.me){
    dialog = '<div class="modal side" role="dialog" aria-modal="false" aria-labelledby="chooseTitle"><div class="panel modalbox"><span class="skipbig">' + SKIP_ICON + '</span><h2 id="chooseTitle">Wer soll aussetzen?</h2><p class="muted" style="margin:0">Der gewählte Spieler wird bei seinem nächsten Zug übersprungen.</p><div class="choose">' +
      order.filter(p => p.id !== S.me).map(p => (g.skips && g.skips[p.id])
        ? '<button type="button" class="btn" disabled title="Setzt schon aus">' + esc(p.name) + ' <span class="muted">(setzt schon aus)</span></button>'
        : '<button type="button" class="btn" data-act="chooseSkip" data-pid="' + esc(p.id) + '">' + esc(p.name) + '</button>').join('') +
      '</div></div></div>';
  }
  const turnline = '<div class="turnline' + (mine ? ' me' : '') + '">' + who + '</div>';
  const slogEl = q('.slog'), slogTop = slogEl ? slogEl.scrollTop : 0;
  view.innerHTML = win + (opps ? '<section class="opps">' + opps + '</section>' : '') + mid + me + turnline + dialog;
  // Kartengröße nur neu berechnen, wenn sich Fenster oder Tischaufbau ändern – nicht bei jedem Zug
  const fitKey = innerWidth + 'x' + innerHeight + ':' + g.players.length + ':' + (g.hand ? 1 : 0) + ':' + g.build.length + ':' + anySpecial(g);
  if(fitKey !== S.fitKey){ S.fitKey = fitKey; const before = S.cw; fitCards(); if(before !== S.cw) return renderGame(); }
  fitHand();
  if(slogTop){ const n = q('.slog'); if(n) n.scrollTop = slogTop; }
  if(S.dragHide){ const el = srcEl({pid:S.me, src:S.dragHide.src, i:S.dragHide.i}); if(el) el.style.visibility = 'hidden'; }
}

render();
connect();
// regelmäßiges Lebenszeichen, damit der kostenlose Server nicht einschläft, solange jemand die Seite offen hat
setInterval(() => { if(S.ws && S.ws.readyState === 1) S.ws.send(JSON.stringify({t:'ping'})); }, 30000);
})();

</script></body></html>
