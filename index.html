<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zwölf hoch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a dark card table. Opponents along the top, shared piles in the middle, your own area at the bottom. Single deliberate dark look. */
:root{
  --table:#1c1a29; --table-2:#252236; --table-3:#2f2b44;
  --line:rgba(236,228,255,.10); --line-2:rgba(236,228,255,.22);
  --ink:#f1ece2; --muted:#a6a0bb; --accent:#f2b84b; --accent-ink:#2a1f05;
  --card:#f6f0e4; --card-ink:#26233a;
  --g1:#1d7d8f; --g2:#7650c2; --g3:#d4562c;
  --jk:#2b2542; --danger:#ef6b5b; --ok:#57c29a;
  --f-display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cw:clamp(46px,6.2vw,86px); --cws:clamp(30px,2.9vw,44px);
  --r:9px;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--table);background-image:radial-gradient(ellipse 90% 60% at 50% 45%,var(--table-2),var(--table) 70%);color:var(--ink);font:15px/1.5 var(--f-body)}
#app{max-width:1440px;margin:0 auto;padding:14px 16px 40px;display:flex;flex-direction:column;gap:16px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font:900 30px/1 var(--f-display);letter-spacing:.02em;text-transform:uppercase}
.brand b i{font-style:normal;color:var(--accent)}
.brand span{color:var(--muted);font-size:13px}
.bar .actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line-2);background:var(--table-3);padding:8px 14px;border-radius:8px;font-weight:700;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{border-color:rgba(239,107,91,.5);color:#ffb3a8}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:700}
.panel{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:14px;padding:16px}
.muted{color:var(--muted)}
input[type=text],select{background:var(--table);border:1px solid var(--line-2);color:var(--ink);border-radius:8px;padding:9px 12px;font:inherit;min-width:0}
body.busy{cursor:progress}

/* Home */
.home{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:16px;align-items:start}
.home .hero h1{font:900 clamp(40px,6vw,72px)/.92 var(--f-display);text-transform:uppercase;letter-spacing:.01em}
.home .hero h1 em{font-style:normal;color:var(--accent)}
.home .hero p{max-width:58ch;color:var(--muted);margin:10px 0 0}
.fan{display:flex;margin:18px 0 6px;padding-left:10px}
.fan .card{margin-left:-14px;transform:rotate(calc((var(--k) - 2.5) * 5deg)) translateY(calc(var(--d) * 1px))}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.field{display:flex;flex-direction:column;gap:6px}
.glist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.gitem{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:rgba(0,0,0,.15)}
.gitem .code{font:800 22px/1 var(--f-display);letter-spacing:.08em}
.gitem .who{color:var(--muted);font-size:13px;min-width:0;overflow-wrap:anywhere}
.pill{display:inline-block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:2px 8px;border-radius:99px;border:1px solid var(--line-2);color:var(--muted)}
.pill.live{color:var(--ok);border-color:rgba(87,194,154,.45)}
.pill.wait{color:var(--accent);border-color:rgba(242,184,75,.45)}
.rules ol{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:65ch}
.empty{color:var(--muted);padding:14px;border:1px dashed var(--line-2);border-radius:10px;text-align:center}

/* Lobby */
.lobby{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.bigcode{font:900 clamp(56px,9vw,96px)/1 var(--f-display);letter-spacing:.12em;color:var(--accent)}
.plist{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-radius:8px;background:rgba(0,0,0,.18)}

/* Cards */
.card,.back,.slot{width:var(--cw);aspect-ratio:5/7;border-radius:var(--r);position:relative;flex:none;box-sizing:border-box}
.card{background:var(--card);color:var(--c);border:1px solid rgba(0,0,0,.25);box-shadow:0 2px 0 rgba(0,0,0,.25),0 6px 14px rgba(0,0,0,.25);display:grid;place-items:center}
.card::before{content:"";position:absolute;inset:4px;border:1.5px solid var(--c);border-radius:calc(var(--r) - 4px);opacity:.55}
.card .n{font:900 calc(var(--cw) * .62)/1 var(--f-display);letter-spacing:-.02em}
.card .c{position:absolute;font:800 calc(var(--cw) * .17)/1 var(--f-display)}
.card .tl{top:8%;left:12%}.card .br{bottom:8%;right:12%;transform:rotate(180deg)}
.card.g1{--c:var(--g1)}.card.g2{--c:var(--g2)}.card.g3{--c:var(--g3)}
.card.j{--c:var(--accent);background:var(--jk);color:var(--accent)}
.card.j .n{font-size:calc(var(--cw) * .5)}
.card .as{position:absolute;bottom:-9px;left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-ink);font:800 12px/1 var(--f-body);padding:3px 6px;border-radius:99px;white-space:nowrap}
.back{background-color:var(--bk-base);background-image:var(--bk-img);border:1px solid rgba(0,0,0,.4);box-shadow:0 2px 0 rgba(0,0,0,.3),0 6px 14px rgba(0,0,0,.25);display:grid;place-items:center;overflow:hidden}
.back::before{content:"";position:absolute;inset:calc(var(--cw) * .07);border:1.5px solid var(--bk-line);border-radius:calc(var(--r) - 3px);opacity:.8}
.back .emb{position:relative;width:calc(var(--cw) * .5);aspect-ratio:1;border-radius:50%;background:var(--bk-base);border:2px solid var(--bk-line);box-shadow:0 0 0 calc(var(--cw) * .04) var(--bk-base);display:grid;place-items:center;font:900 calc(var(--cw) * .22)/1 var(--f-display);color:var(--bk-line);letter-spacing:-.02em}
.back .emb small{font-size:.55em;margin-left:1px;transform:translateY(-.35em)}
.back.mb{--cw:11px;--r:2px;width:11px;margin-left:-5px;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.back.mb::before{display:none}
body,[data-back="gitter"]{--bk-base:#3a2f63;--bk-line:#f2b84b;--bk-img:repeating-linear-gradient(45deg,rgba(242,184,75,.24) 0 2px,transparent 2px 8px),repeating-linear-gradient(-45deg,rgba(170,130,255,.32) 0 2px,transparent 2px 8px)}
[data-back="sonne"]{--bk-base:#123f4f;--bk-line:#ffd27a;--bk-img:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,210,122,.30) 0 5deg,transparent 5deg 15deg),radial-gradient(circle at 50% 50%,#1f7085,#0d2c38 78%)}
[data-back="welle"]{--bk-base:#4a1f1a;--bk-line:#ff9a6a;--bk-img:repeating-radial-gradient(circle at 50% 50%,rgba(255,154,106,.30) 0 2px,transparent 2px 7px),linear-gradient(160deg,#6d2b20,#2a1310)}
.backpick{display:flex;gap:14px;flex-wrap:wrap}
.backpick button{background:none;border:0;padding:6px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.backpick button .back{--cw:58px}
.backpick button[aria-pressed="true"]{outline:2px solid var(--accent);color:var(--ink)}
.drawn{display:flex;flex-direction:column;align-items:center;gap:6px}
.drawn small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.slot{border:1.5px dashed var(--line-2);display:grid;place-items:center;color:var(--muted);font:800 calc(var(--cw) * .32)/1 var(--f-display)}
.sm{--cw:var(--cws);--r:6px}
.sm .card .c{display:none}.sm .card::before{inset:2px}


.cbtn{background:none;border:0;padding:0;border-radius:var(--r);transition:transform .15s ease}
.cbtn.sel{transform:translateY(-10px)}
.cbtn.sel>.card{outline:3px solid var(--accent);outline-offset:2px}
.tgt{outline:3px solid var(--accent);outline-offset:4px;border-radius:12px}
.tgt.soft{outline-color:rgba(242,184,75,.45);animation:none}
@keyframes glow{50%{outline-color:rgba(242,184,75,.35)}}
.land{animation:land .28s ease-out}
@keyframes land{from{transform:scale(1.15) translateY(-6px)}to{transform:none}}
.ghost{position:fixed;z-index:30;pointer-events:none;transform-origin:0 0;will-change:transform}
.ghost .card{box-shadow:0 14px 30px rgba(0,0,0,.45)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
.banner.pulse{animation:pulse 1.1s ease-out 2}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(242,184,75,.6)}100%{box-shadow:0 0 0 18px rgba(242,184,75,0)}}
.bpile .face.cleared{animation:cleared .6s ease-out}
@keyframes cleared{0%{transform:scale(1.25);filter:brightness(1.8)}100%{transform:none;filter:none}}
.winner{animation:winIn .6s cubic-bezier(.2,1.4,.4,1)}
@keyframes winIn{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.sndbtn{display:inline-flex;align-items:center;gap:6px}
.sndbtn svg{width:16px;height:16px}

/* Game */
.banner{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:12px 16px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line)}
.banner.me{background:rgba(242,184,75,.12);border-color:rgba(242,184,75,.5)}
.banner .msg{font-weight:700;font-size:16px}
.banner .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.opps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:10px}
.opp{padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.16);display:flex;flex-direction:column;gap:8px;min-width:0}
.opp.turn{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.opp .head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.opp .name{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.opp .rowc{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.mini{display:flex;flex-direction:column;align-items:center;gap:3px}
.mini small{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.discs{display:flex;gap:4px}
.hcount{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin-left:auto}
.hcount .dots{display:flex}
.hcount .dots{padding-left:5px}
.mid{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:start;padding:18px;border-radius:16px;background:rgba(0,0,0,.18);border:1px solid var(--line)}
.pilegrp{display:flex;flex-direction:column;gap:8px;align-items:center}
.builds{display:flex;gap:clamp(10px,2vw,26px);flex-wrap:wrap;justify-content:center}
.bpile{background:none;border:0;padding:4px;display:flex;flex-direction:column;align-items:center;gap:14px}
.bpile .need{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.midspacer{width:var(--cw)}
.log{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px;max-height:180px;overflow:auto;min-width:0}
.log div:first-child{color:var(--ink)}
.mine{display:flex;flex-wrap:wrap;gap:24px 36px;align-items:flex-start;padding:18px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
.mine.turn{border-color:rgba(242,184,75,.55)}
.mine .grp{display:flex;flex-direction:column;gap:8px}
.mydiscs{display:flex;gap:10px}
.dpile{background:none;border:0;padding:0;position:relative;width:var(--cw);border-radius:var(--r)}
.dpile .stack{position:relative;width:var(--cw)}
.dpile .stack>*{position:absolute;left:0}
.hand{display:flex;gap:8px;padding-top:12px;flex-wrap:wrap;min-height:calc(var(--cw) * 1.4)}
.stockwrap{display:flex;gap:10px;align-items:flex-end}
.count{font:800 26px/1 var(--f-display);font-variant-numeric:tabular-nums}
.hint{font-size:13px;color:var(--accent)}
.turnline{min-height:44px;display:flex;align-items:center;justify-content:center;padding:10px 16px;border-radius:12px;font-size:18px;color:var(--muted)}
.turnline.me{color:var(--accent);background:rgba(242,184,75,.10);border:1px solid rgba(242,184,75,.45);font-size:20px}
.winner{text-align:center;padding:22px;border-radius:16px;background:rgba(242,184,75,.12);border:1px solid var(--accent);display:flex;flex-direction:column;gap:10px;align-items:center}
.winner h2{font:900 clamp(34px,5vw,56px)/1 var(--f-display);text-transform:uppercase;color:var(--accent)}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--table);padding:10px 16px;border-radius:10px;font-weight:700;max-width:min(92vw,520px);box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:10}

@media (max-width:900px){
  .home,.lobby{grid-template-columns:minmax(0,1fr)}
  .mid{grid-template-columns:minmax(0,1fr)}
  .mid .pilegrp:first-child{flex-direction:row}
  .midspacer{display:none}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head><body>
<div id="app">
  <header class="bar">
    <div class="brand"><b>Zwölf <i>hoch</i></b><span>Kartenspiel für 2 bis 8</span></div>
    <div class="actions" id="baractions"></div>
  </header>
  <main id="view"><div class="panel muted">Verbinde mit dem Spieltisch …</div></main>
</div>
<div id="toast" hidden></div>
<script>
(function(){
const view = document.getElementById('view');
const barActions = document.getElementById('baractions');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v == null ? d : v; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
};
const MAXP = 8;
const hashCode = (location.hash || '').replace('#','').toUpperCase().slice(0,4);

document.body.dataset.back = ['gitter','sonne','welle'].includes(LS.get('zh.back','')) ? LS.get('zh.back','') : 'gitter';
const S = { ws:null, token:LS.get('zh.token',null), me:null, game:null, sel:null, name:LS.get('zh.name',''),
  connected:false, everConnected:false, view:null, confirmEnd:0, landed:null, prevBuild:null, retry:0 };

/* ---------- Verbindung ---------- */
function connect(){
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  S.ws = ws;
  ws.onopen = () => { S.retry = 0; ws.send(JSON.stringify({t:'hello', token:S.token})); };
  ws.onmessage = ev => {
    let m; try{ m = JSON.parse(ev.data); }catch(e){ return; }
    if(m.t === 'welcome'){
      S.token = m.token; S.me = m.id; LS.set('zh.token', m.token);
      const first = !S.everConnected;
      S.connected = true; S.everConnected = true; render();
      if(first && hashCode.length === 4 && !S.game && S.name.trim()) send({t:'join', code:hashCode, name:S.name.trim()});
    }
    else if(m.t === 'state'){
      if(location.hash !== '#' + m.game.code) history.replaceState(null, '', '#' + m.game.code);
      onNewState(S.game, m.game);
    }
    else if(m.t === 'error'){ toast(m.msg); Snd.play('error'); if(S.sel){ S.sel = null; render(); } }
    else if(m.t === 'left' || m.t === 'ended'){
      if(m.t === 'ended') toast('Das Spiel wurde beendet.');
      S.game = null; S.sel = null; history.replaceState(null, '', location.pathname); document.title = 'Zwölf hoch'; render();
    }
  };
  ws.onclose = () => {
    S.connected = false; render();
    S.retry++;
    setTimeout(connect, Math.min(8000, 800 * S.retry));
  };
}
function send(m){
  if(!S.ws || S.ws.readyState !== 1){ toast('Keine Verbindung zum Server. Einen Moment …'); return false; }
  S.ws.send(JSON.stringify(m)); return true;
}

let toastT;
function toast(msg){ const t = document.getElementById('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3800); }

function myName(){
  const el = document.getElementById('nameInput');
  const n = ((el ? el.value : S.name) || '').trim().slice(0,18);
  if(n){ S.name = n; LS.set('zh.name', n); }
  return n;
}
const top = a => a && a.length ? a[a.length-1] : null;
const fits = (v, pile) => v === 0 || v === pile.length + 1;
const meP = () => S.game && S.game.players.find(p => p.id === S.me);
function myTurn(){ const g = S.game; return !!(g && g.status === 'playing' && g.players[g.turn] && g.players[g.turn].id === S.me && g.hand); }
function cardAt(sel){
  const g = S.game, p = meP(); if(!p) return null;
  if(sel.src === 'hand') return g.hand[sel.i];
  if(sel.src === 'stock') return p.stockTop;
  if(sel.src === 'disc') return top(p.discards[sel.i]);
}


/* ---------- Sound (wird im Browser erzeugt, keine Dateien nötig) ---------- */
const Snd = {
  ctx:null, master:null, on: LS.get('zh.sound','1') === '1',
  unlock(){
    try{
      if(!this.ctx){ const C = window.AudioContext || window.webkitAudioContext; if(!C) return; this.ctx = new C(); this.master = this.ctx.createGain(); this.master.gain.value = .55; this.master.connect(this.ctx.destination); }
      if(this.ctx.state === 'suspended') this.ctx.resume();
    }catch(e){}
  },
  tone(f, t, dur, type, vol){
    const c = this.ctx, o = c.createOscillator(), g = c.createGain();
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + .012); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + .05);
  },
  noise(t, dur, vol, freq){
    const c = this.ctx, n = Math.floor(c.sampleRate * dur), buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
    const src = c.createBufferSource(), bp = c.createBiquadFilter(), g = c.createGain();
    src.buffer = buf; bp.type = 'bandpass'; bp.frequency.value = freq || 2200; bp.Q.value = .9; g.gain.value = vol;
    src.connect(bp); bp.connect(g); g.connect(this.master); src.start(t);
  },
  play(name, arg, vol){
    if(!this.on || !this.ctx || this.ctx.state !== 'running') return;
    const t = this.ctx.currentTime, v = vol == null ? 1 : vol;
    const STEP = [0,2,4,7,9,12,14,16,19,21,24,26];
    switch(name){
      case 'select': this.tone(1200, t, .05, 'sine', .07*v); break;
      case 'place': { const h = Math.max(1, Math.min(12, arg || 1)); this.noise(t, .05, .5*v, 2600); this.tone(330 * Math.pow(2, STEP[h-1]/12), t + .01, .22, 'triangle', .22*v); break; }
      case 'discard': this.noise(t, .09, .55*v, 700); this.tone(150, t, .14, 'sine', .25*v); break;
      case 'turn': this.tone(660, t, .3, 'sine', .22); this.tone(990, t + .13, .45, 'sine', .2); break;
      case 'clear': [523,659,784,1047,1319].forEach((f,i) => this.tone(f, t + .1 + i*.07, .3, 'triangle', .18*v)); break;
      case 'deal': for(let i=0;i<7;i++) this.noise(t + i*.055, .05, .35, 3000 + i*150); break;
      case 'win': [523,659,784].forEach((f,i) => this.tone(f, t + i*.14, .25, 'square', .07)); [523,659,784,1047].forEach(f => this.tone(f, t + .46, 1.1, 'triangle', .13)); break;
      case 'error': this.tone(140, t, .12, 'sawtooth', .07); this.tone(120, t + .13, .16, 'sawtooth', .07); break;

};

const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const rectOf = el => el ? el.getBoundingClientRect() : null;
function q(sel){ return document.querySelector(sel); }
function srcEl(mv){
  if(mv.pid === S.me){
    if(mv.src === 'hand') return q('.hand [data-act="hand"][data-i="' + mv.i + '"] .card');
    if(mv.src === 'stock') return q('[data-act="stock"] .card');
    if(mv.src === 'disc') return q('[data-act="disc"][data-i="' + mv.i + '"] .stack > div:last-child');
  }
  const o = q('.opp[data-pid="' + mv.pid + '"]'); if(!o) return null;
  if(mv.src === 'hand') return o.querySelector('[data-k="hand"] .dots') || o.querySelector('[data-k="hand"]');
  if(mv.src === 'stock') return o.querySelector('[data-k="stock"] > :first-child');
  if(mv.src === 'disc') return o.querySelector('[data-k="disc"][data-i="' + mv.i + '"] > :first-child');
}
function dstEl(mv){
  if(mv.kind === 'play') return q('[data-act="build"][data-i="' + mv.pile + '"] .face');
  if(mv.pid === S.me) return q('[data-act="disc"][data-i="' + mv.to + '"] .stack > div:last-child');
  const o = q('.opp[data-pid="' + mv.pid + '"]');
  return o && o.querySelector('[data-k="disc"][data-i="' + mv.to + '"] > :first-child');
}
function fly(html, from, toEl, opt){
  opt = opt || {};
  if(reduce || !from || !toEl) { opt.done && opt.done(); return; }
  const to = toEl.getBoundingClientRect();
  if(!to.width) { opt.done && opt.done(); return; }
  const g = document.createElement('div');
  g.className = 'ghost';
  g.style.cssText = 'left:' + to.left + 'px;top:' + to.top + 'px;width:' + to.width + 'px;--cw:' + to.width + 'px';
  g.innerHTML = html;
  document.body.appendChild(g);
  toEl.style.visibility = 'hidden';
  const s = from.width / to.width, dx = from.left - to.left, dy = from.top - to.top;
  const a = g.animate([
    {transform:'translate(' + dx + 'px,' + dy + 'px) scale(' + s + ') rotate(-10deg)', opacity: opt.fadeIn ? 0 : 1},
    {transform:'translate(0,-14px) scale(1.06) rotate(3deg)', opacity:1, offset:.75},
    {transform:'none', opacity:1}
  ], {duration: opt.dur || 430, delay: opt.delay || 0, easing:'cubic-bezier(.3,.7,.3,1)', fill:'both'});
  a.onfinish = () => {
    toEl.style.visibility = '';
    if(opt.vanish){
      g.animate([{transform:'none', opacity:1},{transform:'translateY(-24px) scale(.7)', opacity:0}], {duration:380, easing:'ease-in', fill:'forwards'}).onfinish = () => g.remove();
    } else g.remove();
    opt.done && opt.done();
  };
}
/* Partikel: Funken und Konfetti */
const FX = { cv:null, ctx:null, parts:[], running:false,
  ensure(){
    if(this.cv) return;
    this.cv = document.createElement('canvas'); this.cv.id = 'fx'; document.body.appendChild(this.cv);
    this.ctx = this.cv.getContext('2d');
    const rs = () => { const d = window.devicePixelRatio || 1; this.cv.width = innerWidth * d; this.cv.height = innerHeight * d; this.ctx.setTransform(d,0,0,d,0,0); };
    rs(); addEventListener('resize', rs);
  },
  sparks(x, y){
    if(reduce) return; this.ensure();
    const cols = ['#f2b84b','#ffe3a3','#ffffff','#ff9a6a'];
    for(let i=0;i<34;i++){ const a = Math.random()*Math.PI*2, sp = 2 + Math.random()*5; this.parts.push({x, y, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - 1.5, g:.12, life:1, dec:.022 + Math.random()*.02, r:2 + Math.random()*2.5, c:cols[i%4], kind:'spark'}); }
    this.run();
  },
  confetti(){
    if(reduce) return; this.ensure();
    const cols = ['#f2b84b','#1d9bb0','#8b62d9','#e2633a','#57c29a','#f6f0e4'];
    for(let i=0;i<220;i++) this.parts.push({x:Math.random()*innerWidth, y:-20 - Math.random()*innerHeight*.6, vx:(Math.random()-.5)*2, vy:2 + Math.random()*3, g:.03, life:1, dec:.0035, r:4 + Math.random()*5, c:cols[i%cols.length], rot:Math.random()*6, vr:(Math.random()-.5)*.3, kind:'conf'});
    this.run();
  },
  run(){
    if(this.running) return; this.running = true;
    const step = () => {
      const c = this.ctx; c.clearRect(0, 0, innerWidth, innerHeight);
      this.parts = this.parts.filter(p => p.life > 0 && p.y < innerHeight + 30);
      for(const p of this.parts){
        p.vy += p.g; p.x += p.vx; p.y += p.vy; p.life -= p.dec;
        c.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5)); c.fillStyle = p.c;
        if(p.kind === 'conf'){ p.rot += p.vr; p.vx *= .99; c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.fillRect(-p.r/2, -p.r/4, p.r, p.r/2); c.restore(); }
        else { c.beginPath(); c.arc(p.x, p.y, p.r * p.life, 0, Math.PI*2); c.fill(); }
      }
      c.globalAlpha = 1;
      if(this.parts.length) requestAnimationFrame(step); else { this.running = false; c.clearRect(0, 0, innerWidth, innerHeight); }
    };
    requestAnimationFrame(step);
  }
};
function onNewState(prev, g){
  const mv = g.lastMove;
  const same = prev && prev.code === g.code;
  const fresh = same && mv && (!prev.lastMove || prev.lastMove.seq !== mv.seq);
  const fromRect = fresh && (mv.kind === 'play' || mv.kind === 'discard') ? rectOf(srcEl(mv)) : null;
  const drawRect = rectOf(q('[data-k="draw"] .back'));
  const oldHand = same && prev.hand ? prev.hand.length : 0;
  const wasMine = same && prev.status === 'playing' && prev.players[prev.turn] && prev.players[prev.turn].id === S.me;
  S.game = g; render();
  if(!g.hand || g.status === 'lobby') return;
  const mine = myTurn();
  const vol = fresh && mv.pid === S.me ? 1 : .6;
  if(fresh && mv.kind === 'play'){
    const pileEl = q('[data-act="build"][data-i="' + mv.pile + '"] .face');
    const h = mv.cleared ? 12 : g.build[mv.pile].length;
    Snd.play('place', h, vol);
    fly(cardHTML(mv.v), fromRect, pileEl, { vanish: mv.cleared, done: () => {
      if(mv.cleared){ Snd.play('clear', 0, vol); const r = rectOf(pileEl); if(r) FX.sparks(r.left + r.width/2, r.top + r.height/2); if(pileEl){ pileEl.classList.remove('cleared'); void pileEl.offsetWidth; pileEl.classList.add('cleared'); } }
      if(mv.win){ Snd.play('win'); FX.confetti(); }
    }});
  } else if(fresh && mv.kind === 'discard'){
    fly(cardHTML(mv.v), fromRect, dstEl(mv));
  } else if(fresh && mv.kind === 'deal'){
    Snd.play('deal');
  }
  // neue Handkarten fliegen vom Nachziehstapel herein
  if(g.status === 'playing'){
    let base = oldHand;
    if(fresh && mv.kind === 'deal') base = 0;
    else if(fresh && mv.pid === S.me && mv.src === 'hand') base = Math.max(0, oldHand - 1);
    for(let i = base, k = 0; i < g.hand.length; i++, k++){
      const el = q('.hand [data-act="hand"][data-i="' + i + '"] .card');
      fly(cardHTML(g.hand[i]), drawRect, el, { delay: 120 + k*80, dur: 380, fadeIn: true });
    }
  }
  if(mine && !wasMine){
    setTimeout(() => Snd.play('turn'), fresh && mv.kind === 'deal' ? 500 : 250);
  }
}

      '<div class="rowc">' +
        '<div class="mini sm" data-k="stock" title="Spielerstapel">' + (p.stockTop != null ? cardHTML(p.stockTop) : '<div class="slot"></div>') + '<small><b style="color:var(--ink)">' + p.stockCount + '</b> übrig</small></div>' +
        '<div class="discs">' + p.discards.map((d,i) => miniPile(d, 'Ablage ' + (i+1), i)).join('') + '</div>' +
        '<div class="hcount" data-k="hand"><span class="dots">' + '<i class="back mb"></i>'.repeat(p.handCount) + '</span>' + p.handCount + ' Hand</div>' +
      '</div></div>';
  }).join('');

  const builds = g.build.map((p,i) => {
    const t = top(p), ok = sel && fits(sel.v, p);
    const face = t == null ? '<div class="slot">1</div>' : cardHTML(t, t === 0 ? '<span class="as">= ' + p.length + '</span>' : '');
    return '<button class="bpile" data-act="build" data-i="' + i + '" aria-label="Aufbaustapel ' + (i+1) + ', als nächstes ' + (p.length+1) + '"' + (mine ? '' : ' tabindex="-1"') + '>' +
      '<div class="face' + (ok ? ' tgt' : '') + '" style="border-radius:var(--r)">' + face + '</div>' +
      '<span class="need">nächste: ' + (p.length + 1) + '</span></button>';
  }).join('');
  const mid = '<div class="mid">' +
    '<div class="pilegrp"><div class="label">Ziehen</div><div class="drawn" data-k="draw">' + backHTML() + '<small>' + g.drawCount + ' Karten</small></div></div>' +
    '<div class="pilegrp"><div class="label">Aufbaustapel</div><div class="builds">' + builds + '</div></div>' +
    '<div class="midspacer" aria-hidden="true"></div>' +
  '</div>';

  let win = '';
  if(g.status === 'finished'){
    win = '<div class="winner"><div class="label">Runde vorbei</div><h2>' + esc(pn(g.winner)) + ' gewinnt</h2>' +
      (g.host === S.me ? '<button class="btn primary" data-act="rematch">Neue Runde mit allen</button>' : '<p class="muted" style="margin:0">' + esc(pn(g.host)) + ' kann eine neue Runde starten.</p>') + '</div>';
  }

  let me = '';
  if(isPlayer){
    const p = g.players[meIdx], hand = g.hand, ds = p.discards, stTop = p.stockTop;
    const stockSel = sel && sel.src === 'stock';
    const stockFits = mine && stTop != null && g.build.some(b => fits(stTop, b));
    const discs = ds.map((d,i) => {
      const n = d.length, off = n > 1 ? Math.min(20, 110/(n-1)) : 0;
      const h = 'calc(var(--cw) * 1.4 + ' + (off*(Math.max(n,1)-1)) + 'px)';
      const isSel = sel && sel.src === 'disc' && sel.i === i, tgt = sel && sel.src === 'hand';
      const cards = n ? d.map((v,k) => '<div style="top:' + (k*off) + 'px' + (isSel && k === n-1 ? ';transform:translateY(-10px)' : '') + '">' + cardHTML(v, '', isSel && k === n-1 ? 'outline:3px solid var(--accent);outline-offset:2px' : '') + '</div>').join('') : '<div style="top:0"><div class="slot"></div></div>';
      return '<button class="dpile' + (tgt ? ' tgt' : '') + '" data-act="disc" data-i="' + i + '" aria-label="Ablagestapel ' + (i+1) + '"' + (mine ? '' : ' tabindex="-1"') + '><div class="stack" style="height:' + h + '">' + cards + '</div></button>';
    }).join('');
    const handH = hand.map((v,i) => '<button class="cbtn' + (sel && sel.src === 'hand' && sel.i === i ? ' sel' : '') + '" data-act="hand" data-i="' + i + '"' + (mine ? '' : ' tabindex="-1"') + ' aria-label="Handkarte ' + (v === 0 ? 'Joker' : v) + '">' + cardHTML(v) + '</button>').join('');
    me = '<section class="mine' + (mine ? ' turn' : '') + '">' +
      '<div class="grp"><div class="label">Dein Spielerstapel</div><div class="stockwrap">' +
        (stTop == null ? '<div class="slot">—</div>' : '<button class="cbtn' + (stockSel ? ' sel' : '') + '" data-act="stock" aria-label="Spielerstapel ' + (stTop === 0 ? 'Joker' : stTop) + '"' + (mine ? '' : ' tabindex="-1"') + '>' + cardHTML(stTop) + '</button>') +
        '<div><div class="count">' + p.stockCount + '</div><div class="muted" style="font-size:12px">übrig</div></div></div>' +
        (stockFits && !stockSel ? '<div class="hint">Deine Stapelkarte passt!</div>' : '') +
      '</div>' +
      '<div class="grp"><div class="label">Deine Ablagestapel</div><div class="mydiscs">' + discs + '</div></div>' +
      '<div class="grp" style="min-width:0;flex:1"><div class="label">Deine Hand</div><div class="hand">' + (handH || '<span class="muted">Keine Karten auf der Hand.</span>') + '</div>' +
        (mine && !hand.length ? '<div><button class="btn" data-act="endTurn">Zug beenden</button></div>' : '') +
      '</div>' +
    '</section>';
  } else {
    me = '<div class="panel muted">Du schaust zu. Neue Mitspieler können in der nächsten Runde über einen neuen Tisch dazukommen.</div>';
  }
  const who = g.status === 'playing' ? (mine ? '<b>Du bist dran</b>' : esc(cur ? cur.name : '?') + ' ist dran' + (cur && !cur.online ? ' (offline)' : '')) : '';
  const turnline = '<div class="turnline' + (mine ? ' me' : '') + '">' + who + '</div>';
  view.innerHTML = win + (opps ? '<section class="opps">' + opps + '</section>' : '') + mid + me + turnline;
}

render();
connect();
})();

</script></body></html>
