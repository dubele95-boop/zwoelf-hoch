<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bombe entschärfen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="/common.css">
<style>
:root{--accent:#ff7a5c;--accent-ink:#2a0d05}
.lvgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;max-width:360px}
.lv{position:relative;height:44px;border-radius:9px;border:1px solid var(--line-2);background:var(--table-3);font:800 20px/1 var(--f-display);display:grid;place-items:center;color:var(--ink)}
.lv.done{border-color:rgba(87,194,154,.55)}
.lv.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.lv:disabled{cursor:default}.lv:disabled:not(.on){opacity:.55}
.lv i{position:absolute;top:2px;right:5px;font:700 11px/1 var(--f-body);font-style:normal;color:var(--ok)}
.lv.on i{color:var(--accent-ink)}
.lv svg{width:16px;height:16px;color:var(--muted)}
.bb-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between}
.bb-role{font:900 30px/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.bb-role em{font-style:normal;color:var(--accent)}
.timer{font:800 44px/1 "Courier New",ui-monospace,monospace;color:#ff5a4a;background:#120a0a;padding:8px 16px;border-radius:8px;border:2px solid #3a2020;text-shadow:0 0 14px rgba(255,80,60,.65);letter-spacing:.06em;font-variant-numeric:tabular-nums;min-width:4.2em;text-align:center}
.timer.low{animation:blink 1s steps(2) infinite}
@keyframes blink{50%{color:#ffb0a6}}
.strikes{display:flex;gap:6px;align-items:center}
.strikes span{width:30px;height:30px;border-radius:6px;border:2px solid #3a2020;background:#120a0a;display:grid;place-items:center;color:#3a2020;font:900 22px/1 var(--f-display)}
.strikes span.on{color:#ff5a4a;text-shadow:0 0 10px rgba(255,80,60,.8)}
.modlist{display:flex;flex-wrap:wrap;gap:6px}
.modlist .pill.done{color:var(--ok);border-color:rgba(87,194,154,.5)}
/* Gehäuse */
.casing{background:linear-gradient(180deg,#3b3f47,#2a2d33);border:3px solid #15171b;border-radius:18px;padding:14px;box-shadow:inset 0 2px 0 rgba(255,255,255,.08),0 18px 40px rgba(0,0,0,.45);display:flex;flex-direction:column;gap:14px}
.edge{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;background:#22252a;border-radius:10px;padding:10px 12px;border:1px solid #121418}
.serial{background:#f4f1e8;color:#1b1b1b;border-radius:4px;padding:4px 10px;font:700 13px/1.2 ui-monospace,monospace;display:flex;flex-direction:column;align-items:flex-start}
.serial b{font:800 22px/1 "Courier New",ui-monospace,monospace;letter-spacing:.12em}
.bats{display:flex;gap:6px;align-items:center;color:#cfd3da;font-size:13px}
.bat{width:16px;height:30px;border-radius:3px;background:linear-gradient(90deg,#c8a33a,#f0d06a 45%,#a8862a);position:relative;border:1px solid #6b5517}
.bat::before{content:"";position:absolute;top:-4px;left:4px;width:6px;height:4px;background:#bbb;border-radius:1px}
.inds{display:flex;gap:8px;flex-wrap:wrap}
.ind{display:flex;align-items:center;gap:6px;background:#111;border-radius:4px;padding:4px 8px;font:800 14px/1 ui-monospace,monospace;color:#ddd;letter-spacing:.08em}
.ind i{width:10px;height:10px;border-radius:50%;background:#333;box-shadow:inset 0 0 2px #000}
.ind.lit i{background:#ffe27a;box-shadow:0 0 8px #ffd24a}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.mod{position:relative;background:#2c3036;border:2px solid #15171b;border-radius:12px;padding:14px 14px 12px;min-height:250px;display:flex;flex-direction:column;gap:10px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.mod h3{font:800 16px/1 var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:#c7cbd2}
.mod .led{position:absolute;top:12px;right:12px;width:16px;height:16px;border-radius:50%;background:#3a1010;border:2px solid #111}
.mod.solved .led{background:#4cff8a;box-shadow:0 0 12px #4cff8a}
.mod.solved{border-color:#245c3a}
.mod.hit{animation:hit .6s ease}
@keyframes hit{0%,100%{box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}30%{box-shadow:0 0 0 4px rgba(255,70,60,.8),inset 0 0 40px rgba(255,60,60,.4)}}
/* Kabel */
.wires{display:flex;flex-direction:column;gap:6px;flex:1;justify-content:center}
.wire{display:flex;align-items:center;gap:8px;border:0;background:none;padding:2px 0;width:100%}
.wire .no{width:16px;color:#8b9099;font:700 12px/1 ui-monospace,monospace}
.wire .term{width:12px;height:18px;background:#9aa0a8;border-radius:2px;flex:none}
.wire .line{flex:1;height:10px;border-radius:5px;background:var(--wc);box-shadow:0 2px 0 rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.25);position:relative}
.wire:hover:not(:disabled) .line{filter:brightness(1.2);transform:scaleY(1.2)}
.wire.cut .line{background:linear-gradient(90deg,var(--wc) 0 44%,transparent 44% 56%,var(--wc) 56%)}
.wire:disabled{cursor:default}
/* Knopf */
.kn{display:flex;align-items:center;justify-content:center;gap:22px;flex:1}
.edition{padding:8px 12px;border-radius:10px;background:rgba(255,107,91,.12);border:1px solid rgba(255,107,91,.45)}
.kn-btn{width:132px;height:132px;border-radius:50%;border:6px solid rgba(0,0,0,.35);background:var(--kc);color:var(--kt);font:900 19px/1 var(--f-display);letter-spacing:.06em;box-shadow:0 8px 0 rgba(0,0,0,.45),inset 0 6px 10px rgba(255,255,255,.35);touch-action:none;user-select:none}
.kn-btn.down{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.45),inset 0 6px 10px rgba(255,255,255,.2)}
.strip{width:22px;height:132px;border-radius:6px;background:#15171b;border:2px solid #0d0e10}
.strip.on{background:var(--sc);box-shadow:0 0 18px var(--sc)}
/* Symbole */
.syms{display:grid;grid-template-columns:1fr 1fr;gap:10px;flex:1}
.sym{background:#e9e4d6;border:2px solid #15171b;border-radius:8px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 6px 6px;color:#1c1c1c}
.sym svg{width:56px;height:56px}
.sym i{width:12px;height:12px;border-radius:50%;background:#333}
.sym.done i{background:#4cff8a;box-shadow:0 0 8px #4cff8a}
.sym:disabled{cursor:default}
/* Farben */
.simon{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px);justify-content:center;flex:1;align-content:center}
.sdots{display:flex;gap:5px;justify-content:center}.sdots i{width:11px;height:11px;border-radius:50%;background:#222;border:1px solid #555}.sdots i.on{background:#4cff8a;box-shadow:0 0 6px #4cff8a}
.pad{border:3px solid #111;border-radius:12px;opacity:.45;transition:opacity .08s,box-shadow .08s}
.pad.lit{opacity:1;box-shadow:0 0 24px var(--pc)}
.pad[data-c=rot]{grid-area:1/2;--pc:#ff4040;background:#ff4040}
.pad[data-c=blau]{grid-area:2/1;--pc:#3d7bff;background:#3d7bff}
.pad[data-c=gruen]{grid-area:2/3;--pc:#36d36c;background:#36d36c}
.pad[data-c=gelb]{grid-area:3/2;--pc:#ffd23d;background:#ffd23d}
/* Passwort */
.pw{display:flex;justify-content:center;gap:6px;flex:1;align-items:center}
.pw .col{display:flex;flex-direction:column;align-items:center;gap:4px}
.pw .col button{width:38px;height:26px;border-radius:6px;border:1px solid #111;background:#3c4148;color:#ddd;font-size:12px;padding:0}
.pw .letter{width:42px;height:52px;border-radius:6px;background:#0f1a10;color:#6dff8f;font:800 32px/52px "Courier New",ui-monospace,monospace;text-align:center;text-shadow:0 0 10px rgba(80,255,120,.6);border:2px solid #0a0f0a}
.pw-send{align-self:center}
/* Labyrinth */
.maze{display:grid;grid-template-columns:repeat(6,26px);grid-template-rows:repeat(6,26px);gap:3px;justify-content:center;background:#1a1d21;padding:8px;border-radius:8px;border:2px solid #111}
.maze i{display:grid;place-items:center;border-radius:4px;background:#2b2f35}
.maze i.mk::after{content:"";width:16px;height:16px;border-radius:50%;border:3px solid #4cff8a}
.maze i.pos::after{content:"";width:14px;height:14px;background:#fff;border-radius:2px;box-shadow:0 0 8px #fff}
.maze i.goal::after{content:"";width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:14px solid #ff4a3d}
.maze i.mk.pos::after{border-color:#fff;background:#fff}
.arrows{display:grid;grid-template-columns:repeat(3,38px);grid-template-rows:repeat(2,32px);gap:4px;justify-content:center}
.arrows button{border-radius:6px;border:1px solid #111;background:#3c4148;color:#ddd;padding:0;font-size:16px}
.arrows [data-d=u]{grid-area:1/2}.arrows [data-d=l]{grid-area:2/1}.arrows [data-d=d]{grid-area:2/2}.arrows [data-d=r]{grid-area:2/3}
/* Morse */
.morse{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;justify-content:center}
.lamp{width:46px;height:46px;border-radius:50%;background:#3a2a12;border:3px solid #111;transition:background .03s}
.lamprow{display:flex;align-items:center;gap:12px}
.startled{display:flex;flex-direction:column;align-items:center;gap:3px;font:700 10px/1 var(--f-body);color:#9aa}
.startled i{width:14px;height:14px;border-radius:50%;background:#123018;border:2px solid #111}
.startled i.on{background:#4cff8a;box-shadow:0 0 10px #4cff8a}
.mletters{display:flex;gap:6px}.mletters i{width:12px;height:6px;border-radius:3px;background:#3a3e44}.mletters i.on{background:#ffcf4a;box-shadow:0 0 6px #ffb020}
.lamp.on{background:#ffcf4a;box-shadow:0 0 26px #ffb020}
.freq{display:flex;align-items:center;gap:8px}
.freq b{font:800 22px/1 "Courier New",ui-monospace,monospace;color:#6dff8f;background:#0f1a10;padding:6px 10px;border-radius:6px;border:2px solid #0a0f0a;min-width:7.2em;text-align:center}
.freq button,.dials button{border-radius:6px;border:1px solid #111;background:#3c4148;color:#ddd;padding:4px 10px}
/* Drehschalter */
.dials{display:flex;justify-content:center;gap:14px;align-items:center;flex:1}
.dial{display:flex;flex-direction:column;align-items:center;gap:4px}
.dial span{width:52px;height:52px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7d838c,#3a3e44);border:3px solid #111;display:grid;place-items:center;font:800 24px/1 var(--f-display);color:#fff}
.modeplate{align-self:center;background:#f4f1e8;color:#1b1b1b;border-radius:4px;padding:3px 12px;font:800 15px/1.2 ui-monospace,monospace}
/* Tastenfeld */
.memo{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;justify-content:center}
.memo .scr{width:90px;height:60px;border-radius:8px;background:#0f1a10;border:2px solid #0a0f0a;color:#6dff8f;font:800 40px/56px "Courier New",ui-monospace,monospace;text-align:center;text-shadow:0 0 10px rgba(80,255,120,.6)}
.memo .keys{display:flex;gap:8px}
.memo .keys button{width:48px;height:58px;border-radius:8px;border:2px solid #111;background:#d8d2c2;color:#1c1c1c;font:900 26px/1 var(--f-display);box-shadow:0 4px 0 #6e6a5f}
.memo .lvls{display:flex;gap:5px}.memo .lvls i{width:12px;height:12px;border-radius:3px;background:#3a1010;border:1px solid #111}.memo .lvls i.on{background:#4cff8a;box-shadow:0 0 6px #4cff8a}
/* Kabelsalat */
.salat{display:flex;justify-content:center;gap:10px;flex:1;align-items:stretch}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0;color:#ddd}
.sw .ledx{width:12px;height:12px;border-radius:50%;background:#333;border:1px solid #111}.sw .ledx.on{background:#fff6c8;box-shadow:0 0 8px #ffe680}
.sw .vl{width:12px;flex:1;min-height:110px;border-radius:6px;background:var(--wc);box-shadow:inset 2px 0 0 rgba(255,255,255,.25),0 2px 0 rgba(0,0,0,.4)}
.sw .vl{position:relative}
.sw.cut .vl::after{content:"";position:absolute;left:-4px;right:-4px;top:44%;height:12%;background:#2c3036;border-top:2px solid #111;border-bottom:2px solid #111;transform:skewY(-20deg)}
.sw small{position:absolute;bottom:-2px}.sw{position:relative}
.sw .st{height:18px;font-size:16px;color:#ffd23d}
.sw:disabled{cursor:default}
/* Druckventil */
.vent{display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;justify-content:center}
.vent .scr{min-width:150px;padding:8px 12px;border-radius:8px;background:#0f1a10;border:2px solid #0a0f0a;color:#6dff8f;font:800 26px/1 "Courier New",ui-monospace,monospace;text-align:center}
.vent.hot .scr{color:#ff6a4a;background:#1a0d0b;animation:blink 1s steps(2) infinite}
.vent .valves{display:flex;gap:8px}.vent .valves button{width:52px;height:44px;border-radius:8px;border:2px solid #111;background:#5a6068;color:#fff;font:900 22px/1 var(--f-display)}
.vent small{color:#aab}
.mod.needy{border-color:#4a3b16}
/* Handbuch – neue Kapitel */
.mazes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.mazes svg{width:100%;height:auto;background:#fbf8ef;border:1px solid #9b9584;border-radius:6px}
.morsetab{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:2px 10px;font:700 15px/1.5 ui-monospace,monospace}
.salattab td{text-align:center;font:800 16px/1 ui-monospace,monospace}
/* Handbuch */
.manual{background:#f3eee0;color:#24211c;border-radius:12px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 14px 34px rgba(0,0,0,.35)}
.manual h2{font:900 28px/1 var(--f-display);text-transform:uppercase;letter-spacing:.03em;color:#8a1f12}
.manual h3{font:800 22px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid #24211c;padding-bottom:4px}
.manual section{display:flex;flex-direction:column;gap:8px}
.manual ol,.manual ul{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:5px}
.manual table{border-collapse:collapse;font-size:14px}
.manual td,.manual th{border:1px solid #9b9584;padding:5px 8px;text-align:left}
.manual th{background:#e2dccb}
.manual .muted{color:#6b6556}
.symcols{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;max-width:520px}
.symcols div{display:flex;flex-direction:column;gap:4px;border:1px solid #9b9584;border-radius:6px;padding:4px;align-items:center;background:#fbf8ef}
.symcols svg{width:100%;max-width:44px;height:auto;color:#1c1c1c}
.symcols b{font-size:12px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:4px 10px;font:700 15px/1.4 ui-monospace,monospace}
.cdot{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px;border:1px solid rgba(0,0,0,.4)}
.tabs{display:flex;flex-wrap:wrap;gap:6px}
.tabs button[aria-pressed=true]{background:#24211c;color:#f3eee0;border-color:#24211c}
.tabs button{border:1px solid #9b9584;background:#fbf8ef;color:#24211c;padding:6px 12px;border-radius:8px;font-weight:700}
/* Ende */
.boom{position:fixed;inset:0;z-index:45;pointer-events:none;display:grid;place-items:center;overflow:hidden}
.boom .flash{position:absolute;inset:0;background:radial-gradient(circle at 50% 55%,#fff 0,#ffd27a 18%,#ff6a2a 38%,rgba(120,30,10,.85) 60%,rgba(0,0,0,.9) 100%);animation:bflash 2.6s ease forwards}
.boom b{position:relative;font:900 clamp(80px,16vw,220px)/1 var(--f-display);color:#fff4d6;text-shadow:0 0 30px #ff7a2a,0 6px 0 #6b1d06;animation:btext 2.6s ease forwards}
@keyframes bflash{0%{opacity:0;transform:scale(.2)}8%{opacity:1;transform:scale(1.4)}60%{opacity:.9}100%{opacity:0;transform:scale(1.6)}}
@keyframes btext{0%{transform:scale(.3) rotate(-8deg);opacity:0}12%{transform:scale(1.15) rotate(3deg);opacity:1}70%{opacity:1}100%{transform:scale(1);opacity:0}}
.shakeall{animation:shk .7s ease}
@keyframes shk{10%,50%{transform:translate(-12px,6px)}30%,70%{transform:translate(10px,-8px)}90%{transform:translate(-4px,3px)}}
.winfx{position:fixed;inset:0;z-index:45;pointer-events:none;background:radial-gradient(ellipse at center,rgba(76,255,138,.35),transparent 70%);animation:wf 2s ease forwards}
@keyframes wf{from{opacity:1}to{opacity:0}}
.finaleval{display:flex;flex-direction:column;gap:12px;border:2px solid #ffd27a;background:linear-gradient(180deg,rgba(255,210,122,.12),transparent)}
.finaleval h2{font:900 clamp(36px,6vw,60px)/1 var(--f-display);text-transform:uppercase;color:#ffd27a}
.result{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:24px 16px}
.result h2{font:900 clamp(48px,8vw,96px)/.9 var(--f-display);text-transform:uppercase}
.result.won h2{color:#4cff8a}.result.lost h2{color:#ff6a4a}
@media (max-width:640px){.timer{font-size:34px}.symcols{grid-template-columns:repeat(3,minmax(0,1fr))}}
</style></head><body>

    if (m.type === 'kabelsalat') body = '<div class="salat">' + d.wires.map((w, k) => '<button type="button" class="sw' + (w.cut ? ' cut' : '') + '" data-act="scut" data-m="' + i + '" data-k="' + k + '" style="--wc:' + SALW[w.color] + '"' + (dis || w.cut ? ' disabled' : '') + ' aria-label="' + (k + 1) + '. Kabel, ' + R.SALAT_COLORS[w.color] + (w.star ? ', Stern' : '') + (w.led ? ', Lämpchen an' : '') + '"><span class="ledx' + (w.led ? ' on' : '') + '"></span><span class="vl"></span><span class="st">' + (w.star ? '★' : '') + '</span>' + (over && w.should ? '<small style="color:#4cff8a">✂</small>' : '') + '</button>').join('') + '</div><small class="muted" style="text-align:center">Oben Lämpchen, unten Stern – klick ein Kabel zum Schneiden.</small>';
    if (m.type === 'ventil') body = '<div class="vent' + (d.active ? ' hot' : '') + '"><div class="scr">' + (d.active ? esc(d.code) : 'DRUCK OK') + '</div><small data-vent="' + i + '">' + (d.active ? 'Ablassen in ' + Math.max(0, Math.ceil((d.due - now()) / 1000)) + ' s' : 'läuft die ganze Zeit mit') + '</small><div class="valves">' + ['A', 'B', 'C'].map(v => '<button type="button" data-act="valve" data-m="' + i + '" data-v="' + v + '"' + (over || !d.active ? ' disabled' : '') + '>' + v + '</button>').join('') + '</div></div>';
    return '<div class="mod' + (solved ? ' solved' : '') + (m.needy ? ' needy' : '') + '" data-mod="' + i + '"><span class="led"' + (m.needy ? ' style="background:' + (d.active ? '#ff4a3d' : '#2a2d33') + '"' : '') + '></span><h3>' + R.MODULES[m.type] + '</h3>' + body + '</div>';
  }).join('');
  return '<div class="casing">' + edge + '<div class="mods">' + mods + '</div></div>';
}

function manualHTML(r, g) {
  const mine = g.manual || [];
  const RU = g.rules || { ed: 1, wires: 0, button: 0, strip: R.STRIP, symCols: R.SYM_COLS, simon: R.SIMON, words: R.WORDS };
  const WI = R.WIRE_SETS[RU.wires] || R.WIRES, BU = R.BUTTON_SETS[RU.button] || R.BUTTON;
  const all = Object.keys(R.MODULES);

  if (!L.tab || (L.tab !== 'allg' && !mine.includes(L.tab))) L.tab = 'allg';

    body = '<section><h3>Allgemein</h3><p class="edition">Handbuch-Ausgabe <b>Nr. ' + RU.ed + '</b> – Achtung: Jede Bombe hat ihr eigenes Handbuch. Regeln, Symbole und Wörter ändern sich jedes Mal!</p><p>Fragt den Entschärfer nach allem, was ihr braucht:</p><ul>' +
      '<li><b>Seriennummer:</b> steht auf dem weißen Schild am Gehäuse. Wichtig sind die <b>letzte Ziffer</b> (gerade oder ungerade) und ob ein <b>Vokal</b> (A, E, I, U) darin vorkommt.</li>' +
      '<li><b>Batterien:</b> Anzahl der goldenen Batterien am Gehäuse.</li><li><b>Anzeigen:</b> kleine Schilder mit drei Buchstaben. Sie können <b>leuchten</b> oder aus sein.</li>' +
      '<li>Jeder Fehler gibt ein <b>X</b>. Sind alle X voll, explodiert die Bombe (meist nach 3, in hohen Leveln schon nach 2 Fehlern).</li><li>Ein grünes Licht oben rechts bedeutet: Modul gelöst.</li></ul>' +
      '<p><b>Deine Kapitel:</b> ' + (mine.length ? mine.map(c => R.MODULES[c]).join(', ') : 'keine') + '</p>' +
      (others.length && mine.length < all.length ? '<p><b>Die anderen Kapitel haben:</b> ' + others.map(o => esc(o.name) + ' (' + o.ch.map(c => R.MODULES[c]).join(', ') + ')').join(' · ') + '</p>' : '') + '</section>';
  } else if (L.tab === 'kabel') {
    body = '<section><h3>Kabel</h3><p>Auf dem Modul sind 3 bis 6 Kabel. Sie werden <b>von oben nach unten</b> gezählt. Es muss genau <b>ein</b> Kabel durchgeschnitten werden. Mögliche Farben: Rot, Blau, Gelb, Weiß, Schwarz.</p>' +
      [3, 4, 5, 6].map(n => '<div><b>' + n + ' Kabel:</b><ol>' + WI[n].map(x => '<li>' + x.t + '</li>').join('') + '</ol></div>').join('') + '<p class="muted">Prüft die Regeln immer von oben nach unten. Die erste, die passt, gilt.</p></section>';
  } else if (L.tab === 'knopf') {
    body = '<section><h3>Der Knopf</h3><p>Ein großer runder Knopf in einer Farbe (Rot, Blau, Gelb, Weiß, Grün oder Schwarz) mit einer Aufschrift. Fragt nach <b>Farbe</b>, <b>Aufschrift</b>, <b>Batterien</b> und <b>leuchtenden Anzeigen</b>.</p>' +
      '<p><b>Schritt 1 – Was ist zu tun?</b> Geht die Regeln <b>von oben nach unten</b> durch. Die <b>erste</b>, die passt, gilt – alle weiteren werden ignoriert.</p><ol>' + BU.map(x => '<li>' + x.t + '</li>').join('') + '</ol>' +
      '<p><b>Kurz drücken:</b> drücken und sofort wieder loslassen.<br><b>Zweimal kurz drücken:</b> zweimal schnell hintereinander tippen (innerhalb von gut einer Sekunde).<br><b>Gedrückt halten:</b> Knopf drücken und festhalten – weiter mit Schritt 2.</p>' +
      '<p><b>Schritt 2 – nur beim Halten:</b> Nach einem Moment leuchtet rechts neben dem Knopf ein <b>farbiger Streifen</b> auf. Der Entschärfer sagt euch die Farbe. Lasst ihn erst los, ' + (R.RELEASE[RU.release || 'any']) + '.</p>' +

      RU.symCols.map((col, i) => '<div><b>' + (i + 1) + '</b>' + col.map(s => sym(s)).join('') + '</div>').join('') + '</div><p class="muted">Tipp: Gebt den Symbolen gemeinsam Namen, z. B. „Auge“, „Blitz“, „Mond“.</p></section>';

    body = '<section><h3>Farben-Echo</h3><p>Vier farbige Felder blinken in einer Folge. Drückt <b>nicht</b> die blinkende Farbe, sondern die Farbe aus der Tabelle. Es kommt darauf an, ob die Seriennummer einen <b>Vokal</b> (A, E, I, U) enthält und wie viele Fehler (X) ihr schon habt.</p>' +
      '<p>Nach jeder richtigen Folge kommt eine Farbe dazu. Gebt immer die <b>ganze Folge</b> von Anfang an ein.</p>' + tbl('vokal', 'Seriennummer MIT Vokal') + tbl('ohne', 'Seriennummer OHNE Vokal') + '</section>';
  } else if (L.tab === 'wort') {
    body = '<section><h3>Passwort</h3><p>Fünf Buchstabenrollen. Mit den Pfeilen blättert man durch je 6 Buchstaben. Nur <b>eines</b> der Wörter unten lässt sich einstellen. Dann „Senden“ drücken.</p><div class="words">' + RU.words.map(w => '<span>' + w + '</span>').join('') + '</div><p class="muted">Tipp: Lasst euch die Buchstaben einer Rolle vorlesen und streicht Wörter aus.</p></section>';
  }
  else if (L.tab === 'labyrinth') {
    const N = 6, C = 24, P = 6, W = N * C + 2 * P;
    const svg = (z, k) => { let out = '<svg viewBox="0 0 ' + W + ' ' + (W + 14) + '" aria-label="Labyrinth ' + (k + 1) + '"><text x="' + (W / 2) + '" y="' + (W + 11) + '" text-anchor="middle" font-size="11" font-weight="700" fill="#24211c">Nr. ' + (k + 1) + '</text>';
      for (let c = 0; c < N * N; c++) { const x = P + (c % N) * C, y = P + Math.floor(c / N) * C, b = z.cells[c];
        out += '<circle cx="' + (x + C / 2) + '" cy="' + (y + C / 2) + '" r="1.6" fill="#9b9584"/>';
        if (z.marks.includes(c)) out += '<circle cx="' + (x + C / 2) + '" cy="' + (y + C / 2) + '" r="7" fill="none" stroke="#1d8a4a" stroke-width="3"/>';
        if (!(b & 1)) out += '<line x1="' + x + '" y1="' + y + '" x2="' + (x + C) + '" y2="' + y + '"/>';
        if (!(b & 8)) out += '<line x1="' + x + '" y1="' + y + '" x2="' + x + '" y2="' + (y + C) + '"/>';
        if (c % N === N - 1 && !(b & 2)) out += '<line x1="' + (x + C) + '" y1="' + y + '" x2="' + (x + C) + '" y2="' + (y + C) + '"/>';
        if (Math.floor(c / N) === N - 1 && !(b & 4)) out += '<line x1="' + x + '" y1="' + (y + C) + '" x2="' + (x + C) + '" y2="' + (y + C) + '"/>'; }
      return out.replace(/<line /g, '<line stroke="#24211c" stroke-width="3" stroke-linecap="round" ') + '</svg>'; };
    body = '<section><h3>Labyrinth</h3><p>Auf dem Modul ist ein 6×6-Feld <b>ohne Wände</b>. Darauf: zwei <b>grüne Kreise</b>, ein <b>weißes Quadrat</b> (da steht der Entschärfer) und ein <b>rotes Dreieck</b> (das Ziel).</p>' +
      '<ol><li>Findet das Labyrinth, dessen grüne Kreise an <b>denselben Stellen</b> sind. Zählt Zeile und Spalte (z. B. „Zeile 2, Spalte 5“).</li><li>Lotst den Entschärfer mit den Pfeilen zum Dreieck. <b>Läuft er gegen eine Wand, gibt es ein X.</b></li></ol><div class="mazes">' + (RU.mazes || []).map(svg).join('') + '</div></section>';
  } else if (L.tab === 'morse') {
    body = '<section><h3>Morse-Licht</h3><p>Ein Lämpchen blinkt immer wieder ein Wort: kurz = <b>Punkt</b>, lang = <b>Strich</b>. Nach jedem Buchstaben eine kleine Pause, nach dem Wort eine lange Pause.</p>' +
      '<p>Bevor das Wort von vorn beginnt, leuchtet das grüne <b>START</b>-Licht. Unter der Lampe zeigen kleine Striche, <b>welcher Buchstabe</b> gerade blinkt – so seht ihr genau, wo ein Buchstabe aufhört.</p><p>Übersetzt das Wort, sucht es in der Liste und sagt dem Entschärfer die <b>Frequenz</b>. Er stellt sie mit den Pfeilen ein und drückt „Senden“. Falsche Frequenz = X.</p>' +
      '<table><tr><th>Wort</th><th>Frequenz</th></tr>' + (RU.morse || []).map(x => '<tr><td><b>' + x.word + '</b></td><td>' + (x.freq / 1000).toFixed(3) + ' MHz</td></tr>').join('') + '</table>' +
      '<p><b>Morse-Alphabet</b></p><div class="morsetab">' + Object.entries(R.MORSE).map(([k, v]) => '<span>' + k + ' ' + v.replace(/\./g, '•').replace(/-/g, '–') + '</span>').join('') + '</div><p class="muted">Tipp: Der Entschärfer sagt „kurz, lang …“, ihr schreibt mit.</p></section>';
  } else if (L.tab === 'drehschalter') {
    body = '<section><h3>Drehschalter</h3><p>Drei Drehschalter mit den Ziffern 0–9 und ein Schild mit dem <b>Modus</b> (A, B oder C). Stellt jeden Schalter auf den Wert aus der Tabelle, dann „Prüfen“ drücken. Falsche Einstellung = X.</p>' +
      '<table><tr><th>Modus</th><th>Schalter 1</th><th>Schalter 2</th><th>Schalter 3</th></tr>' + Object.entries(RU.dials || {}).map(([m, row]) => '<tr><td><b>' + m + '</b></td>' + row.map(x => '<td>' + R.dialText(x) + '</td>').join('') + '</tr>').join('') + '</table>' +
      '<p class="muted">Ist das Ergebnis 10 oder größer, zählt nur die <b>letzte Ziffer</b> (z. B. 14 → 4). Gibt es keine Anzeigen, ist die Anzahl 0.</p></section>';
  } else if (L.tab === 'tastenfeld') {
    body = '<section><h3>Tastenfeld</h3><p>Oben eine <b>Anzeige</b> (1–4), darunter vier Tasten mit den Zahlen 1–4 in wechselnder Reihenfolge. Es gibt <b>4 Stufen</b>. Positionen zählt ihr <b>von links</b> (1–4).</p><p><b>Wichtig:</b> Schreibt euch bei jeder Stufe auf, welche Position und welche Zahl gedrückt wurde. Bei einem Fehler gibt es ein X und es geht zurück auf Stufe 1.</p>' +
      (RU.memory || []).map((st, k) => '<p><b>Stufe ' + (k + 1) + '</b></p><ul>' + st.map((x, d) => '<li>Anzeige <b>' + (d + 1) + '</b>: ' + R.memText(x) + '</li>').join('') + '</ul>').join('') + '</section>';
  } else if (L.tab === 'kabelsalat') {
    const cols = [[false, false, 'ohne Stern, Lämpchen aus'], [true, false, 'mit Stern, Lämpchen aus'], [false, true, 'ohne Stern, Lämpchen an'], [true, true, 'mit Stern, Lämpchen an']];
    body = '<section><h3>Kabelsalat</h3><p>Senkrechte Kabel. Über jedem Kabel ist ein <b>Lämpchen</b> (an oder aus), unter manchen ein <b>Stern</b>. Geht <b>jedes Kabel einzeln</b> durch und schaut in der Tabelle nach. Schneidet alle, die geschnitten werden müssen – ein falsches Kabel gibt ein X.</p>' +
      '<table class="salattab"><tr><th>Farbe</th>' + cols.map(c => '<th>' + c[2] + '</th>').join('') + '</tr>' + Object.entries(R.SALAT_COLORS).map(([c, n]) => '<tr><td style="text-align:left">' + n + '</td>' + cols.map(([star, led]) => '<td>' + ((RU.salat || {})[R.salatKey({ color: c, star, led })] || '') + '</td>').join('') + '</tr>').join('') + '</table>' +
      '<ul>' + Object.entries(R.SALAT_LETTERS).map(([k, x]) => '<li><b>' + k + ':</b> ' + x.t + '</li>').join('') + '</ul></section>';
  } else if (L.tab === 'ventil') {
    body = '<section><h3>Druckventil</h3><p>Dieses Modul kann man <b>nicht lösen</b> – es läuft die ganze Zeit mit. Ab und zu pfeift es und zeigt ein <b>Codewort</b>. Dann bleiben nur <b>10 Sekunden</b>: Der Entschärfer drückt das richtige Ventil (A, B oder C). Zu spät oder falsches Ventil = X.</p>' +
      '<table><tr><th>Codewort</th><th>Ventil</th></tr>' + (RU.vent || []).map(x => '<tr><td><b>' + x.code + '</b></td><td><b>' + x.valve + '</b></td></tr>').join('') + '</table><p class="muted">Tipp: Wer das Kapitel hat, sollte immer kurz bereit sein – auch mitten in einem anderen Rätsel.</p></section>';
  }
  return '<div class="manual"><h2>Handbuch</h2>' + tabs + body + '</div>';
}

function bbStats(r, api) {
  const g = r.g, won = g.phase === 'won', used = (g.ended || Date.now()) - g.started, left = g.deadline - (g.ended || Date.now());
  const ms = g.modStats || [], solved = ms.filter(m => m.solved).length;
  const kpi = (v, t) => '<div class="kpi"><b>' + v + '</b><span>' + t + '</span></div>';
  const aw = [];
  const order = ms.map((m, i) => ({ ...m, i })).filter(m => m.at != null).sort((a, b) => a.at - b.at);
  const steps = order.map((m, k) => ({ ...m, took: m.at - (k ? order[k - 1].at : 0) }));
  if (steps.length) { const f = steps.slice().sort((a, b) => a.took - b.took)[0]; aw.push(api.award(AI.bolt, 'Schnellstes Modul', R.MODULES[f.type] + ' war nach nur ' + api.fmtDur(f.took) + ' erledigt.')); }
  { const worst = ms.filter(m => m.strikes).sort((a, b) => b.strikes - a.strikes)[0]; if (worst) aw.push(api.award(AI.warn, 'Knifflig', R.MODULES[worst.type] + ' hat euch ' + worst.strikes + (worst.strikes === 1 ? ' Fehler' : ' Fehler') + ' gekostet.')); }
  if (won && !g.strikes) aw.push(api.award(AI.calm, 'Ruhige Hand', esc(api.pname(g.defuser)) + ' hat ohne einen einzigen Fehler entschärft.'));
  if (won && left < 30000) aw.push(api.award(AI.clock, 'Sekunden-Krimi', 'Nur noch ' + Math.max(1, Math.ceil(left / 1000)) + ' Sekunden auf der Uhr!'));
  { const talk = r.players.map(p => ({ name: p.name, n: (r.chat || []).filter(c => c.id === p.id && c.t >= g.started && c.t <= (g.ended || Date.now())).length })); const b = api.best(talk, 3); if (b) aw.push(api.award(AI.chat, 'Plaudertasche', api.names(b.names) + (b.names.length > 1 ? ' schrieben je ' : ' schrieb ') + b.n + ' Nachrichten im Chat.')); }
  const rows = ms.map((m, i) => ({ ...m, i })).sort((a, b) => (a.at == null) - (b.at == null) || a.at - b.at).map(m => '<tr><td>' + R.MODULES[m.type] + '</td><td>' + (m.at != null ? fmt(m.at) : '–') + '</td><td>' + (m.at != null ? api.fmtDur(steps.find(x => x.i === m.i).took) : 'nicht gelöst') + '</td><td>' + m.strikes + '</td></tr>').join('');
  const b = (r.records || {}).bb;
  const best = b ? Object.entries(b.best || {}).sort((x, y) => (x[0] === 'frei') - (y[0] === 'frei') || parseInt(x[0].slice(1)) - parseInt(y[0].slice(1))).map(([k, v]) => '<span class="pill">' + (k === 'frei' ? 'Freies Spiel' : 'Level ' + k.slice(1)) + ': ' + fmt(v) + '</span>').join('') : '';
  const defs = b ? Object.entries(b.defusers || {}).filter(([pid]) => r.players.some(p => p.id === pid)).map(([pid, d]) => '<span class="pill">' + esc(api.pname(pid)) + ': ' + d.won + ' entschärft, ' + d.lost + ' Boom</span>').join('') : '';
  return finalEval(r, g) + '<div class="statshead"><span class="big-title" style="color:' + (won ? 'var(--ok)' : 'var(--danger)') + '">' + (won ? 'Entschärft!' : 'BOOM!') + '</span><span class="muted">' + (g.level ? 'Level ' + g.level + ' · ' : '') + 'Entschärfer: ' + esc(api.pname(g.defuser)) + '</span></div>' +
    '<div class="kpis">' + kpi(fmt(used), 'Zeit gebraucht') + kpi(won ? fmt(left) : '0:00', 'Restzeit') + kpi(solved + '/' + ms.length, 'Module gelöst') + kpi(g.strikes + '/' + g.maxStrikes, 'Fehler') + (g.modules.some(m => m.needy) ? kpi(g.vented || 0, 'mal Ventil abgelassen') : '') + '</div>' +
    (aw.length ? '<div class="label">Auszeichnungen</div><div class="awards">' + aw.join('') + '</div>' : '') +
    '<div class="label">Module der Reihe nach</div><div class="tablewrap"><table class="stattable"><thead><tr><th>Modul</th><th>gelöst bei</th><th>Dauer</th><th>Fehler</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    (b ? '<div class="label">An diesem Tisch</div><div class="records"><span class="pill">' + b.played + (b.played === 1 ? ' Bombe' : ' Bomben') + '</span><span class="pill">' + b.won + ' entschärft</span><span class="pill">' + b.boom + ' explodiert</span>' + (b.fastest ? '<span class="pill">schnellstes Modul: ' + R.MODULES[b.fastest.type] + ' nach ' + fmt(b.fastest.ms) + '</span>' : '') + '</div>' +
      (best ? '<div class="label">Bestzeiten</div><div class="records">' + best + '</div>' : '') + (defs ? '<div class="label">Entschärfer-Bilanz</div><div class="records">' + defs + '</div>' : '') : '');
}
// Endauswertung: alle 10 Level geschafft
function campaign(r) {
  const runs = ((r.records || {}).bb || {}).runs || [];
  let i = runs.length - 1; while (i > 0 && !(runs[i].level === 1 && (runs[i - 1].level !== 1))) i--;
  return runs.slice(Math.max(0, i));
}
function finalEval(r, g) {
  if (!(g.level === g.levels && g.phase === 'won')) return '';
  const runs = campaign(r), lv = Array.from({ length: g.levels }, (_, k) => k + 1);
  const winOf = n => runs.filter(x => x.level === n && x.won).slice(-1)[0];
  const tries = n => runs.filter(x => x.level === n).length;
  const total = lv.reduce((a, n) => a + ((winOf(n) || {}).ms || 0), 0), booms = runs.filter(x => !x.won).length, strikes = runs.reduce((a, x) => a + (x.strikes || 0), 0);
  const per = {}; for (const x of runs) { const p = per[x.name] = per[x.name] || { won: 0, boom: 0, ms: 0 }; if (x.won) { p.won++; p.ms += x.ms; } else p.boom++; }
  const kpi = (v, t) => '<div class="kpi"><b>' + v + '</b><span>' + t + '</span></div>';
  const best = Object.entries(per).sort((a, b) => b[1].won - a[1].won || a[1].ms - b[1].ms)[0];
  const fastest = lv.map(n => ({ n, w: winOf(n) })).filter(x => x.w).sort((a, b) => a.w.ms / a.w.mods - b.w.ms / b.w.mods)[0];
  const hardest = lv.map(n => ({ n, t: tries(n) })).sort((a, b) => b.t - a.t)[0];
  const aw = [];
  if (best) aw.push(api.award(AI.trophy, 'Meister-Entschärfer', esc(best[0]) + ' hat ' + best[1].won + ' Level entschärft.'));
  if (fastest) aw.push(api.award(AI.bolt, 'Blitzsauber', 'Level ' + fastest.n + ' ging am schnellsten: ' + fmt(fastest.w.ms) + ' für ' + fastest.w.mods + ' Module (' + esc(fastest.w.name) + ').'));
  if (hardest && hardest.t > 1) aw.push(api.award(AI.warn, 'Harte Nuss', 'Level ' + hardest.n + ' hat euch ' + hardest.t + ' Versuche gekostet.'));
  if (!booms) aw.push(api.award(AI.calm, 'Ohne einen Knall', 'Ihr seid durch alle Level gekommen, ohne dass eine Bombe explodiert ist!'));
  return '<div class="panel finaleval"><h2>Endauswertung</h2><p class="muted" style="margin:0">Alle ' + g.levels + ' Level geschafft – ihr seid ein eingespieltes Bombenkommando!</p>' +
    '<div class="kpis">' + kpi(fmt(total), 'Gesamtzeit (nur die geschafften Bomben)') + kpi(runs.length, 'Bomben insgesamt') + kpi(booms, 'mal BOOM') + kpi(strikes, 'Fehler (X) insgesamt') + '</div>' +
    (aw.length ? '<div class="awards">' + aw.join('') + '</div>' : '') +
    '<div class="tablewrap"><table class="stattable"><thead><tr><th>Level</th><th>Versuche</th><th>Zeit</th><th>Fehler</th><th>Entschärfer</th></tr></thead><tbody>' +
    lv.map(n => { const w = winOf(n); return '<tr><td>' + n + '</td><td>' + tries(n) + '</td><td>' + (w ? fmt(w.ms) : '–') + '</td><td>' + (w ? w.strikes : '–') + '</td><td>' + (w ? esc(w.name) : '–') + '</td></tr>'; }).join('') + '</tbody></table></div>' +
    '<div class="tablewrap"><table class="stattable"><thead><tr><th>Spieler</th><th>als Entschärfer geschafft</th><th>BOOM</th></tr></thead><tbody>' +
    Object.entries(per).sort((a, b) => b[1].won - a[1].won).map(([nm, p]) => '<tr><td>' + esc(nm) + '</td><td>' + p.won + '</td><td>' + p.boom + '</td></tr>').join('') + '</tbody></table></div></div>';
}
function endButtons(r, g, won) {
  if (!g.level || r.settings.mode === 'frei') return api.overButtons(r);
  const nextLv = r.settings.level || 1, canNext = won && g.level < g.levels;
  const alt = api.isHost() && canNext ? (nextLv > g.level ? '<button class="btn small" data-act="replay" data-lv="' + g.level + '">Lieber Level ' + g.level + ' nochmal</button>' : '<button class="btn small" data-act="replay" data-lv="' + (g.level + 1) + '">Doch weiter zu Level ' + (g.level + 1) + '</button>') : '';

}
function renderGame(r, el) {
  const g = r.g; if (!g) { el.innerHTML = ''; return; }
  if (L.offNow !== g.now) { L.offNow = g.now; L.off = g.now - Date.now(); }
  if (L.bombKey !== g.started) { L.bombKey = g.started; L.pw = {}; L.simonPause = {}; L.simonStart = {}; L.simonKey = {}; L.tab = null; }
  const over = r.status === 'over';

  if (over) {
    const won = g.phase === 'won', left = g.deadline - g.ended;
    main = '<div class="panel result ' + (won ? 'won' : 'lost') + '"><h2>' + (won ? 'Entschärft!' : 'BOOM!') + '</h2><p class="muted" style="font-size:17px">' +
      (won ? (g.level ? '<b>Level ' + g.level + '</b> geschafft – ' : 'Geschafft ') + 'mit ' + fmt(left) + ' auf der Uhr und ' + g.strikes + ' Fehler' + (g.strikes === 1 ? '' : 'n') + '.' + (g.level === g.levels ? '<br><b>Ihr habt alle ' + g.levels + ' Level geschafft – ihr seid Profis!</b>' : '') : (g.why === 'time' ? 'Die Zeit ist abgelaufen.' : g.maxStrikes + ' Fehler – das war einer zu viel.') + (g.level ? ' Level ' + g.level + ' nochmal?' : '')) + '</p>' + endButtons(r, g, won) + '</div>' + finalEval(r, g) + bombHTML(g, true);
  } else if (g.role === 'defuser') main = bombHTML(g, false);
  else main = manualHTML(r, g);
  el.innerHTML = '<div style="display:flex;flex-direction:column;gap:16px">' + head(r, g) + main + '</div>';
}

// Timer + Farben-Echo laufen unabhängig vom Neuzeichnen
setInterval(() => {
  const r = api.room; if (!r || !r.g || r.status !== 'playing') return;
  const g = r.g, left = g.deadline - now();
  document.querySelectorAll('[data-timer]').forEach(t => { t.textContent = fmt(left); t.classList.toggle('low', left < 30000); });
  const sec = Math.ceil(left / 1000);
  if (sec !== L.tick) { L.tick = sec; if (left < 30000 && left > 0) api.Snd.play('tick', 1); else if (sec % 1 === 0 && left > 0) api.Snd.play('tick', .25); }
  document.querySelectorAll('[data-strip]').forEach(el => { const i = +el.dataset.strip, d = g.detail && g.detail[i]; const on = !!(d && d.strip && L.pressing === i && Date.now() - (L.pressT || 0) >= STRIP_MS); el.classList.toggle('on', on); if (d && d.strip) el.style.setProperty('--sc', SC[d.strip] || '#000'); });
  if (g.role === 'defuser' && g.detail) {
    g.modules.forEach((m, i) => {
      if (m.type === 'morse' && !m.solved) {
        const st = morseState(g.detail[i].code, Date.now()), lamp = document.querySelector('[data-morse="' + i + '"]'), sl = document.querySelector('[data-mstart="' + i + '"]'), lt = document.querySelector('[data-mlet="' + i + '"]');
        if (lamp) lamp.classList.toggle('on', st.on); if (sl) sl.classList.toggle('on', st.start);
        if (lt) lt.querySelectorAll('i').forEach((x, k) => x.classList.toggle('on', k === st.li));
      }
      if (m.type === 'ventil') { const v = document.querySelector('[data-vent="' + i + '"]'), d = g.detail[i]; if (v && d.active) v.textContent = 'Ablassen in ' + Math.max(0, Math.ceil((d.due - now()) / 1000)) + ' s'; }
    });
    g.modules.forEach((m, i) => {
      if (m.type !== 'farben' || m.solved) return;
      const box = document.querySelector('[data-simon="' + i + '"]'); if (!box) return;
      const d = g.detail[i], seq = d.flash, step = 650, cycle = seq.length * step + 2200;
      // Die Folge startet immer von vorn: nach einer neuen Stufe sofort, nach einem Tastendruck nach kurzer Pause
      const key = d.stage + ':' + g.strikes;
      if (L.simonKey[i] !== key) { L.simonKey[i] = key; L.simonStart[i] = Math.max(L.simonStart[i] || 0, Date.now() + 700); }
      const t0 = L.simonStart[i] || 0, el = Date.now() - t0;
      const t = el < 0 ? -1 : el % cycle, idx = Math.floor(t / step), on = t >= 0 && idx < seq.length && (t % step) < 420;
      box.querySelectorAll('.pad').forEach(p => { if (!p.matches(':active')) p.classList.toggle('lit', on && p.dataset.c === seq[idx]); });
    });
  }
}, 80);

// Morse: grünes START-Licht, dann Punkt = 1 Einheit an, Strich = 3, Pause im Buchstaben 1,
// deutliche Pause zwischen Buchstaben (5), am Ende lange Pause (8). Die Striche darunter zeigen, welcher Buchstabe gerade dran ist.
const MU = 260;
function morseTimeline(code) {
  const seg = [[2, 3, -1], [0, 3, -1]];   // [Art, Einheiten, Buchstabe]: 2 = START-Licht
  code.split(' ').forEach((ltr, li, arr) => { [...ltr].forEach((c, k) => { seg.push([1, c === '.' ? 1 : 3, li]); if (k < ltr.length - 1) seg.push([0, 1, li]); }); seg.push([0, li < arr.length - 1 ? 5 : 8, -1]); });
  return seg;
}
const MT = {};
function morseState(code, t) {
  const seg = MT[code] || (MT[code] = morseTimeline(code)), total = seg.reduce((a, x) => a + x[1], 0);
  let u = Math.floor(t / MU) % total; for (const [k, n, li] of seg) { if (u < n) return { on: k === 1, start: k === 2, li }; u -= n; } return { on: false, start: false, li: -1 };
}
function onState(prev, r) {

  if (!g.ev || g.ev.seq === L.lastSeq) return;
  L.lastSeq = g.ev.seq;

  if (e.kind === 'strike') {
    S.play('strike'); api.toast('Fehler! ' + (e.what || '') + ' – ' + g.strikes + ' von ' + g.maxStrikes + ' X');
    const m = document.querySelector('[data-mod="' + e.m + '"]'); if (m) m.classList.add('hit');
    document.body.classList.remove('shakeall'); void document.body.offsetWidth; document.body.classList.add('shakeall');
  }
  if (e.kind === 'solved') { S.play('solve'); if (g.role !== 'defuser') api.toast(R.MODULES[g.modules[e.m].type] + ' ist gelöst!'); }
  if (e.kind === 'ok') S.play('click', .6);
  if (e.kind === 'stage') S.play('solve', .5);
  if (e.kind === 'cut') S.play('snip');
  if (e.kind === 'vent') { S.play('strike', .5); if (g.role === 'defuser') api.toast('Das Druckventil pfeift! Schnell den Code durchsagen.'); }
  if (e.kind === 'vented') S.play('solve', .6);
  if (e.kind === 'step') S.play('click', .4);

    document.body.classList.remove('shakeall'); void document.body.offsetWidth; document.body.classList.add('shakeall');

  }

}
})();
