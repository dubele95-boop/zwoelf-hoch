<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gleichklang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="/common.css">
<style>
:root{--accent:#4fd1c5;--accent-ink:#06211f}
.gk-card{--w:92px;width:var(--w);aspect-ratio:5/7;border-radius:12px;background:var(--card);color:var(--h,#1d7d8f);display:grid;place-items:center;font:900 calc(var(--w) * .46)/1 var(--f-display);position:relative;flex:none;box-shadow:0 2px 0 rgba(0,0,0,.25),0 10px 22px rgba(0,0,0,.3);border:2px solid color-mix(in srgb,var(--h,#1d7d8f) 30%,#fff)}
.gk-card small{position:absolute;top:6px;left:8px;font-size:calc(var(--w) * .16)}
.gk-card small.b{top:auto;left:auto;bottom:6px;right:8px;transform:rotate(180deg)}
.gk-back{width:var(--w,26px);aspect-ratio:5/7;border-radius:5px;background:linear-gradient(135deg,#2c6f69,#1b3f4f);border:1px solid rgba(255,255,255,.18);flex:none}
.gk-top{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between}
.gk-level{display:flex;align-items:baseline;gap:10px}
.gk-level b{font:900 54px/1 var(--f-display)}
.gk-level span{color:var(--muted);font-weight:700}
.gk-res{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.gk-res .grp{display:flex;align-items:center;gap:4px}
.gk-res svg{width:26px;height:26px}
.gk-res .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-right:6px}
.heart{color:#ff6b7a}.heart.empty{color:rgba(255,255,255,.14)}
.star{color:#ffd166}
.starbtn{border:1px solid rgba(255,209,102,.55);background:rgba(255,209,102,.08);border-radius:10px;padding:4px 10px;display:flex;align-items:center;gap:4px}
.starbtn:hover{background:rgba(255,209,102,.18);border-color:#ffd166}
.starhint{font-size:12px;font-weight:700;color:#ffd166;margin-left:4px}
.gk-players{display:flex;flex-wrap:wrap;gap:10px}
.gk-p{display:flex;flex-direction:column;gap:6px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.18);min-width:130px}
.gk-p .nm{font-weight:700;display:flex;gap:6px;align-items:center}
.gk-p .backs{display:flex;gap:3px;min-height:36px;align-items:center;--w:24px}
.gk-p .backs .gk-back{margin-left:-12px}.gk-p .backs .gk-back:first-child{margin-left:0}
.gk-p.me{border-color:rgba(79,209,197,.5)}
.gk-p.flash{animation:pflash .7s ease}
@keyframes pflash{0%{box-shadow:0 0 0 0 rgba(79,209,197,.0)}30%{box-shadow:0 0 0 4px rgba(79,209,197,.7)}100%{box-shadow:0 0 0 0 rgba(79,209,197,0)}}
.gk-mid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:stretch}
.gk-pile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:270px;position:relative}
.gk-pile .stack{position:relative;width:132px;aspect-ratio:5/7}
.gk-pile .stack .gk-card{--w:132px;position:absolute;inset:0}
.gk-pile .who{color:var(--muted);font-size:14px;min-height:21px}
.gk-pile .empty{width:132px;aspect-ratio:5/7;border:2px dashed var(--line-2);border-radius:12px;display:grid;place-items:center;color:var(--muted);font-weight:700;text-align:center;padding:10px}
.pop{animation:pop .35s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:translateY(-30px) scale(1.25) rotate(-6deg);opacity:0}to{transform:none;opacity:1}}
.shake{animation:shake .5s ease}
@keyframes shake{20%{transform:translateX(-10px) rotate(-3deg)}40%{transform:translateX(9px) rotate(3deg)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.gk-out{display:flex;flex-direction:column;gap:8px}
.gk-out .list{display:flex;flex-wrap:wrap;gap:8px}
.gk-out .x{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:var(--muted)}
.gk-out .x .gk-card{--w:46px;opacity:.85}
.gk-hand{display:flex;flex-direction:column;gap:12px}
.gk-hand .cards{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;min-height:140px}
.gk-hand .cards .gk-card{--w:92px}
.gk-hand .cards button{padding:0;border:0;background:none;border-radius:12px}
.gk-hand .cards button .gk-card{transition:transform .15s ease}
.gk-hand .cards button:not(:disabled):hover .gk-card{transform:translateY(-8px)}
.gk-hand .cards button.lowest .gk-card{outline:3px solid var(--accent);outline-offset:3px}
.gk-hand .cards button:disabled{cursor:default}
.gk-hand .cards button:disabled .gk-card{filter:saturate(.75) brightness(.92)}
.gk-ready{text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;padding:28px 16px}
.gk-ready h2{font:900 clamp(44px,7vw,80px)/.9 var(--f-display);text-transform:uppercase}
.gk-ready .reward{font-weight:700;color:var(--accent)}
.gk-ready .who{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.gk-vote{border-color:rgba(255,209,102,.6);background:rgba(255,209,102,.08);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.gk-over{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding:24px 16px}
.gk-over h2{font:900 clamp(44px,7vw,84px)/.9 var(--f-display);text-transform:uppercase}
.gk-over table{border-collapse:collapse;font-variant-numeric:tabular-nums}
.gk-over td,.gk-over th{padding:6px 12px;border-bottom:1px solid var(--line);text-align:right}
.gk-over td:first-child,.gk-over th:first-child{text-align:left}
.redflash{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(255,60,60,0),rgba(255,60,60,.35));animation:rf .8s ease forwards;z-index:40}
@keyframes rf{from{opacity:1}to{opacity:0}}
/* Sonderkarten */
.spc{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 8px;border-radius:12px;border:1px solid var(--sc);background:color-mix(in srgb,var(--sc) 14%,transparent);text-align:left;min-width:0}
.spc .ico{width:38px;height:52px;border-radius:7px;display:grid;place-items:center;background:var(--sc);color:#14121f;flex:none;box-shadow:0 4px 10px rgba(0,0,0,.3)}
.spc .ico svg{width:24px;height:24px}
.spc b{display:block;font-size:15px}
.spc small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
button.spc:not(:disabled):hover{background:color-mix(in srgb,var(--sc) 26%,transparent)}
button.spc:disabled{opacity:.55;cursor:default}
.sp-echo{--sc:#7fd6ff}.sp-schild{--sc:#9be38a}.sp-spiegel{--sc:#ff9ad5}.sp-pause{--sc:#c9b8ff}.sp-tausch{--sc:#ffb86b}
.spcards{display:flex;flex-wrap:wrap;gap:8px}
.gk-sp{--w:92px;width:var(--w);aspect-ratio:5/7;border-radius:12px;background:linear-gradient(165deg,color-mix(in srgb,var(--sc) 92%,#fff),color-mix(in srgb,var(--sc) 70%,#1a1530));color:#16122a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px 6px;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.25),0 10px 22px rgba(0,0,0,.3);border:2px solid color-mix(in srgb,var(--sc) 60%,#fff);position:relative}
.gk-sp .ico{width:46%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.55);display:grid;place-items:center}
.gk-sp .ico svg{width:62%;height:62%}
.gk-sp b{font:800 calc(var(--w) * .135)/1.1 var(--f-body);hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.gk-sp::after{content:"";position:absolute;inset:5px;border-radius:8px;border:1px dashed rgba(22,18,42,.35);pointer-events:none}
.gk-hand .cards .spbtn{padding:0;border:0;background:none;border-radius:12px}
.gk-hand .cards .spbtn .gk-sp{transition:transform .15s ease}
.gk-hand .cards .spbtn:not(:disabled):hover .gk-sp{transform:translateY(-8px)}
.gk-hand .cards .spbtn:disabled{cursor:default}
.gk-hand .cards .spbtn:disabled .gk-sp{filter:grayscale(.5) brightness(.8)}
.handgap{width:6px;align-self:stretch;border-left:2px dashed var(--line-2);margin:0 4px}
.shield{color:#9be38a}
.mirror{display:inline-flex;align-items:center;gap:6px;color:#ff9ad5;border-color:rgba(255,154,213,.6)}
.gk-p.near{border-color:#7fd6ff;box-shadow:0 0 0 3px rgba(127,214,255,.35),0 0 24px rgba(127,214,255,.35)}
.gk-p .nearlbl{font-size:11px;font-weight:800;color:#7fd6ff;text-transform:uppercase;letter-spacing:.06em}
.gk-p .spn{font-size:11px;color:#ffd166;font-weight:700}
.pausebox{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,16,40,.82);border-radius:14px;text-align:center;z-index:2}
.pausebox b{display:block;font:900 64px/1 var(--f-display);color:#c9b8ff}
.pausebox span{color:var(--muted);font-weight:700}
.splist{display:flex;flex-direction:column;gap:6px}
.splist .spc{justify-content:space-between}
.splist .spc > div{display:flex;align-items:center;gap:10px;min-width:0}
.pick{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
@media (max-width:760px){.gk-mid{grid-template-columns:minmax(0,1fr)}.gk-hand .cards .gk-card,.gk-hand .cards .gk-sp{--w:70px}}
</style></head><body>
<div id="app"></div>
<script src="/common.js"></script>
<script>
(function(){
const esc = Spieleabend.esc;
const HEART = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4 6.8 4c2.2 0 3.6 1.2 5.2 3 1.6-1.8 3-3 5.2-3C21 4 23.1 8 21.6 11.6 19.5 16.4 12 21 12 21z"/></svg>';
const STAR = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7.3L12 17.8 5.7 21.5l1.7-7.3L2 9.5l7.1-.6z"/></svg>';
const hue = v => { const t = (v - 1) / 99; const h = 175 + t * 205; return 'hsl(' + (h % 360) + ' 62% 38%)'; };
const card = (v, extra) => '<div class="gk-card' + (extra || '') + '" style="--h:' + hue(v) + '"><small>' + v + '</small>' + v + '<small class="b">' + v + '</small></div>';
let local = { lastSeq: 0, lastLevelEv: null, pick: false, tick: 0 };
const SP = {
  echo: { name: 'Echo', text: 'Zeigt allen, wer eine Karte nah an der obersten Zahl hat (bis 10 entfernt).', ico: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="5" cy="12" r="2" fill="currentColor"/><path d="M9.5 8a6 6 0 0 1 0 8M13.5 5a10 10 0 0 1 0 14M17.5 2.5a14 14 0 0 1 0 19"/></svg>' },
  schild: { name: 'Schutzschild', text: 'Fängt automatisch den nächsten Fehler ab – kein Leben weg.', ico: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/></svg>' },
  spiegel: { name: 'Spiegel', text: 'Ab jetzt wird rückwärts gelegt: die größte Zahl zuerst.', ico: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg>' },
  pause: { name: 'Pause', text: '10 Sekunden lang kann niemand legen. Durchatmen!', ico: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16" rx="1.2"/><rect x="14" y="4" width="4" height="16" rx="1.2"/></svg>' },
  tausch: { name: 'Tausch', text: 'Du tauschst deine nächste Karte mit der eines Mitspielers.', ico: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg>' }
};
const SHIELD = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/></svg>';
const spCardBig = k => '<div class="gk-sp sp-' + k + '"><span class="ico">' + SP[k].ico + '</span><b>' + SP[k].name + '</b></div>';
const spCard = (k, attrs) => '<' + (attrs ? 'button type="button" ' + attrs : 'div') + ' class="spc sp-' + k + '"><span class="ico">' + SP[k].ico + '</span><span><b>' + SP[k].name + '</b><small>' + SP[k].text + '</small></span></' + (attrs ? 'button' : 'div') + '>';

const AI = {
  bolt: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
  jump: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18c4-10 10-10 14-4"/><path d="M14 9l4 5-6 1"/></svg>',
  calm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9.5h.01M15 9.5h.01"/></svg>',
  fire: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c3 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-5 3-6 0 3 1 4 2 4 0-4-1-6 1-9z"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  team: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-4 3-7 6-7s6 3 6 7zM12 20c0-3 2-6 4-7 3 0 6 3 6 7z"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-5 4V5a1 1 0 0 1 1-1z"/></svg>',
  trophy: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 3h10v3h3v2a4 4 0 0 1-4 4 5 5 0 0 1-3 3v3h3v3H8v-3h3v-3a5 5 0 0 1-3-3 4 4 0 0 1-4-4V6h3zm0 5V6H5v2a2 2 0 0 0 2 2zm10 0a2 2 0 0 0 2-2V6h-2z"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l10 18H2zm-1 7v5h2V9zm0 7v2h2v-2z"/></svg>',
  pack: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 4a4 4 0 0 1 8 0h3a1 1 0 0 1 1 1v15a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a1 1 0 0 1 1-1zm2 0h4a2 2 0 0 0-4 0zm-2 8v3h8v-3z"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4 6.8 4c2.2 0 3.6 1.2 5.2 3 1.6-1.8 3-3 5.2-3C21 4 23.1 8 21.6 11.6 19.5 16.4 12 21 12 21z"/></svg>',
  gift: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9h18v4H3zM5 13h14v8H5zM11 9h2v12h-2zM12 9C9 9 7 7 8 5s4 0 4 4zm0 0c3 0 5-2 4-4s-4 0-4 4z"/></svg>',
  magic: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15 4l1.6 3.7 4 .4-3 2.7.9 3.9-3.5-2-3.5 2 .9-3.9-3-2.7 4-.4z"/><path d="M3 21l8-8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
};

function gkStats(r, api) {
  const g = r.g, st = g.stats || {}, P = r.players, won = g.phase === 'won';
  const nm = id => esc(api.pname(id)), dur = (g.ended || Date.now()) - g.started;
  const sumPlayed = Object.values(st.played || {}).reduce((a, b) => a + b, 0);
  const levelReached = won ? g.maxLevel : (st.levelsDone || 0);
  const kpi = (v, t) => '<div class="kpi"><b>' + v + '</b><span>' + t + '</span></div>';
  const list = f => P.map(p => ({ name: p.name, n: f(p.id) || 0 }));
  const aw = [];
  if (st.bestJump && st.bestJump.gap >= 10) aw.push(api.award(AI.jump, 'Großer Sprung', nm(st.bestJump.pid) + ' legte die ' + st.bestJump.v + (st.bestJump.from && st.bestJump.from !== 101 ? ' direkt nach der ' + st.bestJump.from : ' als erste Karte') + ' – ' + st.bestJump.gap + ' Zahlen Abstand, ohne Fehler.'));
  if (st.fastest) aw.push(api.award(AI.bolt, 'Blitzreaktion', nm(st.fastest.pid) + ' legte die ' + st.fastest.v + ' schon nach ' + (st.fastest.ms / 1000).toFixed(1).replace('.', ',') + ' Sekunden.'));
  { const calm = P.filter(p => !(st.early || {})[p.id] && (st.played || {})[p.id]).map(p => ({ name: p.name, n: st.played[p.id] })); const b = api.best(calm, 3); if (b) aw.push(api.award(AI.calm, 'Ruhige Hand', api.names(b.names) + (b.names.length > 1 ? ' haben je ' : ' hat ') + b.n + ' Karten gelegt und nie zu früh.')); }
  { const b = api.best(list(id => (st.early || {})[id])); if (b) aw.push(api.award(AI.fire, 'Draufgänger', api.names(b.names) + (b.names.length > 1 ? ' legten je ' : ' legte ') + b.n + 'x zu früh.')); }
  { const b = api.best(list(id => (st.mistakes || {})[id])); if (b) aw.push(api.award(AI.clock, 'Zu lange gezögert', 'Bei ' + api.names(b.names) + ' lagen ' + b.n + (b.n === 1 ? ' Karte' : ' Karten') + ' zu lange auf der Hand.')); }
  { const b = api.best(list(id => ((st.starsProposed || {})[id] || 0) + ((st.specialsBy || {})[id] || 0))); if (b) aw.push(api.award(AI.magic, 'Trickkiste', api.names(b.names) + (b.names.length > 1 ? ' haben je ' : ' hat ') + b.n + 'x einen Stern vorgeschlagen oder eine Sonderkarte gespielt.')); }
  const rows = P.slice().sort((a, b) => ((st.played || {})[b.id] || 0) - ((st.played || {})[a.id] || 0)).map(p => '<tr' + (p.id === r.me ? ' class="me"' : '') + '><td>' + esc(p.name) + (p.bot ? ' <span class="pill bot">Bot</span>' : '') + '</td><td>' + ((st.played || {})[p.id] || 0) + '</td><td>' + ((st.early || {})[p.id] || 0) + '</td><td>' + ((st.mistakes || {})[p.id] || 0) + '</td><td>' + (((st.specialsBy || {})[p.id] || 0) + ((st.starsProposed || {})[p.id] || 0)) + '</td><td>' + ((g.reveal && g.reveal[p.id]) || []).join(', ') + '</td></tr>').join('');
  const rec = (r.records || {}).gk;
  return '<div class="statshead"><span class="big-title" style="color:' + (won ? 'var(--ok)' : 'var(--danger)') + '">' + (won ? 'Geschafft!' : 'Verloren') + '</span><span class="muted">Runde ' + r.round + ' · ' + api.fmtDur(dur) + '</span></div>' +
    '<div class="kpis">' + kpi(levelReached + '/' + g.maxLevel, 'Level geschafft') + kpi(sumPlayed, 'Karten gelegt') + kpi(st.bestStreak || 0, 'längste Serie ohne Fehler') + kpi(st.perfect || 0, 'perfekte Level') + kpi(st.livesLost || 0, 'Leben verloren') + kpi((st.starsUsed || 0) + ' / ' + (st.shieldsUsed || 0) + ' / ' + (st.specials || 0), 'Sterne / Schilde / Sonderkarten') + '</div>' +
    (aw.length ? '<div class="label">Auszeichnungen</div><div class="awards">' + aw.join('') + '</div>' : '') +
    '<div class="label">Spieler</div><div class="tablewrap"><table class="stattable"><thead><tr><th>Spieler</th><th>gelegt</th><th>zu früh</th><th>zu lange gehalten</th><th>Sterne & Sonder&shy;karten</th><th>übrige Karten</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
    (rec ? '<div class="label">An diesem Tisch</div><div class="records"><span class="pill">' + rec.games + (rec.games === 1 ? ' Spiel' : ' Spiele') + '</span><span class="pill">' + rec.wins + ' gewonnen</span><span class="pill">bestes Level: ' + rec.bestLevel + '</span><span class="pill">längste Serie: ' + (rec.bestStreak || 0) + ' Karten</span></div>' : '');
}
function spSettings(r, host) { const on = r.settings.specials || {}, all = Object.keys(SP).every(k => on[k]);
        return '<div class="field"><div class="row" style="justify-content:space-between"><span class="label">Sonderkarten</span>' + (host ? '<button type="button" class="btn small" data-set="allSpecials" data-val="' + !all + '">' + (all ? 'Alle ausschalten' : 'Alle einschalten') + '</button>' : '') + '</div><div class="splist">' +
          Object.keys(SP).map(k => '<div class="spc sp-' + k + '"><div><span class="ico">' + SP[k].ico + '</span><span><b>' + SP[k].name + '</b><small>' + SP[k].text + '</small></span></div>' +
            (host ? '<button type="button" class="toggle" role="switch" aria-checked="' + !!on[k] + '" aria-label="' + SP[k].name + '" data-set="sp_' + k + '" data-val="' + !on[k] + '"><i></i></button>' : '<span class="pill' + (on[k] ? ' live' : '') + '">' + (on[k] ? 'an' : 'aus') + '</span>') + '</div>').join('') +
          '</div><small class="muted">Werden ab Level 2 verteilt. Bots bekommen keine Sonderkarten.</small></div>'; }
const api = Spieleabend.start({
  game: 'gleichklang', title: 'Gleichklang', tagline: 'Gemeinsam aufsteigend – ohne Worte',
  brand: '<b>Gleich<i>klang</i></b>',
  meta: { min: 2, max: 6, bots: true, maxBots: 5 },
  hero: '<h1>Gleich<em>klang</em></h1><p>Ihr spielt alle zusammen. Jeder hat ein paar Zahlen zwischen 1 und 100. Legt sie gemeinsam in aufsteigender Reihenfolge in die Mitte – aber ohne zu reden, ohne Zeichen. Nur mit Gefühl für den richtigen Moment.</p>' +
    '<div class="art row" aria-hidden="true">' + [7, 23, 46, 81].map(v => card(v)).join('') + '</div>' +
    '<ol class="steps"><li>Tisch erstellen und den Link an deine Freunde schicken (oder Bots dazunehmen).</li><li>Jeder sieht nur seine eigenen Karten.</li><li>Wer glaubt, die kleinste Zahl zu haben, legt sie einfach. Schafft ihr alle Level?</li></ol>',
  rules: () => '<p>Gleichklang ist ein <b>gemeinsames</b> Spiel: Ihr gewinnt oder verliert zusammen.</p>' +
    '<h3>Ablauf</h3><ol><li>In Level 1 bekommt jeder 1 Karte, in Level 2 zwei Karten und so weiter. Die Zahlen gehen von 1 bis 100.</li>' +
    '<li>Ihr legt alle Karten zusammen auf einen Stapel – <b>aufsteigend</b>. Es gibt keine Reihenfolge, wer dran ist: Wer meint, jetzt sei seine Zahl dran, legt sie.</li>' +
    '<li>Während gelegt wird, darf <b>nicht geredet</b> werden (der Chat ist dann aus). Ihr müsst ein Gefühl für die Zeit entwickeln: Wer eine 3 hat, legt schnell – wer eine 90 hat, wartet lange.</li>' +
    '<li>Du legst immer deine kleinste Karte (nach einem Spiegel: deine größte).</li></ol>' +
    '<h3>Fehler</h3><ul><li>Hatte jemand noch eine kleinere Zahl, als gerade gelegt wurde, verliert das Team <b>ein Leben</b>. Alle kleineren Karten werden aufgedeckt und abgeworfen, dann geht es weiter.</li><li>Sind alle Leben weg, ist das Spiel verloren.</li></ul>' +
    '<h3>Sterne</h3><ul><li>Steckt ihr fest, kann jemand einen <b>Stern</b> vorschlagen. Sind alle einverstanden, wirft jeder seine kleinste Karte offen ab – das gibt euch Hinweise.</li></ul>' +
    '<h3>Sonderkarten</h3><p>Ab Level 2 werden zusätzlich Sonderkarten verteilt (ab Level 5 zwei pro Level). Welche mitspielen, legt der Gastgeber in der Lobby fest. Einsetzen kannst du sie, während gelegt wird – einfach anklicken.</p><div class="splist">' + Object.keys(SP).map(k => spCard(k)).join('') + '</div><p class="muted">Das Schutzschild bekommt das ganze Team; es wird beim nächsten Fehler automatisch verbraucht (höchstens 2 gleichzeitig).</p>' +
    '<h3>Belohnungen</h3><ul><li>Nach Level 2, 5 und 8 gibt es einen Stern, nach Level 3, 6 und 9 ein Leben dazu.</li><li>Gewonnen habt ihr, wenn ihr das letzte Level schafft (2 Spieler: 12 Level, 3 Spieler: 10, ab 4 Spielern: 8).</li></ul>' +
    '<h3>Vor jedem Level</h3><ul><li>Alle drücken „Bereit“. Erst dann werden die Karten verteilt. Kurz durchatmen, konzentrieren – los.</li></ul>',
  lobby: (r, host) => {
    const m = r.settings.mode;
    const opt = (v, t) => '<button type="button" data-set="mode" data-val="' + v + '" aria-pressed="' + (m === v) + '"' + (host ? '' : ' disabled') + '>' + t + '</button>';
    return '<div class="field"><span class="label">Schwierigkeit</span><div class="seg">' + opt('leicht', 'Leicht') + opt('normal', 'Normal') + opt('schwer', 'Schwer') + '</div>' +
      '<small class="muted">' + (m === 'leicht' ? 'Ein Leben und ein Stern mehr zum Start.' : m === 'schwer' ? 'Ein Leben weniger und kein Stern zum Start.' : 'So viele Leben wie Spieler und ein Stern.') + '</small></div>' +
      spSettings(r, host) +
      '<div class="field"><span class="label">Kurz erklärt</span><p class="muted">Legt eure Zahlen gemeinsam aufsteigend ab, ohne zu reden. Wer zu früh legt oder zu lange wartet, kostet ein Leben.</p></div>';
  },
  stats: (r, api) => gkStats(r, api),
  livePanel: r => '<p class="muted" style="margin:0">Änderungen gelten ab dem nächsten Level. Bereits verteilte Sonderkarten bleiben auf der Hand.</p>' + spSettings(r, true),
  chatQuiet: r => r.status === 'playing' && r.g && r.g.phase === 'play' ? 'Psst! Während ihr legt, wird nicht geredet.' : null,
  render: renderGame,
  onState,
  actions: {
    ready: () => api.act('ready'),
    play: () => api.act('play'),
    star: () => api.act('star'),
    yes: () => api.act('vote', { yes: true }),
    no: () => api.act('vote', { yes: false }),
    sp: el => { const k = el.dataset.k; if (k === 'tausch') { local.pick = true; api.render(); return; } api.act('special', { kind: k }); },
    swap: el => { local.pick = false; api.act('special', { kind: 'tausch', target: el.dataset.pid }); },
    swapCancel: () => { local.pick = false; api.render(); }
  },
  onEscape: () => { if (local.pick) { local.pick = false; api.render(); } },
  sounds: {
    play: (S, t, v) => S.tone(520, t, .22, 'triangle', .14 * v),
    lvl: (S, t, v) => [523, 659, 784, 1047, 1319].forEach((f, i) => S.tone(f, t + i * .08, .35, 'triangle', .14 * v)),
    echo: (S, t, v) => [0, .18, .36].forEach((d, i) => S.tone(880, t + d, .5 - i * .1, 'sine', (.12 - i * .03) * v)),
    shield: (S, t, v) => { S.tone(440, t, .3, 'triangle', .14 * v); S.tone(880, t + .05, .5, 'sine', .1 * v); },
    mirror: (S, t, v) => [1319, 1047, 784, 523].forEach((f, i) => S.tone(f, t + i * .07, .3, 'triangle', .12 * v)),
    pausefx: (S, t, v) => { S.tone(330, t, .6, 'sine', .14 * v); S.tone(247, t + .3, .8, 'sine', .12 * v); },
    swapfx: (S, t, v) => { S.tone(523, t, .15, 'triangle', .12 * v); S.tone(784, t + .12, .15, 'triangle', .12 * v); S.tone(523, t + .24, .2, 'triangle', .12 * v); },
    starfx: (S, t, v) => [1568, 1976, 2349, 2637].forEach((f, i) => S.tone(f, t + i * .06, .45, 'sine', .08 * v))
  }
});

function renderGame(r, el) {
  const g = r.g; if (!g) { el.innerHTML = ''; return; }
  const me = r.me, mine = r.players.some(p => p.id === me);
  const hearts = Array.from({ length: Math.max(g.lives, 0) }, () => '<span class="heart">' + HEART + '</span>').join('') || '<span class="muted">keine</span>';
  const canStar = mine && r.status === 'playing' && g.phase === 'play' && g.stars > 0 && !g.vote && Object.values(g.counts).some(n => n > 0);
  local.off = (g.now || Date.now()) - Date.now();
  const paused = g.pausedUntil > Date.now() + local.off;
  const echoOn = g.echo && g.echo.until > Date.now() + local.off ? g.echo : null;
  const shields = g.shields ? '<div class="grp" title="Schutzschild: fängt den nächsten Fehler ab"><span class="lbl">Schild</span>' + Array.from({ length: g.shields }, () => '<span class="shield">' + SHIELD + '</span>').join('') + '</div>' : '';
  const stars = Array.from({ length: g.stars }, () => '<span class="star">' + STAR + '</span>').join('') || '<span class="muted">keine</span>';
  const top = '<div class="panel gk-top"><div class="gk-level"><b>Level ' + g.level + '</b><span>von ' + g.maxLevel + '</span></div>' +
    '<div class="gk-res"><div class="grp" title="Leben"><span class="lbl">Leben</span>' + hearts + '</div>' + shields + (canStar ? '<button type="button" class="grp starbtn" data-act="star" title="Stern einsetzen: Jeder wirft seine kleinste Karte offen ab"><span class="lbl">Sterne</span>' + stars + '<span class="starhint">einsetzen</span></button>'
      : '<div class="grp" title="' + (g.stars ? (g.phase === 'play' ? (g.vote ? 'Abstimmung läuft' : 'Sterne') : 'Sterne kannst du einsetzen, sobald die Karten verteilt sind') : 'Keine Sterne') + '"><span class="lbl">Sterne</span>' + stars + '</div>') +
    (g.dir === -1 && g.phase === 'play' ? '<span class="pill mirror">' + SP.spiegel.ico.replace('<svg', '<svg style="width:14px;height:14px"') + ' Rückwärts: größte Zahl zuerst</span>' : '') +
    (g.nextReward && r.status === 'playing' ? '<span class="pill">Belohnung nach diesem Level: ' + (g.nextReward === 'life' ? 'Leben' : 'Stern') + '</span>' : '') + '</div></div>';
  const players = '<div class="gk-players">' + r.players.map(p => {
    const n = g.counts[p.id] || 0;
    const near = echoOn && echoOn.pids.includes(p.id) && g.phase === 'play';
    return '<div class="gk-p' + (p.id === me ? ' me' : '') + (near ? ' near' : '') + '" data-pid="' + esc(p.id) + '"><div class="nm">' + esc(p.name) + (p.id === me ? ' <span class="muted">(du)</span>' : '') + (p.bot ? '<span class="pill bot">Bot</span>' : '') + (p.online ? '' : '<span class="pill">offline</span>') + '</div>' +
      (near ? '<span class="nearlbl">nah dran</span>' : '') + ((g.cardCounts || {})[p.id] ? '<span class="spn">' + g.cardCounts[p.id] + ' Sonderkarte' + (g.cardCounts[p.id] > 1 ? 'n' : '') + '</span>' : '') +
      (g.phase === 'ready' ? '<div class="backs">' + (g.ready[p.id] ? '<span class="pill live">bereit</span>' : '<span class="pill">wartet</span>') + '</div>'
        : '<div class="backs" title="' + n + ' Karten">' + (n ? Array.from({ length: n }, () => '<div class="gk-back"></div>').join('') : '<span class="muted" style="font-size:13px">fertig</span>') + '</div>') + '</div>';
  }).join('') + '</div>';

  if (r.status === 'over') { el.innerHTML = top + renderOver(r, g); return; }

  if (g.phase === 'ready') {
    const lev = g.ev && g.ev.kind === 'level' ? g.ev : null;
    el.innerHTML = '<div style="display:flex;flex-direction:column;gap:16px">' + top +
      '<div class="panel gk-ready">' + (lev ? '<p class="reward">Level ' + lev.level + ' geschafft!' + (lev.reward === 'life' ? ' Ihr bekommt ein Leben dazu.' : lev.reward === 'star' ? ' Ihr bekommt einen Stern dazu.' : '') + '</p>' : '') +
      '<h2>Level ' + g.level + '</h2><p class="muted">Jeder bekommt ' + g.level + (g.level === 1 ? ' Karte' : ' Karten') + '. Konzentriert euch – und dann: kein Wort mehr.</p>' +
      (mine ? (g.ready[me] ? '<button class="btn big" disabled>Du bist bereit</button>' : '<button class="btn primary big" data-act="ready">Bereit</button>') : '') +
      '<div class="who">' + r.players.map(p => '<span class="pill ' + (g.ready[p.id] ? 'live' : '') + '">' + esc(p.name) + (g.ready[p.id] ? ' ✓' : '') + '</span>').join('') + '</div></div>' + players + '</div>';
    return;
  }
  const last = g.pile[g.pile.length - 1];
  const pauseLeft = Math.ceil((g.pausedUntil - Date.now() - local.off) / 1000);
  const pile = '<div class="panel gk-pile">' + (paused ? '<div class="pausebox"><div><b data-pause>' + pauseLeft + '</b><span>Pause – niemand legt</span></div></div>' : '') + '<div class="label">Stapel in der Mitte' + (g.dir === -1 ? ' · rückwärts' : '') + '</div>' +
    (last ? '<div class="stack" id="stack">' + g.pile.slice(-3).map((x, i, a) => '<div style="position:absolute;inset:0;transform:rotate(' + ((i - a.length + 1) * 4) + 'deg)">' + card(x.v, i === a.length - 1 ? ' toppile' : '') + '</div>').join('') + '</div>' : '<div class="empty" id="stack">Noch keine Karte.<br>Wer hat ' + (g.dir === -1 ? 'die größte' : 'die kleinste') + '?</div>') +
    '<div class="who">' + (last ? 'zuletzt: <b>' + esc(api.pname(last.pid)) + '</b> · ' + g.pileCount + ' gelegt' : '') + '</div></div>';
  const out = '<div class="panel gk-out"><div class="label">Abgeworfen</div>' + (g.out.length ? '<div class="list">' + g.out.map(x => '<div class="x">' + card(x.v) + '<span>' + esc(api.pname(x.pid)) + '</span></div>').join('') + '</div>' : '<p class="muted">Noch nichts. Fehler und Sterne decken hier Karten auf.</p>') + '</div>';
  const vote = g.vote ? '<div class="panel gk-vote"><div><b>' + esc(api.pname(g.vote.by)) + '</b> schlägt einen Stern vor: Jeder wirft seine kleinste Karte offen ab.<br><span class="muted">Einverstanden: ' + r.players.filter(p => g.vote.yes[p.id]).map(p => esc(p.name)).join(', ') + '</span></div>' +
    (mine && !g.vote.yes[me] ? '<div class="row"><button class="btn primary" data-act="yes">Ja, Stern einsetzen</button><button class="btn" data-act="no">Nein</button></div>' : '<span class="pill wait">Warte auf die anderen …</span>') + '</div>' : '';
  const hand = g.hand || [], ni = g.dir === -1 ? hand.length - 1 : 0, blocked = !!g.vote || paused;
  const anyCards = Object.values(g.counts).some(n => n > 0);
  const myCards = g.myCards || [];
  const spHand = myCards.map(k => { const off = blocked || !anyCards || (k === 'spiegel' && g.dir === -1) || (k === 'tausch' && !hand.length);
    return '<button type="button" class="spbtn" data-act="sp" data-k="' + k + '"' + (off ? ' disabled' : '') + ' title="' + esc(SP[k].name + ': ' + SP[k].text) + '" aria-label="Sonderkarte ' + SP[k].name + ' einsetzen">' + spCardBig(k) + '</button>'; }).join('');
  const myHand = mine ? '<div class="panel gk-hand"><div class="row" style="justify-content:space-between"><div class="label">Deine Karten</div>' +
    (g.stars > 0 && !g.vote ? '<button class="btn small" data-act="star">' + STAR.replace('<svg', '<svg style="color:#ffd166"') + ' Stern vorschlagen</button>' : '') + '</div>' +
    '<div class="cards">' + (hand.length ? hand.map((v, i) => '<button type="button" ' + (i === ni && !blocked ? 'class="lowest" data-act="play" aria-label="' + v + ' legen"' : 'disabled aria-label="' + v + '"') + '>' + card(v) + '</button>').join('') : (myCards.length ? '' : '<p class="muted">Du hast keine Karten mehr. Drück den anderen die Daumen!</p>')) + (myCards.length && hand.length ? '<span class="handgap" aria-hidden="true"></span>' : '') + spHand + '</div>' +
    (hand.length && !blocked ? '<div class="row"><button class="btn primary big" data-act="play">' + hand[ni] + ' jetzt legen</button><small class="muted">' + (g.dir === -1 ? 'Rückwärts: Du legst deine größte Karte.' : 'Du legst immer deine kleinste Karte.') + '</small></div>' : '') + (myCards.length ? '<small class="muted">Die farbigen Karten mit Symbol sind Sonderkarten – anklicken zum Einsetzen.</small>' : '') + '</div>' : '';
  const picker = local.pick && mine && myCards.includes('tausch') ? '<div class="modal side" role="dialog" aria-label="Tausch"><div class="panel modalbox" style="max-width:360px;border:2px solid #ffb86b"><h2 style="font-size:24px">Mit wem tauschen?</h2><p class="muted" style="margin:0">Du gibst deine nächste Karte ab und bekommst seine.</p><div class="pick">' +
    r.players.filter(p => p.id !== me && g.counts[p.id] > 0).map(p => '<button class="btn" data-act="swap" data-pid="' + esc(p.id) + '">' + esc(p.name) + '</button>').join('') + '</div><button class="btn small" data-act="swapCancel">Abbrechen</button></div></div>' : '';
  if (!(local.pick && mine && myCards.includes('tausch'))) local.pick = false;
  el.innerHTML = '<div style="display:flex;flex-direction:column;gap:16px">' + top + vote + '<div class="gk-mid">' + pile + out + '</div>' + myHand + players + '</div>' + picker;
  if (g.ev && g.ev.seq !== local.renderedSeq && (g.ev.kind === 'play' || g.ev.kind === 'mistake')) {
    local.renderedSeq = g.ev.seq;
    const t = el.querySelector('.toppile'); if (t) t.classList.add('pop');
    if (g.ev.kind === 'mistake') { const s = el.querySelector('#stack'); if (s) s.classList.add('shake'); }
    const pc = el.querySelector('.gk-p[data-pid="' + g.ev.pid + '"]'); if (pc) pc.classList.add('flash');
  }
}
function renderOver(r, g) {
  const won = g.phase === 'won', dur = Math.round(((g.ended || Date.now()) - g.started) / 1000);
  const rows = r.players.map(p => '<tr><td>' + esc(p.name) + '</td><td>' + (g.stats.played[p.id] || 0) + '</td><td>' + (g.stats.mistakes[p.id] || 0) + '</td><td>' + ((g.reveal && g.reveal[p.id]) || []).join(', ') + '</td></tr>').join('');
  return '<div class="panel gk-over"><h2>' + (won ? 'Geschafft!' : 'Verloren') + '</h2>' +
    '<p class="muted" style="font-size:17px">' + (won ? 'Ihr habt alle ' + g.maxLevel + ' Level im Gleichklang gemeistert.' : 'Ihr seid bis Level ' + g.level + ' von ' + g.maxLevel + ' gekommen.') + ' Dauer: ' + Math.floor(dur / 60) + ' Min. ' + (dur % 60) + ' Sek. · Sterne eingesetzt: ' + g.stats.starsUsed + ' · Leben verloren: ' + g.stats.livesLost + '</p>' +
    '<table><thead><tr><th>Spieler</th><th>gelegt</th><th>zu lange gehalten</th><th>übrige Karten</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    api.overButtons(r) + '</div>';
}
function onState(prev, r) {
  const g = r.g;
  if (!g) return;
  if (local.evKey !== g.started) { local.evKey = g.started; local.lastSeq = (!prev || !prev.g) && g.ev ? g.ev.seq : 0; if (!prev || !prev.g) return; }
  if (!g.ev || g.ev.seq === local.lastSeq) return;
  local.lastSeq = g.ev.seq;
  const e = g.ev, S = api.Snd;
  if (e.kind === 'play') S.play('play', .8 + Math.min(.4, e.v / 250));
  if (e.kind === 'mistake' && e.shield) {
    S.play('shield');
    api.toast('Das Schutzschild fängt den Fehler ab! ' + e.lower.map(x => x.v + ' (' + api.pname(x.pid) + ')').join(', ') + ' wurde abgeworfen – kein Leben weg.', 5000);
  } else if (e.kind === 'mistake') {
    S.play('bad'); document.body.insertAdjacentHTML('beforeend', '<div class="redflash"></div>'); setTimeout(() => { const f = document.querySelector('.redflash'); if (f) f.remove(); }, 900);
    api.toast(e.lower.length === 1 ? 'Oh nein! ' + api.pname(e.lower[0].pid) + ' hatte noch die ' + e.lower[0].v + '. Ein Leben weg.' : 'Oh nein! Da lagen noch kleinere Karten: ' + e.lower.map(x => x.v + ' (' + api.pname(x.pid) + ')').join(', ') + '. Ein Leben weg.', 5000);
  }
  if (e.kind === 'level') S.play('lvl');
  if (e.kind === 'deal' && e.gifts && e.gifts.length) {
    const mineG = e.gifts.filter(x => x.pid === r.me).map(x => SP[x.kind].name), sh = e.gifts.some(x => x.kind === 'schild');
    const msg = [mineG.length ? 'Du bekommst: ' + mineG.join(', ') : '', sh ? 'Euer Team bekommt ein Schutzschild' : ''].filter(Boolean).join(' · ');
    if (msg) { api.toast(msg + '.', 4500); S.play('starfx', .6); }
  }
  if (e.kind === 'sp_echo') { S.play('echo'); api.toast(api.pname(e.pid) + ' ruft ein Echo: ' + (e.near.length ? e.near.map(id => id === r.me ? 'du' : api.pname(id)).join(', ') + (e.near.length > 1 ? ' sind' : (e.near[0] === r.me ? ' bist' : ' ist')) + ' nah dran.' : 'Niemand ist nah dran.'), 5000); }
  if (e.kind === 'sp_spiegel') { S.play('mirror'); api.toast(api.pname(e.pid) + ' spielt den Spiegel: Ab jetzt wird rückwärts gelegt – die größte Zahl zuerst!', 5000); }
  if (e.kind === 'sp_pause') { S.play('pausefx'); api.toast(api.pname(e.pid) + ' macht Pause: 10 Sekunden durchatmen.'); }
  if (e.kind === 'pauseEnd') { S.play('click'); api.toast('Weiter geht\'s!'); }
  if (e.kind === 'sp_tausch') { S.play('swapfx'); api.toast(e.target === r.me ? api.pname(e.pid) + ' tauscht seine nächste Karte mit deiner.' : (e.pid === r.me ? 'Du tauschst' : api.pname(e.pid) + ' tauscht') + ' die nächste Karte mit ' + api.pname(e.target) + '.', 5000); }
  if (e.kind === 'star') { S.play('starfx'); api.toast('Stern eingesetzt: ' + e.shown.map(x => x.v + ' (' + api.pname(x.pid) + ')').join(', ')); }
  if (e.kind === 'vote' && e.pid !== r.me) { S.play('chat'); }
  if (e.kind === 'voteNo') api.toast(api.pname(e.pid) + ' möchte keinen Stern einsetzen.');
  if (r.status === 'over' && prev && prev.status !== 'over') S.play(g.phase === 'won' ? 'win' : 'lose');
}
// Pausen-Countdown und Echo-Leuchten aktuell halten
setInterval(() => {
  const r = api.room; if (!r || !r.g || r.status !== 'playing') return;
  const g = r.g, now = Date.now() + (local.off || 0);
  const b = document.querySelector('[data-pause]');
  if (b) { const left = Math.ceil((g.pausedUntil - now) / 1000); if (left > 0) b.textContent = left; }
  const state = (g.pausedUntil > now ? 'p' : '') + (g.echo && g.echo.until > now ? 'e' : '');
  if (state !== local.tick) { const first = local.tick === 0; local.tick = state; if (!first) api.render(); }
}, 250);
})();
</script>
</body></html>
