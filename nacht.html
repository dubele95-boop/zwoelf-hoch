<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Durch die Nacht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="/common.css">
<style>
:root{--accent:#b9a2ff;--accent-ink:#1a1033;--kraft:#e5533d;--mut:#4c7cf0;--wissen:#3fae6b;--geschick:#e9b532}
body{background:#141224;background-image:radial-gradient(ellipse 90% 60% at 50% 20%,#272247,#141224 70%)}
.nt-top{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px 22px;align-items:center}
.clock{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.clock b{font:900 46px/1 var(--f-display);font-variant-numeric:tabular-nums}
.clock span{color:var(--muted);font-size:13px;font-weight:700}
.sky{height:10px;border-radius:99px;background:linear-gradient(90deg,#1c1a3a,#3b2f6e 55%,#d97a4a 85%,#ffd27a);position:relative;margin-top:8px}
.sky i{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#f5e6b8;box-shadow:0 0 12px #f5e6b8;transform:translate(-50%,-50%)}
.track{display:flex;align-items:center;gap:0;min-width:0}
.track .f{flex:1;display:flex;align-items:center;min-width:0}
.track .f::before{content:"";flex:1;height:4px;background:rgba(255,255,255,.12)}
.track .f:first-child{flex:0 0 auto}.track .f:first-child::before{display:none}
.track .f.done::before{background:linear-gradient(90deg,#b9a2ff,#ffd27a)}
.track .dot{width:16px;height:16px;border-radius:50%;background:#2b2650;border:2px solid rgba(255,255,255,.2);flex:none;display:grid;place-items:center;position:relative}
.track .f.done .dot{background:#6b5bb5;border-color:#b9a2ff}
.track .dot.here{width:34px;height:34px;background:#ffb347;border-color:#fff3d6;box-shadow:0 0 18px #ffb347}
.track .dot.here svg{width:20px;height:20px;color:#3a1d00}
.track .dot.end{width:34px;height:34px;border-radius:8px;background:#3a3466}
.track .dot.end svg{width:22px;height:22px;color:#ffd27a}
.hp{display:flex;align-items:center;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.hp svg{width:22px;height:22px;color:#ff6b7a}.hp .e svg{color:rgba(255,255,255,.14)}
.lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.nt-main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:16px;align-items:start}
.event{border-radius:16px;padding:20px;background:linear-gradient(160deg,#2c2650,#1d1a36);border:1px solid rgba(185,162,255,.35);display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.event.flip{animation:flip .5s ease}
@keyframes flip{from{transform:rotateY(70deg);opacity:.2}to{transform:none;opacity:1}}
.event h2{font:900 clamp(30px,4vw,44px)/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.event .story{color:#d9d3f0;font-style:italic;font-size:16px}
.needs{display:flex;flex-direction:column;gap:10px}
.need{display:grid;grid-template-columns:110px minmax(0,1fr) 64px;gap:10px;align-items:center}
.need .nm{display:flex;align-items:center;gap:6px;font-weight:700}
.need .nm svg{width:20px;height:20px;flex:none}
.need .bar{height:14px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.need .bar i{display:block;height:100%;border-radius:99px;background:var(--c);transition:width .3s ease}
.need .val{font:800 20px/1 var(--f-display);text-align:right;font-variant-numeric:tabular-nums}
.need.ok .val{color:#7dffb0}
.conseq{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.conseq div{border-radius:10px;padding:8px 10px;font-size:14px;background:rgba(0,0,0,.2)}
.conseq .w{border:1px solid rgba(125,255,176,.35)}.conseq .l{border:1px solid rgba(255,107,122,.35)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px}
.verdict{font-weight:700;padding:8px 12px;border-radius:10px;text-align:center}
.verdict.ok{background:rgba(87,194,154,.15);color:#7dffb0;border:1px solid rgba(87,194,154,.4)}
.verdict.no{background:rgba(255,107,122,.1);color:#ffb3bc;border:1px solid rgba(255,107,122,.35)}
.ccard{--c:#888;width:62px;aspect-ratio:5/7;border-radius:9px;background:linear-gradient(170deg,color-mix(in srgb,var(--c) 85%,#fff),var(--c));color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 6px 14px rgba(0,0,0,.35);border:2px solid rgba(255,255,255,.25);flex:none;position:relative}
.ccard b{font:900 28px/1 var(--f-display);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.ccard svg{width:22px;height:22px}
.ccard .bonus{position:absolute;top:-6px;right:-6px;background:#fff;color:#1a1033;border-radius:99px;font:800 11px/1 var(--f-body);padding:3px 5px}
.c-kraft{--c:var(--kraft)}.c-mut{--c:var(--mut)}.c-wissen{--c:var(--wissen)}.c-geschick{--c:var(--geschick)}
.cards{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.cards button{padding:0;border:0;background:none;border-radius:9px}
.cards button .ccard{transition:transform .15s ease}
.cards button:not(:disabled):hover .ccard{transform:translateY(-6px)}
.cards button:disabled{cursor:default}
.contrib .who{font-size:11px;color:var(--muted);text-align:center;margin-top:3px;max-width:62px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.items{display:flex;flex-wrap:wrap;gap:8px}
.item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;border:1px solid var(--line-2);background:rgba(0,0,0,.2);text-align:left}
.item svg{width:22px;height:22px;color:#ffd27a;flex:none}
.item small{display:block;color:var(--muted);font-size:12px}
.item.used{border-color:#ffd27a;background:rgba(255,210,122,.12)}
.party{display:flex;flex-direction:column;gap:6px}
.party .p{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(0,0,0,.2)}
.party .p small{color:var(--muted)}
.char{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.18)}
.char .ic{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#3a3466;flex:none}
.char .ic svg{width:20px;height:20px}
.char.mine{border-color:var(--accent)}
.char.taken{opacity:.55}
.result{display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.result h2{font:900 40px/1 var(--f-display);text-transform:uppercase}
.result.ok h2{color:#7dffb0}.result.no h2{color:#ff8f9c}
.fx{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.over{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding:24px 16px}
.over h2{font:900 clamp(44px,7vw,84px)/.9 var(--f-display);text-transform:uppercase}
.journey{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;max-width:760px}
.healmode .cards button .ccard{outline:2px dashed #ff8f9c;outline-offset:2px}
.scard{width:62px;aspect-ratio:5/7;border-radius:9px;background:linear-gradient(170deg,#3a2f6e,#1e1840);border:2px solid #b9a2ff;color:#f5e6b8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 6px 14px rgba(0,0,0,.35);flex:none;padding:4px;text-align:center}
.scard svg{width:24px;height:24px}
.scard span{font:700 9px/1.1 var(--f-body);hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere;max-width:100%}
.ccard .moon{position:absolute;top:-6px;left:-6px;width:18px;height:18px;border-radius:50%;background:#1e1840;border:1px solid #b9a2ff;display:grid;place-items:center}
.ccard .moon svg{width:11px;height:11px;color:#f5e6b8}
.sprow{display:flex;flex-direction:column;gap:6px}
.spx{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid rgba(185,162,255,.35);background:rgba(185,162,255,.07)}
.spx .ic{width:34px;height:34px;border-radius:8px;background:#2c2456;display:grid;place-items:center;color:#f5e6b8;flex:none}
.spx .ic svg{width:20px;height:20px}
.spx > div{flex:1;min-width:0}
.spx small{display:block;color:var(--muted);font-size:12.5px;line-height:1.3}
.hourtags{display:flex;flex-wrap:wrap;gap:6px}
.hourtags .pill{color:#f5e6b8;border-color:rgba(185,162,255,.6)}
.picklist{display:flex;flex-direction:column;gap:8px;width:100%}
.picklist button{text-align:left;border:1px solid rgba(185,162,255,.4);background:rgba(0,0,0,.2);border-radius:10px;padding:10px 12px}
.picklist button:hover{border-color:#b9a2ff;background:rgba(185,162,255,.12)}
.picklist small{display:block;color:var(--muted)}
.minis{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.minis .ccard,.minis .scard{width:30px;border-width:1px;border-radius:5px}
.minis .ccard b{font-size:14px}.minis .ccard svg,.minis .scard svg{width:12px;height:12px}.minis .scard span{display:none}
.colorpick{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:100%}
.colorpick button{display:flex;align-items:center;gap:8px;justify-content:center;padding:12px;border-radius:10px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 22%,transparent);font-weight:800;color:#fff}
.colorpick svg{width:20px;height:20px}
.preview{border:1px dashed rgba(185,162,255,.45);border-radius:12px;padding:10px 12px;font-size:14px}
@media (max-width:900px){.nt-main{grid-template-columns:minmax(0,1fr)}.nt-top{grid-template-columns:minmax(0,1fr)}.hp{justify-content:flex-start}}
</style></head><body>
<div id="app"></div>
<script src="/common.js"></script>
<script>
(function(){
const esc = Spieleabend.esc;
const IC = {
  kraft: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="14" height="7" rx="1.5"/><rect x="8.5" y="10" width="3.5" height="11" rx="1.2"/></svg>',
  mut: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/></svg>',
  wissen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3 5c3-1 6-1 9 1 3-2 6-2 9-1v14c-3-1-6-1-9 1-3-2-6-2-9-1z"/><path d="M12 6v14"/></svg>',
  geschick: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 3C10 4 5 10 5 18l-2 3 1 1 3-2c8 0 13-6 13-17z"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4 6.8 4c2.2 0 3.6 1.2 5.2 3 1.6-1.8 3-3 5.2-3C21 4 23.1 8 21.6 11.6 19.5 16.4 12 21 12 21z"/></svg>',
  lantern: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 2h6v2H9zM7 5h10l-1 3H8zM8 9h8v9a3 3 0 0 1-3 3h-2a3 3 0 0 1-3-3z"/></svg>',
  house: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z"/></svg>',
  fackel: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c3 3 4 5 2 8h-4c-2-3-1-5 2-8z"/><path d="M10 11h4l-1 11h-2z"/></svg>',
  seil: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="4"/><path d="M20 12c0 6-4 9-8 10"/></svg>',
  trank: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M10 2h4v2h-1v4.5l5 7.5a4 4 0 0 1-3.3 6H9.3A4 4 0 0 1 6 16l5-7.5V4h-1z"/></svg>',
  kompass: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="currentColor"/></svg>',
  heiler: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg>',
  spaeherin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>'
};
const SPI = {
  lagerfeuer: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c3 4 5 6 5 10a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-9z"/><path d="M3 20l18-2v2L3 22zM21 20L3 18v2l18 2z" opacity=".7"/></svg>',
  mond: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15 3a9 9 0 1 0 6 15A8 8 0 0 1 15 3z"/></svg>',
  freund: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="8" cy="7" r="3"/><circle cx="16" cy="7" r="3"/><path d="M2 20c0-4 3-7 6-7s6 3 6 7zM12 20c0-3 2-6 4-7 3 0 6 3 6 7z" opacity=".85"/></svg>',
  stern: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15 4l1.6 3.7 4 .4-3 2.7.9 3.9-3.5-2-3.5 2 .9-3.9-3-2.7 4-.4z"/><path d="M3 21l8-8" stroke="currentColor" stroke-width="2" stroke-linecap="round" opacity=".7"/></svg>',
  abkuerzung: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10a4 4 0 0 1 4-4h10M14 2l4 4-4 4"/></svg>',
  glueck: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="8" cy="8" r="4"/><circle cx="16" cy="8" r="4"/><circle cx="8" cy="16" r="4"/><circle cx="16" cy="16" r="4"/><path d="M12 12l6 10" stroke="currentColor" stroke-width="2"/></svg>',
  eule: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M5 4l3 3h8l3-3v9a7 7 0 0 1-14 0z"/><circle cx="9" cy="11" r="2.2" fill="#1e1840"/><circle cx="15" cy="11" r="2.2" fill="#1e1840"/><path d="M12 13l-1.2 2h2.4z" fill="#1e1840"/></svg>'
};
const CHAR_IC = { jaegerin: 'kraft', ritter: 'mut', gelehrte: 'wissen', akrobat: 'geschick', heiler: 'heiler', spaeherin: 'spaeherin' };
const CN = { kraft: 'Kraft', mut: 'Mut', wissen: 'Wissen', geschick: 'Geschick' };
const L = { lastSeq: 0, heal: false, eventKey: null };
const cardHTML = (c, bonus) => c.sp && !c.c ? '<div class="scard" title="' + esc(((api && api.room && api.room.catalog.SPECIALS[c.sp]) || {}).name || '') + '">' + SPI[c.sp] + '<span>' + esc(((api && api.room && api.room.catalog.SPECIALS[c.sp]) || {}).name || '') + '</span></div>' : '<div class="ccard c-' + c.c + '" title="' + CN[c.c] + ' ' + c.v + '">' + (c.sp ? '<span class="moon">' + SPI.mond + '</span>' : '') + IC[c.c] + '<b>' + c.v + '</b>' + (bonus ? '<span class="bonus">+1</span>' : '') + '</div>';
function effText(e) {
  if (!e) return 'nichts passiert';
  const out = [];
  if (e.move > 0) out.push(e.move + ' Feld weiter extra'); if (e.move < 0) out.push(-e.move + ' Feld zurück');
  if (e.stop) out.push('ihr kommt diese Stunde nicht voran');
  if (e.hp > 0) out.push('+' + e.hp + ' Ausdauer'); if (e.hp < 0) out.push(e.hp + ' Ausdauer');
  if (e.item) out.push('ihr findet einen Gegenstand'); if (e.loseItem) out.push('ihr verliert einen Gegenstand');
  if (e.discard) out.push('jeder verliert ' + e.discard + ' Handkarte'); if (e.draw) out.push('jeder zieht ' + e.draw + ' Karte mehr');
  return out.length ? out.join(', ') : 'nichts passiert';
}
const clock = round => ((19 + round) % 24) + ':00';

const AI = {
  bolt: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>',
  jump: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 18c4-10 10-10 14-4"/><path d="M14 9l4 5-6 1"/></svg>',
  calm: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9.5h.01M15 9.5h.01"/></svg>',
  fire: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2c3 4 6 6 6 11a6 6 0 0 1-12 0c0-3 2-5 3-6 0 3 1 4 2 4 0-4-1-6 1-9z"/></svg>',
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  team: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2 20c0-4 3-7 6-7s6 3 6 7zM12 20c0-3 2-6 4-7 3 0 6 3 6 7z"/></svg>',
  chat: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-5 4V5a1 1 0 0 1 1-1z"/></svg>',
  trophy: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 3h10v3h3v2a4 4 0 0 1-4 4 5 5 0 0 1-3 3v3h3v3H8v-3h3v-3a5 5 0 0 1-3-3 4 4 0 0 1-4-4V6h3zm0 5V6H5v2a2 2 0 0 0 2 2zm10 0a2 2 0 0 0 2-2V6h-2z"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l10 18H2zm-1 7v5h2V9zm0 7v2h2v-2z"/></svg>',
  pack: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 4a4 4 0 0 1 8 0h3a1 1 0 0 1 1 1v15a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a1 1 0 0 1 1-1zm2 0h4a2 2 0 0 0-4 0zm-2 8v3h8v-3z"/></svg>',
  heart: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4 6.8 4c2.2 0 3.6 1.2 5.2 3 1.6-1.8 3-3 5.2-3C21 4 23.1 8 21.6 11.6 19.5 16.4 12 21 12 21z"/></svg>',
  gift: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9h18v4H3zM5 13h14v8H5zM11 9h2v12h-2zM12 9C9 9 7 7 8 5s4 0 4 4zm0 0c3 0 5-2 4-4s-4 0-4 4z"/></svg>',
  magic: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15 4l1.6 3.7 4 .4-3 2.7.9 3.9-3.5-2-3.5 2 .9-3.9-3-2.7 4-.4z"/><path d="M3 21l8-8" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>'
};

function ntStats(r, api) {
  const g = r.g, won = g.phase === 'won', ps = g.ps || {}, tm = g.team || {}, C = r.catalog.CHARS, P = r.players;
  const kpi = (v, t) => '<div class="kpi"><b>' + v + '</b><span>' + t + '</span></div>';
  const list = f => P.map(p => ({ name: p.name, n: f(ps[p.id] || {}) || 0 }));
  const aw = [];
  { const b = api.best(list(x => x.points), 1); if (b) aw.push(api.award(AI.pack, 'Packesel', api.names(b.names) + (b.names.length > 1 ? ' brachten je ' : ' brachte ') + b.n + ' Punkte für die Gruppe ein.')); }
  { const b = api.best(list(x => x.cards), 1); if (b) aw.push(api.award(AI.team, 'Fleißig', api.names(b.names) + (b.names.length > 1 ? ' legten je ' : ' legte ') + b.n + ' Karten.')); }
  for (const c of ['kraft', 'mut', 'wissen', 'geschick']) { const b = api.best(list(x => (x.colors || {})[c]), 6); if (b) aw.push(api.award(IC[c], 'Meister in ' + CN[c], api.names(b.names) + ': ' + b.n + ' Punkte ' + CN[c] + '.')); }

    action = '<div class="row">' + (g.ready[me] ? '<button class="btn big" data-act="ready">Doch noch nicht fertig</button>' : '<button class="btn primary big" data-act="ready">Fertig – auflösen</button>') + extra +
      '<small class="muted">' + r.players.filter(p => g.ready[p.id]).length + ' von ' + r.players.length + ' fertig</small></div>';
  }
  const res = g.phase === 'result' && g.result ? (() => { const x = g.result; const fx = [];
      if (x.rest) return '<div class="panel result ok"><h2>Rast am Lagerfeuer</h2><div class="fx"><span class="pill">' + (x.hp ? '+' + x.hp + ' Ausdauer' : 'Ausdauer schon voll') + '</span><span class="pill">jeder zieht 2 Karten</span><span class="pill">kein Fortschritt</span></div>' + (mine ? '<button class="btn primary big" data-act="next">Weiter zur nächsten Stunde</button>' : '') + '</div>';
      if (x.skipped) fx.push('übersprungen');
      if (x.lucky) fx.push('Glücksbringer: nichts Schlimmes passiert');
      if (x.shortcut) fx.push('Abkürzung: 1 Feld extra');
      fx.push(x.move > 0 ? '+' + x.move + ' Feld' + (x.move > 1 ? 'er' : '') : x.move < 0 ? x.move + ' Feld' : 'kein Fortschritt');
      if (x.hp) fx.push((x.hp > 0 ? '+' : '') + x.hp + ' Ausdauer'); if (x.item) fx.push('gefunden: ' + I[x.item].name); if (x.lost) fx.push('verloren: ' + I[x.lost].name); if (x.discard) fx.push('jeder verliert ' + x.discard + ' Karte');
      return '<div class="panel result ' + (x.ok ? 'ok' : 'no') + '"><h2>' + (x.ok ? 'Geschafft!' : 'Nicht geschafft') + '</h2><div class="fx">' + fx.map(f => '<span class="pill">' + f + '</span>').join('') + '</div>' + (mine ? '<button class="btn primary big" data-act="next">Weiter zur nächsten Stunde</button>' : '') + '</div>'; })() : '';
  const myCharBox = myChar ? '<div class="char mine"><span class="ic">' + IC[CHAR_IC[myChar]] + '</span><div><b>Du bist ' + C[myChar].name + '</b><div class="muted" style="font-size:13px">' + C[myChar].text + '</div></div></div>' : '';
  const hand = mine ? '<div class="panel' + (L.heal ? ' healmode' : '') + '" style="display:flex;flex-direction:column;gap:10px"><div class="row" style="justify-content:space-between"><div class="lbl">Deine Karten</div>' + (L.heal ? '<span class="pill bad">Welche Karte abwerfen?</span>' : '') + '</div><div class="cards">' +
    (g.hand.length ? g.hand.map(c => c.sp
      ? '<button type="button" ' + (L.heal ? 'data-act="give"' : 'data-act="spc" data-sp="' + c.sp + '"') + ' data-id="' + esc(c.id) + '"' + (g.phase === 'plan' && !g.pick && !(g.hour && g.hour[c.sp]) ? '' : ' disabled') + ' title="' + esc(r.catalog.SPECIALS[c.sp].name + ': ' + r.catalog.SPECIALS[c.sp].text) + '">' + cardHTML(c) + '</button>'
      : '<button type="button" data-act="give" data-id="' + esc(c.id) + '"' + (g.phase === 'plan' && !g.pick ? '' : ' disabled') + ' title="' + CN[c.c] + ' ' + c.v + (L.heal ? ' abwerfen' : ' legen') + '">' + cardHTML(c, C[myChar] && C[myChar].color === c.c) + '</button>').join('') : '<p class="muted">Keine Karten mehr.</p>') + '</div>' +
    (g.hand.some(c => c.sp) ? '<small class="muted">Dunkle Karten sind Sonderkarten – anklicken zum Einsetzen.</small>' : '') + myCharBox + '</div>' : '';
  // Dialoge für Sonderkarten
  let dlg = '';
  const SPC = r.catalog.SPECIALS;
  if (L.ui && mine && g.phase === 'plan' && g.hand.some(c => c.id === L.ui.id)) {
    const u = L.ui, box = (title, body) => '<div class="modal side" role="dialog" aria-label="' + title + '"><div class="panel modalbox" style="max-width:380px;border:2px solid #b9a2ff"><h2 style="font-size:24px">' + title + '</h2>' + body + '<button class="btn small" data-act="uiClose">Abbrechen</button></div></div>';
    if (u.sp === 'mond') dlg = box('Mondlicht', '<p class="muted" style="margin:0">Welche Farbe soll das Mondlicht haben? Es zählt 3 Punkte.</p><div class="colorpick">' + ['kraft', 'mut', 'wissen', 'geschick'].map(c => '<button type="button" data-act="moon" data-c="' + c + '" style="--c:var(--' + c + ')">' + IC[c] + CN[c] + '</button>').join('') + '</div>');
    if (u.sp === 'lagerfeuer') dlg = box('Lagerfeuer', '<p class="muted" style="margin:0">' + SPC.lagerfeuer.text + '</p><button class="btn primary" data-act="rest">Ja, rasten</button>');
    if (u.sp === 'freund') {
      const giveable = g.hand.filter(c => c.id !== u.id);
      dlg = box('Hilfe vom Freund', !u.give ? '<p class="muted" style="margin:0">Welche Karte gibst du ab?</p><div class="cards" style="justify-content:center">' + (giveable.length ? giveable.map(c => '<button type="button" data-act="fgive" data-id="' + esc(c.id) + '">' + cardHTML(c) + '</button>').join('') : '<p class="muted">Du hast keine andere Karte.</p>') + '</div>'
        : '<p class="muted" style="margin:0">An wen?</p><div class="row" style="justify-content:center">' + r.players.filter(p => p.id !== me).map(p => '<button class="btn" data-act="fto" data-pid="' + esc(p.id) + '">' + esc(p.name) + '</button>').join('') + '</div>');
    }
  } else L.ui = null;
  if (g.pickOpts && mine) dlg = '<div class="modal side" role="dialog" aria-label="Sternschnuppe"><div class="panel modalbox" style="max-width:420px;border:2px solid #b9a2ff"><h2 style="font-size:24px">Sternschnuppe</h2><p class="muted" style="margin:0">Welches Ereignis kommt als Nächstes?</p><div class="picklist">' +
    g.pickOpts.map(e => '<button type="button" data-act="pickEv" data-id="' + e.id + '"><b>' + esc(e.name) + '</b><small>' + (e.need ? 'Braucht ' + Object.entries(e.need).map(([c, v]) => CN[c] + ' ' + v).join(e.any ? ' oder ' : ' + ') + ' (Grundwert)' : 'kein Hindernis') + ' · Geschafft: ' + effText(e.win) + (e.need ? ' · Sonst: ' + effText(e.fail) : '') + '</small></button>').join('') + '</div></div></div>';
  const pickNote = g.pick && !g.pickOpts ? '<div class="preview"><b>' + esc(api.pname(g.pick.pid)) + '</b> sucht mit der Sternschnuppe das nächste Ereignis aus …</div>' : '';
  const preview = g.next ? '<div class="preview"><b>Späherin sieht voraus:</b> Als Nächstes kommt „' + esc(g.next.name) + '“.</div>' : '';
  el.innerHTML = '<div style="display:flex;flex-direction:column;gap:16px">' + top(g, r) + res +
    '<div class="nt-main"><div style="display:flex;flex-direction:column;gap:16px;min-width:0">' + eventHTML(r, g) + action + contrib + hand + '</div>' +
    '<div style="display:flex;flex-direction:column;gap:16px;min-width:0">' + pickNote + party + items + preview + '</div></div></div>' + dlg;
  if (flip) { const e = el.querySelector('#eventcard'); if (e) e.classList.add('flip'); }
}
function onState(prev, r) {
  const g = r.g;
  if (!g) return;
  if (L.evKey !== g.started) { L.evKey = g.started; L.lastSeq = (!prev || !prev.g) && g.ev ? g.ev.seq : 0; if (!prev || !prev.g) return; }
  if (!g.ev || g.ev.seq === L.lastSeq) return;
  L.lastSeq = g.ev.seq;
  const e = g.ev, S = api.Snd;
  if (e.kind === 'event') S.play('flip');
  if (e.kind === 'result') S.play(e.ok ? 'good' : 'bad');
  if (e.kind === 'item') { S.play('ok'); api.toast(api.pname(e.pid) + ' setzt ' + r.catalog.ITEMS[e.it].name + ' ein.'); }
  if (e.kind === 'heal') { S.play('ok'); api.toast(api.pname(e.pid) + ' heilt die Gruppe: +1 Ausdauer.'); }
  if (e.kind === 'skip') { S.play('owl'); api.toast(api.pname(e.pid) + ' findet einen Umweg um „' + r.catalog.EVENTS[e.from].name + '“.'); }
  if (e.kind === 'sp') {
    const SPC = r.catalog.SPECIALS, who = e.pid === r.me ? 'Du' : api.pname(e.pid), nm = SPC[e.sp].name;
    S.play(e.sp === 'eule' ? 'owl' : 'magic');
    const txt = {
      mond: who + ' legt Mondlicht als ' + CN[e.color] + ' 3.',
      freund: e.target === r.me ? api.pname(e.pid) + ' schenkt dir eine Karte: ' + CN[e.card.c] + ' ' + e.card.v + '.' : who + ' schenkt ' + api.pname(e.target) + ' eine Karte.',
      lagerfeuer: who + ' entzündet ein Lagerfeuer – ihr rastet.',
      stern: who + ' sieht eine Sternschnuppe und sucht das nächste Ereignis aus.',
      abkuerzung: who + ' kennt eine Abkürzung: Schafft ihr es, geht ihr ein Feld extra.',
      glueck: who + ' hält den Glücksbringer bereit: Scheitern tut diese Stunde nicht weh.',
      eule: who + ' ruft die Eule: Alle sehen diese Stunde alle Karten.'
    }[e.sp] || who + ' setzt ' + nm + ' ein.';
    api.toast(txt, 4500);
  }
  if (e.kind === 'picked') { S.play('ok'); api.toast('Als Nächstes kommt: „' + r.catalog.EVENTS[e.id].name + '“.'); }
  if (r.status === 'over' && prev && prev.status !== 'over') S.play(g.phase === 'won' ? 'win' : 'lose');
}
})();
</script>
