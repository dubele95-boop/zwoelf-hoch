<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reihe voll!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="/common.css">
<style>
:root{--accent:#ff9f4a;--accent-ink:#2a1405;--p1:#f6efe1;--p2:#cfe6ff;--p3:#ffe08a;--p5:#ffb27a;--p7:#ff8fae}
.rc{--w:64px;width:var(--w);aspect-ratio:5/7;border-radius:calc(var(--w) * .13);background:var(--pc,var(--p1));color:#2a2230;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:calc(var(--w) * .07) 2px;box-shadow:0 2px 0 rgba(0,0,0,.25),0 8px 16px rgba(0,0,0,.28);border:2px solid rgba(0,0,0,.12);flex:none;position:relative}
.rc b{font:900 calc(var(--w) * .46)/1 var(--f-display)}
.rc .horns{display:flex;flex-wrap:wrap;justify-content:center;gap:1px;max-width:92%;min-height:calc(var(--w) * .16)}
.rc .horns svg{width:calc(var(--w) * .15);height:calc(var(--w) * .15);color:#7a2f3c}
.rc.pen2{--pc:var(--p2)}.rc.pen3{--pc:var(--p3)}.rc.pen5{--pc:var(--p5)}.rc.pen7{--pc:var(--p7)}
.rc.pen7 .horns svg{color:#4a0a1f}
.rc.pop{animation:pop .4s cubic-bezier(.2,.9,.3,1.3)}
.rc.own{border:3px solid var(--oc);box-shadow:0 0 0 1px rgba(0,0,0,.35),0 8px 16px rgba(0,0,0,.28)}
.rc .ownr{position:absolute;left:50%;bottom:calc(var(--w) * -.16);transform:translateX(-50%);max-width:calc(var(--w) + 10px);background:var(--oc);color:#17121f;font:800 10.5px/1 var(--f-body);padding:3px 6px;border-radius:99px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;box-shadow:0 2px 6px rgba(0,0,0,.4);z-index:1}
.rc.own.pop{box-shadow:0 0 0 4px color-mix(in srgb,var(--oc) 55%,transparent),0 0 22px var(--oc)}
.rrow{padding-bottom:16px !important}
.pdot{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--oc);margin-right:6px;vertical-align:middle;box-shadow:0 0 0 2px rgba(0,0,0,.3)}
.reveal .it .who{color:#17121f !important;background:var(--oc);padding:2px 7px;border-radius:99px}
@keyframes pop{from{transform:translateY(-24px) scale(1.2);opacity:0}to{transform:none;opacity:1}}
.rv-top{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
.rv-top .t{display:flex;align-items:baseline;gap:10px}
.rv-top .t b{font:900 44px/1 var(--f-display)}
.rv-top .t span{color:var(--muted);font-weight:700}
.timer{font:800 26px/1 var(--f-display);font-variant-numeric:tabular-nums;padding:6px 12px;border-radius:10px;border:1px solid var(--line-2);background:rgba(0,0,0,.25)}
.timer.low{color:#ff8f7a;border-color:rgba(255,110,90,.6)}
.rows{display:flex;flex-direction:column;gap:10px}
.rrow{display:grid;grid-template-columns:86px repeat(6,var(--w)) minmax(0,1fr);gap:8px;align-items:center;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.18);border:2px solid transparent;--w:64px}
.rrow .lbl{display:flex;flex-direction:column;gap:2px}
.rrow .lbl b{font:800 18px/1 var(--f-display);text-transform:uppercase;letter-spacing:.04em}
.rrow .lbl small{color:var(--muted);font-weight:700}
.rrow .lbl small.hot{color:#ff9d8a}
.slot{width:var(--w);aspect-ratio:5/7;border-radius:calc(var(--w) * .13);border:1.5px dashed var(--line-2)}
.slot.six{border-color:rgba(255,110,90,.55);display:grid;place-items:center;color:rgba(255,140,120,.8);font:800 12px/1.1 var(--f-body);text-align:center}
.rrow.pick{cursor:pointer;border-color:var(--accent);background:rgba(255,159,74,.08)}
.rrow.pick:hover{background:rgba(255,159,74,.18)}
.rrow.taken{animation:taken .9s ease}
@keyframes taken{30%{background:rgba(255,90,80,.35)}}
.rrow button.rowbtn{grid-column:8;justify-self:end}
.reveal{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;min-height:118px}
.reveal .it{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);transition:opacity .3s}
.reveal .it.done{opacity:.4}
.reveal .it.now .rc{outline:3px solid var(--accent);outline-offset:3px}
.reveal .it .who{max-width:70px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700;color:var(--ink)}
.players{display:flex;flex-wrap:wrap;gap:10px}
.pl{min-width:120px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.18);display:flex;flex-direction:column;gap:4px}
.pl.me{border-color:rgba(255,159,74,.55)}
.pl .nm{font-weight:700;display:flex;gap:6px;align-items:center}
.pl .sc{font:900 30px/1 var(--f-display);font-variant-numeric:tabular-nums}
.pl .sc small{font:700 13px/1 var(--f-body);color:#ff9d8a;margin-left:6px}
.pl .st{font-size:12px;color:var(--muted)}
.pl .st.ok{color:var(--ok)}
.hand .cards{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;min-height:110px}
.hand .cards button{padding:0;border:0;background:none;border-radius:10px}
.hand .cards button .rc{transition:transform .15s ease;--w:72px}
.hand .cards button:not(:disabled):hover .rc{transform:translateY(-8px)}
.hand .cards button.sel .rc{transform:translateY(-14px);outline:3px solid var(--accent);outline-offset:3px}
.hand .cards button:disabled{cursor:default}
.hand .cards button:disabled .rc{filter:saturate(.7) brightness(.85)}
.handgap{width:6px;align-self:stretch;border-left:2px dashed var(--line-2);margin:0 4px}
.sp{--w:72px;width:var(--w);aspect-ratio:5/7;border-radius:10px;background:linear-gradient(165deg,color-mix(in srgb,var(--sc) 92%,#fff),color-mix(in srgb,var(--sc) 65%,#1a1530));color:#16122a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:6px 4px;text-align:center;border:2px solid color-mix(in srgb,var(--sc) 60%,#fff);box-shadow:0 8px 16px rgba(0,0,0,.28);position:relative}
.sp .ico{width:50%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.55);display:grid;place-items:center}
.sp .ico svg{width:62%;height:62%}
.sp b{font:800 11px/1.1 var(--f-body);hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.sp i{font:700 9px/1 var(--f-body);font-style:normal;opacity:.75}
.sp-schild{--sc:#9be38a}.sp-halb{--sc:#7fd6ff}.sp-besen{--sc:#ffb86b}.sp-tausch{--sc:#c9b8ff}.sp-leer{--sc:#e6e1d6}
.hand .cards button.sel .sp{transform:translateY(-14px);outline:3px solid var(--accent);outline-offset:3px}
.sp.mini{--w:42px;padding:3px 2px;gap:2px;border-radius:7px}.sp.mini b{font-size:7.5px}.sp.mini .ico{width:60%}
.picklist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.picklist button{padding:0;border:0;background:none;border-radius:10px}.picklist button.sel .rc{outline:3px solid var(--accent);outline-offset:2px}.picklist .rc{--w:48px}
.side .it{display:flex;gap:10px;align-items:flex-start}
.side .ic{width:30px;height:30px;border-radius:8px;background:var(--sc);color:#16122a;display:grid;place-items:center;flex:none}
.side .ic svg{width:18px;height:18px}
.side b{display:block;font-size:14px}
.side small{display:block;color:var(--muted);font-size:12.5px;line-height:1.35}
.legend{display:flex;flex-wrap:wrap;gap:6px}
.legend .rc{--w:34px}.legend .rc b{font-size:15px}
.spl{display:flex;flex-direction:column;gap:6px}
.spl .spx{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;border:1px solid var(--sc);background:color-mix(in srgb,var(--sc) 12%,transparent)}
.spl .spx .ic{width:32px;height:32px;border-radius:8px;background:var(--sc);color:#16122a;display:grid;place-items:center;flex:none}
.spl .spx .ic svg{width:18px;height:18px}
.spl .spx > div{flex:1;min-width:0}
.spl .spx small{display:block;color:var(--muted);font-size:12.5px}
.endbox{display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center;padding:20px 16px}
.endbox h2{font:900 clamp(40px,6vw,72px)/.95 var(--f-display);text-transform:uppercase}
.banner{border-color:rgba(255,159,74,.55);background:rgba(255,159,74,.08);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.rrow .rc{--w:inherit}
.rv-grid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.rv-left{position:sticky;top:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rv-left .players{flex-direction:column;flex-wrap:nowrap;gap:8px}
.rv-left .pl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center;min-width:0;min-height:84px}
.rv-left .pl .info{display:flex;flex-direction:column;gap:3px;min-width:0}
.rv-left .pl .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.rv-left .pl.now{border-color:var(--accent);box-shadow:0 0 0 2px rgba(255,159,74,.35)}
.plcard{display:flex;flex-direction:column;align-items:center;gap:3px;width:52px;position:relative}
.plcard small{font:700 11px/1 var(--f-body);color:var(--muted);white-space:nowrap;min-height:11px}
.plcard.done .rc{opacity:.5}
.plcard .ord{position:absolute;top:-6px;left:-4px;z-index:2;background:#17121f;color:var(--ink);border:1px solid var(--line-2);border-radius:99px;font:800 10px/1 var(--f-body);padding:2px 5px}
.rc.mini{--w:42px}.rc.mini b{font-size:19px}.rc.mini .horns svg{width:5px;height:5px}
.rc.back{background:repeating-linear-gradient(45deg,#3b2f5c 0 6px,#2c2346 6px 12px);border:2px solid var(--oc)}
.rc.empty{background:none;border:1.5px dashed var(--line-2);box-shadow:none}
.status{min-height:58px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.status.hot{border-color:rgba(255,159,74,.55);background:rgba(255,159,74,.08)}
@media (max-width:900px){.rv-grid{grid-template-columns:minmax(0,1fr)}.rv-left{position:sticky;top:0;z-index:5;background:var(--table);padding:6px 0;margin:-6px 0}.rv-left .players{flex-direction:row;overflow-x:auto;gap:6px}.rv-left .pl{min-width:150px;min-height:0;padding:6px 8px}.rv-left .pl .sc{font-size:22px}.rv-left .pl .st{display:none}.rv-left .label{display:none}}
@media (max-width:760px){.rrow{grid-template-columns:repeat(6,var(--w));--w:44px}.rrow .lbl{grid-column:1/-1;flex-direction:row;gap:10px;align-items:baseline}.rrow button.rowbtn{grid-column:1/-1;justify-self:start}.rc b{font-size:calc(var(--w) * .42)}.hand .cards button .rc{--w:56px}}
</style></head><body>
<div id="app"></div>
<script src="/common.js"></script>
<script>
(function(){
const esc = Spieleabend.esc;
const pen = v => v === 55 ? 7 : v % 11 === 0 ? 5 : v % 10 === 0 ? 3 : v % 5 === 0 ? 2 : 1;
const HORN = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 4c0 5 3 8 6 8h6c3 0 6-3 6-8-2 3-4 4-6 4H9C7 8 5 7 3 4zm5 9h8v3a4 4 0 0 1-8 0z"/></svg>';
const PCOL = ['#4fd1c5', '#b48cff', '#ff7ab6', '#7ddc6f', '#5aa9ff', '#ffd166', '#ff8a4a', '#e8e8e8', '#3fe0ff', '#d6ff6b'];
const pcol = (r, pid) => { const i = r.players.findIndex(p => p.id === pid); return PCOL[(i < 0 ? 0 : i) % PCOL.length]; };
const card = (v, extra, own) => { const p = pen(v); return '<div class="rc pen' + p + (extra || '') + (own ? ' own" style="--oc:' + own.c : '') + '" title="' + v + ' – ' + p + (p === 1 ? ' Strafpunkt' : ' Strafpunkte') + (own ? ' · gelegt von ' + esc(own.n) : '') + '"><span class="horns">' + HORN.repeat(p) + '</span><b>' + v + '</b><span class="horns">' + HORN.repeat(p) + '</span>' + (own ? '<span class="ownr">' + esc(own.n) + '</span>' : '') + '</div>'; };
const ownOf = (r, g, v) => { const pid = (g.owner || {})[v]; return pid ? { c: pcol(r, pid), n: pid === r.me ? 'Du' : api.pname(pid) } : null; };
const SP = {
  schild: { name: 'Schutzschild', text: 'Statt einer Zahl legen: Musst du danach das nächste Mal eine Reihe nehmen, bekommst du keine Strafpunkte.', ico: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/></svg>' },
  halb: { name: 'Halbe Strafe', text: 'Statt einer Zahl legen: Die nächste Reihe, die du danach nehmen musst, zählt nur halb.', ico: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 19L19 5"/><circle cx="7" cy="7" r="2.5" fill="currentColor"/><circle cx="17" cy="17" r="2.5" fill="currentColor"/></svg>' },
  besen: { name: 'Besen', text: 'Wähle eine Reihe: Alle Karten außer der letzten fliegen raus – niemand bekommt sie.', ico: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 2l2 2-7 7-2-2zM11 10l3 3-1 1c-1 4-4 7-9 8 1-5 4-8 8-9z"/></svg>' },
  tausch: { name: 'Tausch', text: 'Du suchst dir eine deiner Karten aus und gibst sie einem Mitspieler. Er gibt dir dafür eine zufällige Karte zurück.', ico: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h14l-4-4M20 16H6l4 4"/></svg>' }
};
SP.leer = { name: 'Leere Karte', text: 'Hat keinen Wert: Du spielst sie statt einer Zahl und musst diesen Zug nirgends anlegen.', ico: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 12h6"/></svg>' };
const PLAYABLE = ['besen', 'tausch', 'leer'];
const spMini = k => '<div class="sp mini sp-' + k + '"><span class="ico">' + SP[k].ico + '</span><b>' + SP[k].name + '</b></div>';
const AI = {
  clean: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.9 6.9 7.1.6-5.4 4.7 1.7 7.3L12 17.8 5.7 21.5l1.7-7.3L2 9.5l7.1-.6z"/></svg>',
  horn: HORN,
  full: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="2" y="7" width="3" height="10" rx="1"/><rect x="6" y="7" width="3" height="10" rx="1"/><rect x="10" y="7" width="3" height="10" rx="1"/><rect x="14" y="7" width="3" height="10" rx="1"/><rect x="18" y="7" width="4" height="10" rx="1" opacity=".5"/></svg>',
  low: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M5 13l7 7 7-7"/></svg>',
  big: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 4a4 4 0 0 1 8 0h3a1 1 0 0 1 1 1v15a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a1 1 0 0 1 1-1zm2 0h4a2 2 0 0 0-4 0z"/></svg>',
  angel: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l8 3v6c0 5-3.5 9-8 11-4.5-2-8-6-8-11V5z"/></svg>',
  five: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l10 18H2zm-1 7v5h2V9zm0 7v2h2v-2z"/></svg>'
};
const L = { lastSeq: 0, mode: null, pick: false, renderedSeq: 0, off: 0 };
const fmtT = ms => { const t = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); };

function spSettings(r, host) {
  const on = r.settings.specials || {}, all = Object.keys(SP).every(k => on[k]);
  return '<div class="field"><div class="row" style="justify-content:space-between;display:flex"><span class="label">Sonderkarten</span>' + (host ? '<button type="button" class="btn small" data-set="allSpecials" data-val="' + !all + '">' + (all ? 'Alle ausschalten' : 'Alle einschalten') + '</button>' : '') + '</div><div class="spl">' +
    Object.entries(SP).map(([k, x]) => '<div class="spx sp-' + k + '"><span class="ic">' + x.ico + '</span><div><b>' + x.name + '</b><small>' + x.text + '</small></div>' +
      (host ? '<button type="button" class="toggle" role="switch" aria-checked="' + !!on[k] + '" aria-label="' + x.name + '" data-set="sp_' + k + '" data-val="' + !on[k] + '"><i></i></button>' : '<span class="pill' + (on[k] ? ' live' : '') + '">' + (on[k] ? 'an' : 'aus') + '</span>') + '</div>').join('') +
    '</div><small class="muted">Jeder – auch die Bots – bekommt pro Runde eine Sonderkarte (höchstens 3 auf der Hand). Wer welche hat, sehen die anderen nicht.</small></div>';
}
function rowsHTML(g, r) {
  const me = r.me, choosingMe = g.phase === 'choose' && g.choosing && g.choosing.pid === me, besen = L.mode === 'besen' && g.phase === 'select';
  return '<div class="rows">' + g.rows.map((row, i) => {
    const pts = g.rowPts[i], pickable = choosingMe || (besen && row.length > 1);
    const cells = []; for (let k = 0; k < 6; k++) cells.push(row[k] != null ? card(row[k], k === row.length - 1 && L.popRow === i ? ' pop' : '', ownOf(r, g, row[k])) : (k === 5 ? '<div class="slot six">6. Karte<br>= nehmen</div>' : '<div class="slot"></div>'));
    return '<div class="rrow' + (pickable ? ' pick' : '') + (L.takenRow === i ? ' taken' : '') + '"' + (pickable ? ' data-act="' + (besen ? 'sweep' : 'take') + '" data-row="' + i + '" role="button" tabindex="0"' : '') + '>' +
      '<div class="lbl"><b>Reihe ' + (i + 1) + '</b><small class="' + (row.length >= 5 ? 'hot' : '') + '">' + pts + ' Strafpunkt' + (pts === 1 ? '' : 'e') + (row.length >= 5 ? ' · voll!' : '') + '</small></div>' + cells.join('') +
      (pickable ? '<button class="btn small primary rowbtn" data-act="' + (besen ? 'sweep' : 'take') + '" data-row="' + i + '">' + (besen ? 'Ausfegen' : 'Diese Reihe nehmen') + '</button>' : '') + '</div>';
  }).join('') + '</div>';
}
function renderGame(r, el) {
  const g = r.g; if (!g) { el.innerHTML = ''; return; }
  L.off = (g.now || Date.now()) - Date.now();
  const me = r.me, mine = r.players.some(p => p.id === me);
  const timer = g.deadline && r.status === 'playing' && (g.phase === 'select' || g.phase === 'choose') ? '<div class="timer" data-timer>' + fmtT(g.deadline - Date.now() - L.off) + '</div>' : '';
  const top = '<div class="panel rv-top"><div class="t"><b>Runde ' + g.round + '</b><span>Zug ' + Math.min(g.turn, g.turns) + ' von ' + g.turns + ' · Spielende bei ' + g.target + ' Strafpunkten</span></div>' + timer + '</div>';
  const nowX = g.revealed.find(x => !x.sp && x.row == null);
  const slot = p => {
    const i = g.revealed.findIndex(x => x.pid === p.id), x = g.revealed[i];
    if (x && x.sp) { const f = x.info || {}; return '<div class="plcard done"><span class="ord">' + (i + 1) + '.</span>' + spMini(x.sp) + '<small>' + (x.sp === 'besen' ? (f.row != null ? 'fegt R' + (f.row + 1) : 'Besen') : x.sp === 'tausch' ? (f.failed ? 'Tausch klappt nicht' : 'tauscht') : x.sp === 'schild' ? 'Schutz an' : x.sp === 'halb' ? 'Halb an' : 'legt nichts') + '</small></div>'; }
    if (x) return '<div class="plcard' + (x.row != null ? ' done' : '') + '"><span class="ord">' + (i + 1) + '.</span>' + card(x.v, ' mini') + '<small>' + (x.row != null ? (x.took ? 'nimmt R' + (x.row + 1) : '→ Reihe ' + (x.row + 1)) : nowX === x ? 'ist dran' : '') + '</small></div>';
    if (g.phase === 'select' && g.picked[p.id]) return '<div class="plcard"><div class="rc mini back" style="--oc:' + pcol(r, p.id) + '"></div><small>gewählt</small></div>';
    return '<div class="plcard"><div class="rc mini empty"></div><small>' + (g.phase === 'select' && r.status === 'playing' ? 'wählt …' : '') + '</small></div>';
  };

    const st = g.phase === 'roundEnd' ? (g.ready[p.id] ? '<span class="st ok">✓ bereit</span>' : '<span class="st">schaut …</span>') : '';

  if (e.kind === 'reveal') { S.play('flip');
    (e.specials || []).forEach((x, n) => setTimeout(() => {
      if (x.sp === 'besen' && x.row != null) { S.play('sweepfx'); api.toast(nm(x.pid) + ' fegt Reihe ' + (x.row + 1) + ' aus – ' + x.n + (x.n === 1 ? ' Karte fliegt' : ' Karten fliegen') + ' raus.'); }
      if (x.sp === 'tausch') api.toast(x.failed ? 'Der Tausch von ' + nm(x.pid) + ' hat nicht geklappt.' : x.target === r.me ? api.pname(x.pid) + ' gibt dir die ' + x.gave + ' und bekommt deine ' + x.got + '.' : x.pid === r.me ? 'Du gibst ' + api.pname(x.target) + ' die ' + x.gave + ' und bekommst die ' + x.got + '.' : api.pname(x.pid) + ' tauscht eine Karte mit ' + api.pname(x.target) + '.', 5000);
      if (x.sp === 'schild' || x.sp === 'halb') api.toast(nm(x.pid) + ' ' + (x.pid === r.me ? 'legst' : 'legt') + (x.sp === 'schild' ? ' ein Schutzschild: Die nächste Reihe kostet keine Strafpunkte.' : ' die Halbe Strafe: Die nächste Reihe zählt nur halb.'));
      if (x.sp === 'leer') api.toast(nm(x.pid) + ' ' + (x.pid === r.me ? 'spielst' : 'spielt') + ' die Leere Karte und legt nichts an.');
    }, n * 1600)); }
  if (e.kind === 'place') { S.play('place'); L.popRow = e.row; api.render(); }
  if (e.kind === 'take') {
    L.takenRow = e.row; L.popRow = e.row; api.render();
    if (e.shield || e.half) S.play('shield'); else S.play('take', e.pid === r.me ? 1 : .6);
    const why = e.reason === 'full' ? 'legt die 6. Karte in Reihe ' + (e.row + 1) : 'nimmt mit der ' + e.v + ' Reihe ' + (e.row + 1);
    api.toast(nm(e.pid) + ' ' + (e.pid === r.me ? why.replace('legt', 'legst').replace('nimmt', 'nimmst') : why) + ': ' + (e.shield ? 'Schutzschild – 0 statt ' + e.raw + ' Strafpunkte!' : e.half ? 'halbe Strafe – ' + e.pts + ' statt ' + e.raw + ' Strafpunkte.' : e.pts + (e.pts === 1 ? ' Strafpunkt.' : ' Strafpunkte.')) + (e.auto ? ' (Zeit abgelaufen)' : ''), 4500);
  }
  if (e.kind === 'choose' && e.pid === r.me) { S.play('error'); api.toast('Deine ' + e.v + ' ist zu klein – wähle eine Reihe, die du nimmst.', 5000); }
  if (e.kind === 'round' && e.round > 1) S.play('ok');
  if (e.kind === 'round' && e.gifts) { const mine = e.gifts.filter(x => x.pid === r.me); if (mine.length) setTimeout(() => api.toast('Neue Sonderkarte: ' + SP[mine[0].kind].name + '.'), 400); }
  if (e.kind === 'besen') { S.play('sweepfx'); api.toast(nm(e.pid) + ' fegt Reihe ' + (e.row + 1) + ' aus – ' + e.n + (e.n === 1 ? ' Karte fliegt' : ' Karten fliegen') + ' raus.'); }
  if (e.kind === 'tausch') { S.play('ok'); api.toast(e.target === r.me ? api.pname(e.pid) + ' tauscht mit dir: Du gibst die ' + e.got + ' ab und bekommst die ' + e.gave + '.' : e.pid === r.me ? 'Tausch mit ' + api.pname(e.target) + ': Du gibst die ' + e.gave + ' ab und bekommst die ' + e.got + '.' : api.pname(e.pid) + ' tauscht eine Karte mit ' + api.pname(e.target) + '.', 5000); }
  if (e.kind === 'timeout') api.toast('Zeit um! Für ' + e.pids.map(id => id === r.me ? 'dich' : api.pname(id)).join(', ') + ' wurde eine zufällige Karte gelegt.');
  if (e.kind === 'roundEnd') S.play('ok');
  if (e.kind === 'over') S.play('win');
}
// Uhr aktualisieren
setInterval(() => {
  const r = api.room; if (!r || !r.g || r.status !== 'playing') return;
  const g = r.g, ra = document.querySelector('[data-roundat]'); if (ra && g.roundAt) ra.textContent = 'Startet sonst automatisch in ' + fmtT(g.roundAt - Date.now() - L.off);
  const t = document.querySelector('[data-timer]'); if (!t || !g.deadline) return;
  const ms = g.deadline - Date.now() - L.off, s = Math.ceil(ms / 1000);
  t.textContent = fmtT(ms); t.classList.toggle('low', ms < 10000);
  if (s <= 5 && s > 0 && L.tick !== s && ((g.phase === 'select' && g.myPick == null && g.hand.length) || (g.phase === 'choose' && g.choosing && g.choosing.pid === r.me))) { L.tick = s; api.Snd.play('tick'); }
}, 250);
})();
</script>
